<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>קוצ׳יק וקישמיש</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4f1; --card:#fff; --ink:#24201d; --muted:#8c847c; --faint:#b9b2aa; --line:#ece7e1;
    --kochik:#17181b; --kochik-soft:#eceef1;      /* Maltese: snow white with black nose and eyes */
    --kishmish:#a8672d; --kishmish-soft:#f6e6d2;  /* Yorkshire puppy: tan and chestnut brown, black only as ink */
    --seg:#ebe7e1; --btn:var(--acc);
    --ok:#2f8a66; --ok-soft:#e7f4ee; --alert:#c64d68; --alert-soft:#fbeaee;
    --acc:var(--kishmish); --acc-soft:var(--kishmish-soft);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 96px)}
  /* Per-pet theme; the class is set on <html> and <body> by render(). */
  .p-kochik{--acc:var(--kochik);--acc-soft:var(--kochik-soft);
    --bg:#f7f8fa; --card:#fff; --ink:#131416; --muted:#80868e; --faint:#b6bcc3; --line:#e7e9ed; --seg:#e9ebef; --btn:#131416}
  .p-kishmish{--acc:var(--kishmish);--acc-soft:var(--kishmish-soft);
    --bg:#f5ede3; --card:#fffbf6; --ink:#1d1713; --muted:#8b7a69; --faint:#c2b3a2; --line:#eadecf; --seg:#eadfd1; --btn:#77471f}
  .wrap{max-width:520px;margin:0 auto}
  svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  svg.i.s{width:16px;height:16px}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:10px}
  .mark{width:36px;height:36px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center}
  .mark svg{width:20px;height:20px;fill:currentColor;stroke:none}
  h1{font-size:19px;margin:0;font-weight:600;letter-spacing:-.2px}
  .sync{display:flex;align-items:center;gap:6px;font:inherit;font-size:12px;color:var(--muted);border:0;background:none;padding:6px 0;cursor:pointer}
  .sync.login{background:var(--ink);color:#fff;border-radius:10px;padding:7px 13px;font-size:13px;font-weight:500}
  .sync.login i{display:none}
  .sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .sync.on i{background:var(--ok)} .sync.err i{background:var(--alert)}

  .seg{display:flex;background:var(--seg);border-radius:14px;padding:4px;margin-bottom:16px}
  .seg button{flex:1;border:0;background:none;border-radius:11px;padding:10px;font:inherit;font-size:15.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(40,30,20,.1)}
  .seg button.on[data-pet=kochik]{color:var(--kochik)} .seg button.on[data-pet=kishmish]{color:var(--kishmish)}

  main{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(40,30,20,.03)}
  .item{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center}
  .ic{width:44px;height:44px;border-radius:13px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
  .lbl{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .big{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.3px;line-height:1.25;direction:ltr;text-align:right}
  .big.txt{direction:rtl;font-size:22px}
  .big.none{color:var(--faint)}
  .sub{font-size:12.5px;color:var(--muted)}
  .acts{display:flex;flex-direction:column;align-items:stretch;gap:4px}
  .go{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:500;font-size:14.5px;color:#fff;background:var(--btn);cursor:pointer;white-space:nowrap;min-width:108px}
  .go:active{transform:scale(.97)}
  .ghost{border:0;background:none;color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;padding:4px}
  .card.live{border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:linear-gradient(0deg,var(--ok-soft),var(--ok-soft))}
  .card.live .ic{background:#fff;color:var(--ok)} .card.live .go{background:var(--ok)}
  .card.live.cry{border-color:color-mix(in srgb,var(--alert) 40%,transparent);background:var(--alert-soft)}
  .card.live.cry .ic{color:var(--alert)} .card.live.cry .go{background:var(--alert)}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
  .card.live .lbl{color:var(--ok);font-weight:500} .card.live.cry .lbl{color:var(--alert)}
  @keyframes pulse{50%{opacity:.25}}

  .meds-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .meds-h .ic{width:36px;height:36px;border-radius:11px}
  .meds-h b{font-weight:600;font-size:15px}
  .meds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .med{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;font:inherit;text-align:right;cursor:pointer;display:flex;gap:10px;align-items:center;color:var(--ink)}
  .med .ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;color:#fff}
  .med .ck svg{width:14px;height:14px;stroke-width:2.4}
  .med b{display:block;font-weight:500;font-size:14.5px}
  .med small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
  .med.done{border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:var(--ok-soft)}
  .med.done .ck{background:var(--ok);border-color:var(--ok)}
  .med.done small{color:var(--ok)}
  .med.late{border-color:color-mix(in srgb,var(--alert) 45%,transparent);background:var(--alert-soft)}
  .med.late .ck{border-color:var(--alert)} .med.late small{color:var(--alert);font-weight:500}

  h2{font-size:13px;color:var(--muted);font-weight:500;margin:18px 4px 2px;letter-spacing:.2px}
  .log{padding:4px 16px}
  .log .r{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
  .log .r:last-child{border-bottom:0}
  .log .r span{flex:1}
  .log .r time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .log .r svg{color:var(--acc)}
  .log .r[data-e]{cursor:pointer}
  h2 small{font-weight:400;color:var(--faint);margin-inline-start:6px}
  .empty{color:var(--faint);font-size:14px;padding:14px 0;text-align:center}

  .toast{position:fixed;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;bottom:calc(env(safe-area-inset-bottom) + 20px);background:var(--ink);color:#fff;border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:all .2s;white-space:nowrap;padding-right:14px}
  .toast{flex-wrap:wrap;justify-content:space-between}
  .toast .tw{flex-basis:100%;display:flex;gap:6px;padding-bottom:2px}
  .toast .tw:empty{display:none}
  .toast .tw button{flex:1;padding-left:9px;padding-right:9px}
  .toast .tw button.sel{background:#fff;color:var(--ink)}
  .lnk{border:0;background:none;padding:0;font:inherit;color:var(--acc);text-decoration:underline;cursor:pointer}
  .sub.hint{margin-top:2px;opacity:.85}
  .sub.fc{margin-top:3px;color:var(--ink);font-weight:500}
  .sub.fc i{display:none;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:baseline}
  .sub.fc.now i{display:inline-block;background:#fab219} .sub.fc.late i{display:inline-block;background:#d03b3b}
  .chips.mini{margin:2px 0 10px;gap:6px} .chips.mini button{padding:6px 10px;font-size:13px}
  .chips.where button{flex:1 1 40%;padding:14px 10px;font-size:16px;font-weight:500}
  /* charts: status colours for "where" (validated for colour-blind separation), neutral bands */
  .out{--c:#0ca30c} .pad{--c:#fab219} .acc{--c:#d03b3b} .unk{--c:#8a857d}
  .tl{padding:12px 14px}
  .tl-row{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:8px;padding:3px 0}
  .tl-d{font-size:12px;color:var(--muted);white-space:nowrap}
  .tl-t{position:relative;height:30px;background:var(--bg);border-radius:6px}
  .tl-t .g{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
  .tl-t .b{position:absolute;border-radius:4px}
  .b.crate{top:5px;bottom:5px;background:#dcc9b2}
  .b.sleep{top:11px;bottom:11px;background:#8f8aa6}
  .tl-t .f{position:absolute;top:4px;bottom:4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ink);opacity:.5}
  .tl-t .d{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;padding:0;border:2px solid var(--card);border-radius:50%;background:var(--c);cursor:pointer}
  .tl-t .d.poop{border-radius:3px}
  .tl-t .d::after{content:"";position:absolute;inset:-9px -5px}
  .tl-x{position:relative;height:14px;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  .tl-x span{position:absolute;transform:translateX(-50%)} .tl-x span:first-child{transform:none} .tl-x span:last-child{transform:translateX(-100%)}
  .lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
  .lg span{display:inline-flex;align-items:center;gap:5px}
  .lg .k{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c)}
  .lg .k.poop,.lg .k.sq{border-radius:2px}
  .lg .k.f{width:2px;height:11px;border-radius:1px;background:var(--ink);opacity:.5}
  .lg .k.b{width:16px;height:8px;border-radius:3px} .lg .k.b.crate{background:#dcc9b2} .lg .k.b.sleep{background:#8f8aa6}
  .wbc{padding:14px}
  .wb{display:flex;align-items:stretch;gap:2px;height:150px}
  .wb.few{gap:10px}
  .wb-c{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;border:0;background:none;padding:0;font:inherit;cursor:pointer}
  .wb-c i{width:100%;max-width:30px;border-radius:3px;background:var(--c)}
  .wb-c .n{font-size:11.5px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;margin-bottom:1px}
  .wb-c em{width:100%;height:20px;padding-top:4px;border-top:1px solid var(--faint);font-style:normal;font-size:11px;color:var(--muted);text-align:center;white-space:nowrap}
  .wh{font-style:normal}
  .wh.no{color:var(--muted)}
  .wh.floor,.wh.crate,.wh.home{color:var(--alert);font-weight:500}
  .rd{padding:12px 0;border-bottom:1px solid var(--line)} .rd:last-child{border-bottom:0}
  .rd-h{font-size:12.5px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
  .rd-h b{font-size:14px;font-weight:600;color:var(--ink)}
  .uni{padding:2px 16px}
  .uni .rd{padding:12px 0 2px}
  .uni .rd-h{margin-bottom:2px}
  .uni .r:last-child{border-bottom:0}
  .uni .r[data-live]{cursor:pointer;color:var(--ok);font-weight:500}
  h2 .lnk{font-size:inherit}
  .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:9px;padding:7px 12px;font:inherit;font-weight:500;cursor:pointer}

  .bg{position:fixed;inset:0;background:rgba(30,25,20,.3);display:none;align-items:flex-end;justify-content:center;z-index:5}
  .bg.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 20px)}
  .sheet h3{margin:0 0 16px;font-size:17px;font-weight:600}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chips button,.btn{border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:9px 13px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
  .field{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin-bottom:8px}
  .field input{font:inherit;font-size:17px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;color:var(--ink);background:#fff}
  .field input.kb{width:5.5em;text-align:center;font-variant-numeric:tabular-nums}
  .field input.bad{border-color:var(--alert);background:var(--alert-soft)}
  .foot{display:flex;gap:8px;margin-top:18px;justify-content:space-between}
  .sc{margin-top:10px;padding:10px 12px 12px;border:1px dashed var(--faint);border-radius:14px}
  .sc-h{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.35}
  .sc-b{display:flex;flex-wrap:wrap;gap:8px}
  .sc .btn.sel{background:var(--btn);border-color:var(--btn);color:#fff}
  .cyc-a .btn.sel{background:var(--btn);border-color:var(--btn);color:#fff}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);padding:10px 22px}
  .btn.danger{color:var(--alert);background:#fff}

  .gate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
  .gate[hidden]{display:none}
  .gate .box{max-width:340px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
  .gate .mark{width:56px;height:56px;border-radius:17px} .gate .mark svg{width:30px;height:30px}
  .gate h2{margin:6px 0 0;font-size:20px;font-weight:600;color:var(--ink);letter-spacing:0}
  .gate p{margin:0;font-size:14.5px;line-height:1.55;color:var(--muted)}
  .gate .btn.primary{font-size:16px;padding:13px 26px;border-radius:14px;margin-top:8px}
  .gate .ghost{margin-top:2px;font-size:13.5px}
  .gate .gerr{color:var(--alert);background:var(--alert-soft);border-radius:12px;padding:10px 12px;font-size:13.5px;text-align:right}
  .gate .gerr[hidden]{display:none}
  .hr{display:flex;align-items:center;gap:10px}
  .me{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:5px 10px;font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap}
  .by{font-style:normal;color:var(--muted);font-size:12px;margin-inline-start:6px}
  .chips button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chips.users button{flex:1;padding:14px 10px;font-size:16px;font-weight:500}
  .seg.sm{margin-top:-8px} .seg.sm button{padding:7px;font-size:14px}
  .card .seg{margin:0}
  .nav{display:flex;align-items:center;gap:8px;margin-top:12px}
  .nav .arr{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
  .nav .arr:disabled{opacity:.3;cursor:default}
  .nav .when{position:relative;flex:1;text-align:center;font-weight:600;font-size:16.5px;line-height:1.3}
  .nav .when small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
  .nav .when input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
  .exp{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  .exp span{flex:1}
  .exp .btn{flex:none;padding:8px 14px;font-weight:500}
  .logtx{width:100%;height:46vh;font:inherit;font-size:13px;line-height:1.5;border:1px solid var(--line);border-radius:12px;padding:10px;direction:rtl;background:var(--bg);color:var(--ink)}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .tiles.two{grid-template-columns:1fr 1fr}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
  button.tile{font:inherit;color:inherit;text-align:right;align-items:flex-start;cursor:pointer}
  .tile.on{border-color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
  .tile.dim{opacity:.5}
  .flt{font-size:12.5px;color:var(--muted);margin:0 4px -2px}
  .flt b{color:var(--ink);font-weight:600}
  .b.cry{top:5px;bottom:5px;background:#e0a0ae} .lg .k.b.cry{background:#e0a0ae}
  .tile .ic{width:34px;height:34px;border-radius:10px;margin-bottom:6px}
  .tile .ic svg{width:19px;height:19px}
  .tile b{font-size:25px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
  .tile b.t{font-size:18px;line-height:1.67}
  .tile span{font-size:13px;color:var(--muted)}
  .tile small{font-size:11.5px;color:var(--muted);opacity:.8}
  .tblc{padding:6px 14px}
  .tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  .tbl.wide{font-size:12.5px} .tbl.wide td,.tbl.wide th{padding-left:0;padding-right:0}
  .tbl th{font-weight:400;color:var(--acc);padding:9px 2px 7px}
  .tbl td{padding:10px 2px;text-align:center;border-top:1px solid var(--line)}
  .tbl td:first-child,.tbl th:first-child{text-align:right;color:var(--muted);white-space:nowrap}
  .tbl tr[data-day]{cursor:pointer}
  .tbl .z{color:var(--faint)}

  .cyc-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
  .cyc-h b{font-weight:600;font-size:15px}
  .cyc-h small{font-size:12.5px;color:var(--muted)}
  /* the routine as a ring: five segments clockwise from the top, the current one filled */
  .steps{position:relative;height:236px;max-width:340px;margin:2px auto 0}
  .ring{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;overflow:visible}
  .sg{color:var(--seg);fill:currentColor;stroke:currentColor;stroke-width:2.5;stroke-linejoin:round;transition:color .2s;cursor:pointer}
  .sg:hover{filter:brightness(.95)}
  .sg.nxt{stroke:var(--btn);stroke-width:2;stroke-dasharray:5 4;animation:nxt 2.4s ease-in-out infinite}
  @keyframes nxt{50%{stroke-opacity:.35}}
  .si.nxt{color:var(--btn)}
  .sg.done{color:color-mix(in srgb,var(--btn) 32%,var(--card))}
  .sg.cur{color:var(--btn)} .sg.cur.over{color:var(--alert)}
  .sg.lock{cursor:default;opacity:.55}
  .si{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;color:var(--muted);pointer-events:none}
  .si.done{color:var(--btn)} .si.cur{color:#fff} .si.lock{opacity:.55}
  .rc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:114px;text-align:center;pointer-events:none;line-height:1.3}
  .rc b{display:block;font-size:17px;font-weight:600;color:var(--ink)}
  .rc span{display:block;font-size:12px;color:var(--muted)}
  .rc .zzi{color:var(--ok);margin-bottom:1px}
  .steps .rl{border:0;background:none;font:inherit;cursor:pointer;position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:5px 4px;font:inherit;font-size:12.5px;color:var(--muted);white-space:nowrap;cursor:pointer}
  .steps .rl.r{transform:translate(0,-50%);text-align:left} .steps .rl.l{transform:translate(-100%,-50%);text-align:right}
  .steps .rl.r,.steps .rl.l{max-width:66px;white-space:normal;line-height:1.2}
  .steps .rl i{font-style:normal;opacity:.6;margin-inline-end:4px;font-variant-numeric:tabular-nums}
  .steps .rl:disabled{opacity:.45;cursor:default}
  .steps .rl.on{color:var(--ink);font-weight:600}
  .steps .rl.nxt{color:var(--btn);font-weight:500}
  .steps .rl.nxt::after{content:" ← הבא";font-size:11px;font-weight:400;opacity:.8}
  .duemsg{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--alert-soft);color:var(--alert);font-size:13.5px;font-weight:500}

// ---------- icons ----------

  plus:'<path d="M12 6v12M6 12h12"/>',
  chevR:'<path d="M9 6l6 6-6 6"/>',
  chevL:'<path d="M15 6l-6 6 6 6"/>',
  paw:'<path d="M12 12.3c-2.6 0-5.1 2.7-5.1 4.9 0 1.6 1.3 2.3 2.6 2.3 1 0 1.6-.5 2.5-.5s1.5.5 2.5.5c1.3 0 2.6-.7 2.6-2.3 0-2.2-2.5-4.9-5.1-4.9Z"/><ellipse cx="5.9" cy="10.2" rx="1.75" ry="2.15"/><ellipse cx="9.4" cy="6.2" rx="1.75" ry="2.25"/><ellipse cx="14.6" cy="6.2" rx="1.75" ry="2.25"/><ellipse cx="18.1" cy="10.2" rx="1.75" ry="2.15"/>'
};
const ico = (n, cls='') => `<svg class="i ${cls}" viewBox="0 0 24 24">${ICONS[n]}</svg>`;
document.getElementById('mark').innerHTML = `<svg viewBox="0 0 24 24">${ICONS.paw}</svg>`;

// ---------- model ----------
const PETS = {
  kochik:   {name:'קוצ׳יק', items:['food','pee','poop','gel'], meds:true, where:['out','balcony','home','pad']},   // Kochik is an adult: outside is the norm, the balcony or indoors happen sometimes
  kishmish: {name:'קישמיש', items:['crate','pee','poop','food','sleep','cry'], cycle:true, where:['gravel','pad','floor','crate','out']}
};
const ITEMS = {
  food:{lbl:'מאז האוכל האחרון',btn:'אכלה',log:'אכלה'},
  pee:{lbl:'מאז הפיפי האחרון',btn:'פיפי',log:'פיפי'},
  poop:{lbl:'מאז הקקי האחרון',btn:'קקי',log:'קקי'},
  // Ear gel for Kochik: given as needed (when she is not eating), roughly once in three days — so the
  // tile counts in days and hours instead of a running clock (`slow`), with a note of the usual rhythm.
  gel:{lbl:'מאז הג׳ל לאוזן האחרון',btn:'נתתי ג׳ל',log:'ג׳ל לאוזן',slow:true,note:'לפי הצורך · בערך פעם ב־3 ימים'},
  sleep:{dur:true,lbl:'שינה אחרונה',live:'ישנה',start:'נרדמה',stop:'התעוררה',log:'ישנה',startQ:'מתי נרדמה?'},
  cry:{dur:true,lbl:'בכי אחרון',live:'בוכה',start:'בוכה',stop:'נרגעה',log:'בכתה',startQ:'מתי התחילה לבכות?'},
  crate:{dur:true,lbl:'כלוב אחרון',live:'בכלוב',start:'נכנסה לכלוב',stop:'יצאה מהכלוב',log:'בכלוב',startQ:'מתי נכנסה לכלוב?'},
  none:{log:'יצאה ולא עשתה'},   // went out for potty and nothing happened; logged from the slim row under the poop tile
  water:{log:'שתתה'},   // she drank — so a missing pee can be read against whether she drank at all
  brk:{icon:'none',log:'הפסקה בשגרה'},
  nofood:{icon:'food',log:'לא אכלה'},   // offered food in the routine's food step and did not eat
  play:{icon:'ball',log:'משחק'},   // what kind of play it was (`y`), logged from the routine's play step   // taken out for potty, nothing happened (logged from the routine strip)
  med_am:{icon:'pill',log:'תרופת בוקר'},
  med_pm:{icon:'pill',log:'תרופת ערב'}
};
// The trainer's potty-training routine for pets with `cycle:true`: crate → walk + potty → play → food → potty → crate.
// The app works out the current step from the log (see `routine()`); these are just the five names.
const CYCLE = [{n:'כלוב'}, {n:'טיול וצרכים'}, {n:'משחק'}, {n:'אוכל'}, {n:'צרכים'}];
// Where a pee / poop happened; stored as `w` on the log entry (optional).
const WHERE = {out:'בחוץ', gravel:'על החצץ במרפסת', balcony:'במרפסת', pad:'על הפד', home:'בבית', floor:'על הרצפה', crate:'בכלוב'};   // floor and crate are accidents (shown in red)
// The choices offered per pet, best place first. Kishmish is not vaccinated yet and does not go outside: her target is the gravel on the balcony.
const whereKeys = p => PETS[p].where || Object.keys(WHERE);
const WHERE_SHORT = {out:'בחוץ', gravel:'חצץ', balcony:'מרפסת', pad:'פד', home:'בית', floor:'רצפה', crate:'כלוב'};
const hasWhere = k => k==='pee' || k==='poop';
const CRATE_MAX = 2*3600000;   // a crate stay longer than this turns red (tile and strip)
const DAY_FROM = 7, DAY_TO = 22;   // the red crate flag is only shown between these hours
// Kinds of play, stored as `y` on a `play` log entry. Several can be marked in one play step.
const PLAY = {rope:'חבל', kong:'קונג ממולא', lick:'משטח ליקוק', train:'אילוף עם אוכל'};
// These kinds are a meal too (she is tiny): the play step then logs one `food` entry, tagged `y:"play"`.
const PLAY_FOOD = {kong:true, lick:true, train:true};
const STEP_SEC = ['crate','potty','play','food','potty'];   // which group of tiles each wheel step jumps to
const STEP_ICON = ['crate','paw','ball','food','pee'];   // one per CYCLE step, drawn on its ring segment
const DUE_MAX = 60*60000;   // the "take her out" reminder gives up after an hour
const iconOf = k => (ITEMS[k] && ITEMS[k].icon) || k;
const LOG_MAX = 5000, LS_KEY = 'pets-timers-v1', LS_DATA = 'pets-timers-v2';
const SCHEMA = 2;   // version of the saved data; see `norm()` and the Firestore rule

const USERS = {yonatan:'יונתן', shai:'שי', liza:'ליזה'};   // who is using this device; stamped on every log entry as `by`
let me = null;
let state = blank(), pet = 'kishmish';
let V = null;   // everything the screen shows about the pets, computed from `state.log` by `derive`; never saved
let ref = null, writing = false, dirty = false, lastUndo = null, toastTimer = null;

function blank(){ return {v:SCHEMA, log:[]}; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
// THE RULE: the saved data is one list of entries (`state.log`) and nothing else that matters. Last
// times, running timers, the medication checklist, rounds, the wheel — all of it is computed from the list
// (`derive`, `routine`, `roundStarts`…) every time it is shown. Earlier versions also saved some of those
// as separate numbers, and a phone holding older information could overwrite them: a tile said "last pee
// 22 hours ago" while the list had today's. Do not add saved state that the list could tell you.
//
// An entry: { id, p, k, t, end?, w?, y?, by? }. A timer kind (crate / sleep / cry) with no `end` is running.
// `id` is the entry's identity for syncing; changing its time or place keeps the id.
const isLive = e => !!ITEMS[e.k].dur && e.end == null;
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function norm(s){   // any saved or received data -> the current shape (also upgrades version-1 data)
  const b = blank();
  if(!s || typeof s !== 'object') return b;
  b.log = Array.isArray(s.log) ? clone(s.log).filter(e => e && ITEMS[e.k] && PETS[e.p] && typeof e.t === 'number') : [];
  if(s.legacy) b.legacy = clone(s.legacy);
  if(!(s.v >= 2)){
    // Version 1 kept a pet object next to the list. It is preserved untouched under `legacy` (nothing reads
    // it), and the one fact that only lived there — a running timer's start — becomes an entry.
    b.legacy = {};
    for(const p of Object.keys(PETS)){
      if(!s[p] || typeof s[p] !== 'object') continue;
      b.legacy[p] = clone(s[p]);
      for(const k of Object.keys(ITEMS)){ const st = ITEMS[k].dur && s[p][k] && s[p][k].start; if(typeof st === 'number') b.log.push({p, k, t:st}); }
    }
  }

  const seen = new Set();
  b.log = b.log.filter(e => { if(!e.id) e.id = `m:${e.p}|${e.k}|${e.t}${e.end != null ? '|'+e.end : ''}`; if(seen.has(e.id)) return false; seen.add(e.id); return true; });
  b.log.sort((x,y) => x.t-y.t);
  return b;

// ---------- no accidental doubles ----------
// Tapping the same button twice within two minutes asks first. (On 23.11 the same entries were logged
// twice at 15:54 and at 16:00.) Entries given an explicit time ("שעה אחרת") are not checked.
let DUP_MS = 2*60000;
function recentDouble(p, same){ const now = Date.now(); return state.log.filter(e => e.p===p && same(e) && Math.abs(now - e.t) < DUP_MS).pop() || null; }
function askAgain(e, label, yes){
  sh.innerHTML = `<h3>כבר נרשם</h3><div class="sub" style="font-size:14.5px;margin-bottom:18px">${label} כבר נרשם ב־<bdi dir="ltr">${clock(e.t)}</bdi>${USERS[e.by] ? ' על ידי ' + USERS[e.by] : ''}. לרשום שוב?</div>
    <div class="foot"><button class="btn" id="cancel">לא, זו טעות</button><button class="btn primary" id="ok">לרשום שוב</button></div>`;
  sh.querySelector('#cancel').onclick = close;
  sh.querySelector('#ok').onclick = () => { close(); yes(); };
  bg.classList.add('show');
}

// ---------- "ניסיון חוזר" (retry) ----------
// The trainer's rule: when she is taken out and does nothing ("לא עשתה"), she goes back into the crate for
// about 10 minutes and is taken to the gravel again — as many times as it takes. Until she pees there is no
// play and no free time; food stays available (a one-kilo Yorkie must not skip meals).
// Like everything else this is worked out from the list, nothing is stored on the side:
//   - retry mode is on when the latest of {pee, "nothing"} is a "nothing" (not dismissed: `x`), no ordinary
//     crate stay began after it, and it is recent or its retry crate stay is still open;
//   - a retry crate stay is a crate entry with `r` = the countdown in minutes; it does not start a new round;
//   - a pee ends the mode. On the gravel (or outside) it starts free time; on the pad it counts as a miss.
const RETRY = {def:10, opts:[5,8,10,12,15], life:3*3600000};
const FREE = {min:15, max:20};      // minutes of freedom after a pee in the right place
let retryMin = RETRY.def;
try { const m = +localStorage.getItem(LS_KEY+'-retrymin'); if(m >= 5 && m <= 15) retryMin = m; } catch(e){}
function retry(p){
  if(!PETS[p].cycle) return null;
  const L = state.log.filter(e => e.p===p), now = Date.now();
  let N = null, tries = 0;
  for(let i = L.length-1; i >= 0; i--){
    const e = L[i];
    if(e.k === 'pee') break;
    if(e.k === 'none'){ if(!N){ if(e.x) return null; N = e; } tries++; }
  }
  if(!N) return null;
  if(L.some(e => e.k==='crate' && !e.r && e.t > N.t)) return null;          // an ordinary crate stay: the retry is over
  const C = L.filter(e => e.k==='crate' && e.r && e.t >= N.t).pop() || null;  // the retry stay after this "nothing"
  if(!(C && C.end == null) && now - Math.max(N.t, C ? C.end : 0) > RETRY.life) return null;
  const until = C ? C.t + C.r*60000 : 0;
  return {none:N, crate:C, tries, until, state: !C ? 'toCrate' : C.end != null ? 'again' : now >= until ? 'again' : 'wait'};
}
function freeTime(p){
  if(!PETS[p].cycle) return null;
  const pe = state.log.filter(e => e.p===p && e.k==='pee').pop(), now = Date.now();
  if(!pe || !(pe.w === 'gravel' || pe.w === 'out')) return null;
  if(state.log.some(e => e.p===p && e.k==='crate' && e.t > pe.t)) return null;   // back in the crate: free time is over
  const el = now - pe.t; if(el > (FREE.max + 20)*60000) return null;
  return {t:pe.t, phase: el < FREE.min*60000 ? 'run' : el < FREE.max*60000 ? 'end' : 'over'};
}
function retryHTML(p){
  const r = retry(p); if(!r) return '';
  const C = r.crate, open = C && C.end == null, mins = open ? C.r : retryMin, name = PETS[p].name;
  const pick = `<div class="chips mini">${RETRY.opts.map(m => `<button data-act="rtmin" data-k="${m}" class="${m===mins?'sel':''}">${m} דק׳</button>`).join('')}</div>`;
  const body = r.state === 'toCrate'
    ? `<p><b>לא עשתה.</b> חזרה לכלוב ל־${retryMin} דקות, ואז מנסים שוב בחצץ.</p>${pick}
       <div class="rt-a"><button class="go" data-act="rtcrate">נכנסה לכלוב</button></div>`
    : r.state === 'wait'
    ? `<p>${name} בכלוב. מנסים שוב בחצץ בעוד:</p><div class="big" data-until="${r.until}">${dur(r.until - Date.now())}</div>${pick}
       <div class="rt-a"><button class="ghost" data-act="rtout">${ico('clock','s')}הוצאתי אותה כבר</button></div>`
    : `<p><b>לנסות שוב בחצץ.</b>${open ? ` עברו ${C.r} הדקות.` : ''} מה קרה?</p>
       <div class="rt-a"><button class="go" data-act="rtpee">פיפי</button><button class="btn" data-act="rtnone">לא עשתה</button></div>`;
  return `<div class="card retry ${r.state}">
    <div class="rt-h"><b>ניסיון חוזר</b><small>${r.tries > 1 ? `ניסיון ${r.tries} · ` : ''}משחק וחופש רק אחרי פיפי · אוכל אפשר גם בכלוב</small></div>
    <div class="sub" style="margin-bottom:8px">${V[p].water ? `שתתה לאחרונה: ${dayLabel(V[p].water)} <bdi dir="ltr">${clock(V[p].water)}</bdi> (לפני ${words(Date.now() - V[p].water)})` : 'לא נרשמה שתייה. אם היא לא שתתה, ייתכן שאין לה פיפי.'}</div>
    ${body}<button class="lnk rt-x" data-act="rtstop">לסיים את הניסיון החוזר</button></div>`;
}
function retryAct(p, a, k, sure){
  const r = retry(p); if(!r) return;
  const C = r.crate, open = C && C.end == null, now = Date.now(), name = PETS[p].name;
  const find = e => state.log.find(x => x.id === e.id);
  if(a === 'rtmin'){
    const m = +k; if(!(m >= 5 && m <= 15)) return;
    retryMin = m; try { localStorage.setItem(LS_KEY+'-retrymin', String(m)); } catch(e){}
    if(open) commit('', () => { find(C).r = m; }, {quiet:true}); else render();
  }
  else if(a === 'rtcrate') tapDur(p, 'crate');                                   // tapDur makes it a retry stay
  else if(a === 'rtout') commit(`${name} · ${ITEMS.crate.stop}`, () => { stopDur(p, 'crate', now); });
  else if(a === 'rtpee' || a === 'rtnone'){
    const kind = a === 'rtpee' ? 'pee' : 'none', d = !sure && recentDouble(p, x => x.k === kind);
    if(d){ askAgain(d, ITEMS[kind].log, () => retryAct(p, a, k, true)); return; }
    const e = {p, k: kind, t: now};
    commit(`${name} · ${ITEMS[e.k].log}`, () => { if(open) stopDur(p, 'crate', now); state.log.push(e); });
    if(e.k === 'pee' && e.id) whereSheet(e.id);
  }
  else if(a === 'rtstop') commit(`${name} · הניסיון החוזר הסתיים`, () => { find(r.none).x = 1; if(open) delete find(C).r; });
}
// Free time after a pee in the right place; locked while a retry is on.
function freeCardHTML(p){
  if(retry(p)) return `<div class="card slim locked"><span><b>חופש</b><small>אחרי פיפי</small></span>${ico('none','s')}</div>`;
  const f = freeTime(p); if(!f) return '';
  const a = f.t + FREE.min*60000, b = f.t + FREE.max*60000, span = `<bdi dir="ltr">${clock(a)}–${clock(b)}</bdi>`;
  const txt = f.phase === 'run' ? `עוד <span data-until="${a}">${dur(a - Date.now())}</span> לפחות · עד ${span}`
    : f.phase === 'end' ? `זמן לסיים · עד <bdi dir="ltr">${clock(b)}</bdi>` : `זמן החופש נגמר · חזרה לשגרה`;
  return `<div class="card slim free ${f.phase}"><span><b>חופש: ${FREE.min}–${FREE.max} דקות</b><small>${txt}</small></span>${ico('paw','s')}</div>`;
}
// The tiles that move the routine on right now — they get a "עכשיו בשגרה" tag, so someone opening the
// app for the first time can see what to press without knowing how the wheel works.
function routineTap(p){
  const r = routine(p);
  if(!r || r.done) return ['crate'];
  if(r.brk || r.retry) return [];          // during a retry the card at the top says what to do
  return r.i === 0 ? ['crate'] : r.i === 2 ? ['play','food'] : ['pee','poop','none'];
}
// Put the routine on hold (vet, a trip…): just an entry in the log. Whatever is logged next resumes it.
function goBreak(p){
  commit(`${PETS[p].name} · הפסקה בשגרה`, () => { const now = Date.now(); stopDur(p, 'sleep', now); state.log.push({p, k:'brk', t:now}); });
}
// Where she is in the trainer's routine. This is worked out from what was logged on the tiles — it is
// never stored and cannot be tapped — so the wheel and the tiles are one thing:
//   in the crate                                   → כלוב            (next: walk + potty)
//   out of the crate, nothing logged yet           → טיול וצרכים      (next: play)
//   a pee / poop / "nothing"                        → משחק            (next: food)
//   a meal, or "did not eat"                        → צרכים           (next: crate)
//   a pee / poop / "nothing" after that meal        → round done      (next: crate)
// Only entries since she last left the crate count (or since midnight when there is no stay yet today).
function routine(p){
  const S = V[p], now = Date.now(), day0 = sod(now).getTime(), rt = retry(p);
  const inRetryCrate = !!(rt && rt.crate && rt.crate.end == null);
  if(S.crate.start && !inRetryCrate) return {i:0, t:S.crate.start, next:1};
  // "since she last left the crate" means an ordinary stay; the short retry stays do not count
  const lastOut = Math.max(0, ...state.log.filter(e => e.p===p && e.k==='crate' && !e.r && e.end != null).map(e => e.end));
  const out = lastOut >= day0 ? lastOut : 0, base = out || day0;
  const ev = state.log.filter(e => e.p===p && e.t >= base && !ITEMS[e.k].dur);
  const went = e => e.k==='pee' || e.k==='poop', isM = e => e.k==='food' || e.k==='nofood';
  const last = ev[ev.length-1];
  if(last && last.k === 'brk') return {brk:true, t:last.t, next:0};
  const meal = ev.filter(isM).pop();
  // "After the meal" is judged by position in the log, which is kept in time order.
  if(meal){ const mi = ev.indexOf(meal), after = ev.find((e, j) => went(e) && j > mi); return after ? {i:4, t:after.t, done:true, next:0} : {i:4, t:meal.t, next:0, retry:!!rt}; }
  const first = ev.find(went);
  if(first) return {i:2, t:first.t, next:3};
  return out || rt ? {i:1, t: rt ? rt.none.t : out, next:2, retry:!!rt} : null;
}
// Rounds are a view of the log, not separate data: a round begins each time she goes into the crate
// (a crate entry in the log, or the running crate timer). The wheel's round number, the grouped list on
// the main screen and the day view in the summary all read this one list, so the tiles, the history and
// the rounds cannot disagree. Numbered per day. (`hist` only remembers the wheel's moves for "חזרה שלב".)
function roundStarts(p){
  const ts = state.log.filter(e => e.p===p && e.k==='crate' && !e.r).map(e => e.t);   // finished stays and the running one; not the short retry stays
  ts.sort((x,y) => x-y);
  const out = [], perDay = {};
  for(const t of ts){
    if(out.length && t - out[out.length-1].t < 60000) continue;   // the same stay entered twice
    const day = dayKey(t); perDay[day] = (perDay[day] || 0) + 1;
    out.push({t, day, n:perDay[day]});
  }
  out.forEach((r, i) => { r.end = out[i+1] ? out[i+1].t : null; });
  return out;
}
function roundName(r){ const dl = dayLabel(r.t); return `סבב ${r.n}${dl==='היום' ? '' : ' · '+dl}`; }
// One pet's entries in [from, to), oldest first, with the running timers as rows of their own.
function entriesIn(p, from, to){
  return state.log.filter(e => e.p===p && e.t >= from && e.t < to).sort((x,y) => x.t - y.t);
}
// A day's entries grouped by round: newest round first, the entries inside a round in the order they happened.
function groupedHTML(p, from, to){
  const rs = roundStarts(p).filter(r => r.t >= from && r.t < to), parts = [];
  const rows = ev => ev.length ? ev.map(logRow).join('') : `<div class="empty">אין רישומים</div>`;
  for(const r of rs.slice().reverse())
    parts.push(`<div class="rd"><div class="rd-h"><b>${roundName(r)}</b><span>התחיל ב־<bdi dir="ltr">${clock(r.t)}</bdi> · ${r.end ? 'נמשך '+words(r.end-r.t) : 'עכשיו'}</span></div>${rows(entriesIn(p, r.t, Math.min(r.end || Infinity, to)))}</div>`);
  const lead = entriesIn(p, from, rs.length ? rs[0].t : to);
  if(lead.length) parts.push(`<div class="rd"><div class="rd-h"><b>${rs.length ? 'לפני הסבב הראשון' : 'בלי סבב'}</b></div>${rows(lead)}</div>`);
  return parts.join('') || `<div class="empty">אין עדיין רישומים</div>`;
}
// Add an entry at a chosen time (for something that was missed), from the list's header.
function openAddSheet(p){
  const kinds = PETS[p].cycle ? ['pee','poop','none','food'] : ['pee','poop','food'];
  let k = kinds[0];
  sheet(`${PETS[p].name} · הוספת רישום`,
    `<div class="chips">${kinds.map(x => `<button data-kind="${x}" class="${x===k?'sel':''}">${ITEMS[x].log}</button>`).join('')}</div>
     <div class="sub" style="margin-bottom:8px">מתי?</div>${chips([5,10,15,30,60])}<label class="field">או בשעה ${timeField("tIn", nowStr())}</label>`,
    cancelBtn, () => { const v = timeVal('tIn'); if(!v) return; close(); tapPoint(p, k, timeToTs(v)); }, ts => tapPoint(p, k, ts));
  sh.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { k = b.dataset.kind; sh.querySelectorAll('[data-kind]').forEach(x => x.classList.toggle('sel', x === b)); });
}
// When a puppy needs to go out (trainer's list): after waking up, leaving the crate, playing or eating.
// Returns the latest such moment if nothing (pee, poop, or "went out, nothing") was logged since.
function pottyDue(p){
  const S = V[p], c = [];
  if((S.sleep && S.sleep.start) || (S.crate && S.crate.start) || retry(p)) return null;   // a retry has its own card
  if(S.sleep && S.sleep.lastEnd) c.push([S.sleep.lastEnd, 'אחרי שינה']);
  if(S.crate && S.crate.lastEnd) c.push([S.crate.lastEnd, 'אחרי יציאה מהכלוב']);
  if(typeof S.food === 'number') c.push([S.food, 'אחרי אוכל']);
  const fc = peeForecast(p);
  if(fc && fc.state !== 'soon') c.push([fc.from, 'לפי הקצב הרגיל שלה']);
  c.sort((a,b) => b[0]-a[0]);
  if(!c.length) return null;
  const done = Math.max(S.pee || 0, S.poop || 0, S.none || 0, S.out || 0);
  if(done >= c[0][0] || Date.now() - c[0][0] > DUE_MAX) return null;
  return {t:c[0][0], why:c[0][1]};
}
function dayKey(t){ const d=new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function medsOf(p){ return V[p].meds[dayKey(Date.now())] || {}; }
function setMed(p, slot, ts){   // the checklist is just today's medication entries
  const k = 'med_'+slot;
  commit(`${PETS[p].name} · ${ITEMS[k].log}${ts?'':' בוטלה'}`, () => {
    const day = dayKey(Date.now());
    state.log = state.log.filter(e => !(e.p===p && e.k===k && dayKey(e.t)===day));
    if(ts) state.log.push({p, k, t:ts});
  });
}

// ---------- formatting ----------
function pad(n){ return String(n).padStart(2,'0'); }
function dur(ms){
  const s = Math.floor(Math.max(0,ms)/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  return h ? `${h}:${pad(m)}:${pad(s%60)}` : `${m}:${pad(s%60)}`;
}
function words(ms){
  const m = Math.round(Math.max(0,ms)/60000);
  if(m < 1) return 'פחות מדקה';
  if(m < 60) return m===1 ? 'דקה' : `${m} דקות`;
  const h = Math.floor(m/60), r = m%60;
  return (h===1?'שעה':h===2?'שעתיים':`${h} שעות`) + (r ? ` ו־${r} דק׳` : '');
}
function wordsLong(ms){   // for things counted in days: "יומיים ו־5 שעות"
  const hrs = Math.floor(Math.max(0, ms) / 3600000), d = Math.floor(hrs / 24), r = hrs % 24;
  if(hrs < 1) return words(ms);
  const hw = n => n === 1 ? 'שעה' : n === 2 ? 'שעתיים' : `${n} שעות`;
  if(!d) return hw(hrs);
  return (d === 1 ? 'יום' : d === 2 ? 'יומיים' : `${d} ימים`) + (r ? ` ו־${hw(r)}` : '');
}
function clock(t){ const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function dayLabel(t){
  const d = new Date(t), n = new Date(), y = new Date(); y.setDate(n.getDate()-1);
  if(d.toDateString()===n.toDateString()) return 'היום';
  if(d.toDateString()===y.toDateString()) return 'אתמול';
  return `${d.getDate()}.${d.getMonth()+1}`;
}
function todayTotal(p, k){
  const s = new Date(); s.setHours(0,0,0,0); const s0 = s.getTime(), now = Date.now();
  let tot = 0;
  for(const e of state.log) if(e.p===p && e.k===k){ const end = e.end == null ? now : e.end; if(end > s0) tot += end - Math.max(e.t, s0); }
  return tot;
}

// ---------- render ----------
function render(){
  document.body.className = document.documentElement.className = 'p-'+pet;
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.pet===pet || b.dataset.view===view));
  const side = document.getElementById('side'); side.innerHTML = '';
  document.getElementById('main').className = view === 'now' && PETS[pet].cycle ? 'grps' : '';
  if(view==='sum'){ document.getElementById('main').innerHTML = renderSummary(); return; }
  const P = PETS[pet], S = V[pet];
  let h = '';

  if(P.meds){
    const m = medsOf(pet), hr = new Date().getHours();
    const slot = (s, lbl, lateHour) => {
      const t = m[s], late = !t && hr >= lateHour;
      return `<button class="med ${t?'done':''} ${late?'late':''}" data-act="med" data-k="${s}">
        <span class="ck">${t?ico('check'):''}</span>
        <span><b>${lbl}</b><small>${t?'ניתנה ב־'+clock(t)+byOf(pet,'med_'+s,t):(late?'עוד לא ניתנה':'לא ניתנה')}</small></span></button>`;
    };
    h += `<div class="card medc"><div class="meds-h"><div class="ic">${ico('pill')}</div><b>תרופות היום</b></div>
      <div class="meds">${slot('am','בוקר',11)}${slot('pm','ערב',21)}</div></div>`;
  }

  // Alerts, the retry card and the wheel live in the side column: on a computer it stays in place while
  // the tiles scroll; on a phone it is simply the top of the page.
  if(P.cycle) side.innerHTML = alertsHTML(pet) + retryHTML(pet) + cycleHTML(pet);

  const tap = P.cycle ? routineTap(pet) : [];
  const tileOf = k => {
    const it = ITEMS[k], nowt = tap.includes(k) ? 'nowt' : ''; let h = '';
    if(!it.dur){
      const t = S[k];
      h += `<div class="card item ${nowt}">
        <div class="ic">${ico(k)}</div>
        <div><div class="lbl">${it.lbl}</div>
          ${it.slow ? `<div class="big txt ${t?'':'none'}">${t ? wordsLong(Date.now()-t) : '–'}</div>`
                    : `<div class="big ${t?'':'none'}" ${t?`data-since="${t}"`:''}>${t ? dur(Date.now()-t) : '–'}</div>`}
          <div class="sub">${t ? `${dayLabel(t)} ב־${clock(t)}${whereOf(pet,k,t) || (hasWhere(k) ? ` · <button class="lnk" data-act="where" data-k="${k}">איפה?</button>` : '')}${byOf(pet,k,t)}` : 'עוד לא נרשם'}</div>
          ${P.cycle && k === 'pee' ? forecastLine(pet) : ''}${todayWhere(pet,k) ? `<div class="sub hint">${todayWhere(pet,k)}</div>` : ''}${P.cycle && typical(pet,k) ? `<div class="sub hint">${typical(pet,k)}</div>` : ''}${it.note ? `<div class="sub hint">${it.note}</div>` : ''}</div>
        <div class="acts"><button class="go" data-act="pt" data-k="${k}">${it.btn}</button>
          <button class="ghost" data-act="edit" data-k="${k}">${ico('clock','s')}שעה אחרת</button>
          ${P.cycle && k === 'food' ? `<button class="ghost" data-act="nofood">${ico('none','s')}לא אכלה</button>` : ''}</div></div>`;
    } else {
      const d = S[k] || {}, live = !!d.start, tt = todayTotal(pet,k);
      let lbl, big, sub;
      if(live){
        lbl = `<span class="dot"></span>${it.live} כבר`;
        big = `<div class="big" data-since="${d.start}">${dur(Date.now()-d.start)}</div>`;
        sub = `מ־${clock(d.start)}`;
      } else if(d.lastEnd){
        lbl = it.lbl;
        big = `<div class="big txt">${words(d.lastEnd-d.lastStart)}</div>`;
        sub = `לפני <span data-words="${d.lastEnd}">${words(Date.now()-d.lastEnd)}</span>`;
      } else { lbl = it.lbl; big = `<div class="big none">–</div>`; sub = 'עוד לא נרשם'; }
      const cur = live ? Date.now()-d.start : (d.lastEnd ? d.lastEnd-d.lastStart : 0);
      if(tt > cur + 60000) sub += ` · סה״כ היום <span data-total="${k}">${words(tt)}</span>`;
      const over = k==='crate' && crateOver(pet);
      if(over) sub += ` · יותר מ${words(CRATE_MAX)}`;

      const what = (live ? it.live : it.log) + (PLAY[e.y] ? ` · ${PLAY[e.y]}` : e.y === 'play' ? ' · במשחק' : '') + (WHERE[e.w] ? ` · ${WHERE[e.w]}` : '')

document.getElementById('shell').addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if(go){ goSec(go.dataset.go); return; }
  if(e.target.id === 'sumDate'){ try{ e.target.showPicker(); }catch(_){} return; }
  const ent = e.target.closest('.r[data-e], .d[data-e]');
  if(ent){ openEntrySheet(+ent.dataset.e); return; }
  const lv = e.target.closest('.r[data-live]');
  if(lv){ openSheet(pet, lv.dataset.live); return; }
  const row = e.target.closest('[data-day]');
  if(row){ sumMode = 'day'; sumAnchor = +row.dataset.day; render(); window.scrollTo(0,0); return; }
  const b = e.target.closest('button'); if(!b) return;
  const k = b.dataset.k, a = b.dataset.act;
  if(a==='mode'){ sumMode = k; render(); }
  else if(a==='copylog') exportLog(false);
  else if(a==='sharelog') exportLog(true);
  else if(a==='filt'){ sumFilter = sumFilter === k ? null : k; render(); }
  else if(a==='prev' || a==='next'){ sumShift(a==='prev' ? -1 : 1); render(); }
  else if(a==='addev') openAddSheet(pet);
  else if(a==='brk') goBreak(pet);
  else if(a && a.startsWith('rt')) retryAct(pet, a, k);
  else if(a==='help') openHelp();
  else if(a==='play') logPlay(pet, k);
  else if(a==='nofood') logNoFood(pet);
  else if(a==='where'){ const e = state.log.filter(x => x.p===pet && x.k===k).pop(); if(e) whereSheet(e.id); }
  else if(a==='pt') tapPoint(pet, k);
  else if(a==='dur') tapDur(pet, k);
  else if(a==='edit') openSheet(pet, k);
  else if(a==='med'){ if(medsOf(pet)[k]) openMedSheet(pet, k); else setMed(pet, k, Date.now()); }
});
function showToast(msg, undo){
  lastUndo = undo; document.getElementById('undo').hidden = false;
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastWhere').innerHTML = '';
  const t = document.getElementById('toast'); t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.classList.remove('show'); lastUndo=null; }, 6000);
}
// Right after a pee / poop is logged, ask where it happened (the charts depend on it). The entry is
// already saved with its time; this only adds `w`. "דילוג" leaves it unmarked, and the tile then shows "איפה?".
function whereSheet(id){
  const find = () => state.log.find(e => e.id === id);
  const e = find(); if(!e) return;
  sh.innerHTML = `<h3>${PETS[e.p].name} · ${ITEMS[e.k].log} · <bdi dir="ltr">${clock(e.t)}</bdi> — איפה?</h3>
    <div class="chips where">${whereKeys(e.p).map(w => `<button data-w="${w}" class="${e.w===w?'sel':''}">${WHERE[w]}</button>`).join('')}</div>
    <div class="foot"><span></span><button class="btn" id="cancel">דילוג</button></div>`;
  sh.querySelectorAll('[data-w]').forEach(b => b.onclick = () => {
    close();
    commit('', () => { const x = find(); if(x) x.w = b.dataset.w; }, {quiet:true});   // the undo toast of the pee itself stays up
  });
  sh.querySelector('#cancel').onclick = close;
  bg.classList.add('show');
}
document.getElementById('undo').onclick = () => {
  if(!lastUndo) return;
  setState(patch(diff(lastUndo.after, lastUndo.before), state)); lastUndo = null;   // reverse just this change
  document.getElementById('toast').classList.remove('show');
  render(); push();
};

// ---------- sheets ----------
const bg = document.getElementById('sheetBg'), sh = document.getElementById('sheet');
bg.onclick = e => { if(e.target===bg) close(); };
function close(){ bg.classList.remove('show'); }
function timeToTs(v){
  const [hh,mm] = v.split(':').map(Number); const d = new Date(); d.setHours(hh,mm,0,0);
  if(d.getTime() > Date.now()+60000) d.setDate(d.getDate()-1);
  return d.getTime();
}
const ago = m => Date.now() - m*60000;
const nowStr = () => clock(Date.now());
// "How long ago" choices: quick buttons, plus a box for any number of minutes (the time is worked out from it).
const chips = (list) => `<div class="chips">${list.map(m=>`<button data-m="${m}">${m===0?'עכשיו':'לפני '+(m===60?'שעה':m===120?'שעתיים':m%60===0?(m/60)+' שעות':m+' דק׳')}</button>`).join('')}</div>
  <label class="field">או לפני <input type="number" class="kb" id="agoIn" inputmode="numeric" min="0" max="1440" placeholder="20" autocomplete="off"> דקות</label>`;

// Time entry: phones keep the native time wheel; with a mouse and keyboard it is a plain text box that
// accepts 935, 9:35, 09.35, "9 35" or just 9, and Enter saves.
const KB = !!(window.matchMedia && window.matchMedia('(pointer:fine)').matches);
function timeField(id, v){
  return KB ? `<input type="text" class="kb" id="${id}" value="${v}" dir="ltr" inputmode="numeric" maxlength="5" placeholder="9:35" autocomplete="off">`
            : `<input type="time" id="${id}" value="${v}">`;
}
function parseTime(v){
  v = String(v || '').trim();
  const m = v.match(/^(\d{1,2})\s*[:.,\s]\s*(\d{1,2})$/) || v.match(/^(\d{1,2})(\d{2})$/) || v.match(/^(\d{1,2})()$/);
  if(!m) return '';
  const h = +m[1], mi = +(m[2] || 0);
  return h < 24 && mi < 60 ? `${pad(h)}:${pad(mi)}` : '';
}
function timeVal(id){
  const el = sh.querySelector('#'+id); if(!el) return '';
  const v = parseTime(el.value);
  if(el.classList) el.classList.toggle('bad', !v);
  if(!v && el.focus){ el.focus(); if(el.select) el.select(); }
  return v;
}
document.addEventListener('keydown', e => {
  if(!bg.classList.contains('show')) return;
  if(e.key === 'Escape') close();
  else if(e.key === 'Enter' && e.target && e.target.tagName === 'INPUT'){ const ok = sh.querySelector('#ok'); if(ok){ e.preventDefault(); ok.click(); } }
});
function sheet(title, body, footL, onOk, onChip){
  sh.innerHTML = `<h3>${title}</h3>${body}<div class="foot">${footL}<button class="btn primary" id="ok">שמירה</button></div>`;
  sh.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { close(); onChip(ago(+b.dataset.m)); });
  // A number typed into "לפני … דקות" wins over the clock field: save at now minus that many minutes.
  const ag = sh.querySelector('#agoIn');
  if(ag) ag.oninput = () => ag.classList.remove('bad');
  sh.querySelector('#ok').onclick = () => {
    if(ag && ag.value.trim() !== '' && onChip){
      const m = Number(ag.value);
      if(!(m >= 0 && m <= 1440)){ ag.classList.add('bad'); ag.focus(); return; }
      close(); onChip(ago(m)); return;
    }
    onOk();
  };
  const c = sh.querySelector('#cancel'); if(c) c.onclick = close;
  bg.classList.add('show');
  if(KB){ const f = sh.querySelector('#tIn.kb, #aIn.kb') || sh.querySelector('input.kb:not(#agoIn)'); if(f){ f.focus(); f.select(); } sh.querySelectorAll('input.kb').forEach(i => i.onfocus = () => i.select()); }
}
const cancelBtn = '<button class="btn" id="cancel">ביטול</button>';

function openSheet(p, k){
  const it = ITEMS[k], name = PETS[p].name, start = V[p][k] && V[p][k].start;
  const running = () => state.log.filter(e => e.p===p && e.k===k && e.end == null);
  if(!it.dur){
    sheet(`${name} · ${it.log} — מתי?`, chips([5,10,15,30,60,120,180]) + `<label class="field">או בשעה ${timeField("tIn", nowStr())}</label>`,
      cancelBtn, () => { const v=timeVal('tIn'); if(!v) return; close(); logAt(p,k,timeToTs(v)); },
      ts => logAt(p,k,ts));
  } else if(start){
    // The timer is running: move its start, or cancel it.
    const setStart = ts => commit(`${name} · שעת ההתחלה עודכנה`, () => { const o = running().sort((x,y) => x.t-y.t); if(o[0]) o[0].t = Math.min(ts, Date.now()); });
    // …or record that it already ended earlier (she woke up a while ago and nobody tapped).
    const endAt = ts => commit(`${name} · ${it.stop}`, () => { stopDur(p, k, Math.min(ts, Date.now())); });
    sheet(`${name} · ${it.startQ}`, chips([5,10,15,30,60,120,180]) + `<label class="field">או בשעה ${timeField("tIn", clock(start))}</label>
       <div class="sub" style="margin:14px 0 8px">כבר נגמר ולא סימנו? מתי זה נגמר:</div><label class="field">נגמר ב־ ${timeField("eIn", "")}</label>`,
      '<button class="btn danger" id="del">מחיקה</button>',
      () => {
        const endV = sh.querySelector('#eIn').value.trim();
        if(endV){   // an end time was given: finish the stay then
          const e = timeVal('eIn'); if(!e) return;
          const te = timeToTs(e);
          if(te <= start){ sh.querySelector('#eIn').classList.add('bad'); return; }
          close(); endAt(te); return;
        }
        const v=timeVal('tIn'); if(!v) return; close(); setStart(timeToTs(v));
      }, setStart);
    sh.querySelector('#del').onclick = () => { close(); commit(`${name} · נמחק`, () => { const o = running(); state.log = state.log.filter(e => !o.includes(e)); }); };
  } else {
    sheet(`${name} · ${it.lbl.replace(' אחרונה','').replace(' אחרון','')} — הוספה`,
      `<div class="sub" style="margin-bottom:8px">התחיל ועדיין נמשך:</div>` + chips([5,10,15,30,60,120]) +
      `<label class="field">או התחלה ב־ ${timeField("aIn", "")}</label><label class="field">סיום&nbsp; ${timeField("bIn", "")}</label>
       <div class="sub">בלי שעת סיום = עדיין נמשך. עם שעת סיום = משהו שכבר נגמר.</div>`,
      cancelBtn, () => {
        // No end time means it is still going on: start the timer from the given time. (The end used to
        // default to "now", which silently logged "in the crate since 10:01" as a finished stay.)
        const a = timeVal('aIn'); if(!a) return;
        if(!sh.querySelector('#bIn').value.trim()){ close(); tapDur(p, k, timeToTs(a)); return; }
        const b = timeVal('bIn'); if(!b) return;
        const tb = timeToTs(b); let ta = timeToTs(a); if(ta >= tb) ta -= 86400000;
        close();
        commit(`${name} · ${it.log} נוסף`, () => { state.log.push({p, k, t:ta, end:tb}); });
      }, ts => tapDur(p, k, ts));
  }
}
// Logging a time that is earlier than the current "last" one: ask whether it corrects the last entry
// or is an additional, earlier event. (Silently adding it left the timer unchanged, which looked broken.)
function logAt(p, k, ts){
  const cur = V[p][k];
  if(typeof cur !== 'number' || ts >= cur){ tapPoint(p, k, ts); return; }
  const name = PETS[p].name, what = SUM_LBL[k], when = t => `${dayLabel(t)} ב־<bdi dir="ltr">${clock(t)}</bdi>`;
  sh.innerHTML = `<h3>${name} · כבר רשום ${what} מאוחר יותר</h3>
    <div class="sub" style="font-size:14px;margin-bottom:18px">ה${what} האחרון שרשום: ${when(cur)}.<br>השעה שהזנת: ${when(ts)}.</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn primary" id="repl">לתקן: ה${what} האחרון היה ב־<bdi dir="ltr">${clock(ts)}</bdi></button>
      <button class="btn" id="addb">להוסיף כרישום נוסף, מוקדם יותר</button>
      <button class="btn" id="cancel">ביטול</button></div>`;
  sh.querySelector('#repl').onclick = () => { close(); commit(`${name} · ${ITEMS[k].log} עודכן`, () => {
    state.log = state.log.filter(e => !(e.p===p && e.k===k && e.t > ts));
    state.log.push({p, k, t:ts});
  }); };
  sh.querySelector('#addb').onclick = () => { close(); tapPoint(p, k, ts); };
  sh.querySelector('#cancel').onclick = close;
  bg.classList.add('show');
}
function openMedSheet(p, slot){
  const k = 'med_'+slot, given = medsOf(p)[slot];
  sheet(`${PETS[p].name} · ${ITEMS[k].log}`, chips([0,15,30,60]) + `<label class="field">או בשעה ${timeField("tIn", clock(given))}</label>`,
    '<button class="btn danger" id="del">לא ניתנה</button>',
    () => { const v=timeVal('tIn'); if(!v) return; close(); setMed(p, slot, timeToTs(v)); },
    ts => setMed(p, slot, ts));
  sh.querySelector('#del').onclick = () => { close(); setMed(p, slot, null); };
}

// Fix or delete one entry. The tiles follow by themselves, because they are computed from the list.
function openEntrySheet(i){
  const e = state.log[i]; if(!e) return;
  if(isLive(e)){ openSheet(e.p, e.k); return; }   // a running timer is edited from its own sheet
  const it = ITEMS[e.k], name = PETS[e.p].name, med = e.k.startsWith('med_'), pt = !it.dur && !med;
  const find = () => state.log.find(x => x.id === e.id);
  // A stay that was closed by mistake can be turned back into the running timer, if it is the latest one.
  const canReopen = !!it.dur && !(V[e.p][e.k] || {}).start && !state.log.some(x => x.p===e.p && x.k===e.k && x.end > e.end);
  sheet(`${name} · ${it.log} · ${dayLabel(e.t)} <bdi dir="ltr">${clock(e.t)}</bdi>`,
    pt ? `<label class="field">תיקון השעה ${timeField("tIn", clock(e.t))}</label>` +
         (hasWhere(e.k) ? `<div class="sub" style="margin:14px 0 8px">איפה?</div><div class="chips">${whereKeys(e.p).map(w => `<button data-w="${w}" class="${e.w===w?'sel':''}">${WHERE[w]}</button>`).join('')}</div>` : '')
       : (it.dur ? `<label class="field">התחלה ${timeField("aIn", clock(e.t))}</label><label class="field">סיום&nbsp; ${timeField("bIn", clock(e.end))}</label>` : '') +
         (canReopen ? `<div class="sub" style="margin:10px 0">נרשם בטעות כאילו נגמר?</div><div class="chips"><button id="reopen">עדיין נמשך (מ־${clock(e.t)})</button></div>` : '') +
         `<div class="sub">אפשר למחוק את הרישום הזה.</div>`,
    '<button class="btn danger" id="del">מחיקה</button>',
    () => {
      if(it.dur){   // a finished stay: its start and end can be corrected
        const a = timeVal('aIn'), b = timeVal('bIn'); if(!a || !b) return;
        const on = (v, base) => { if(v === clock(base)) return base; const [hh,mm] = v.split(':').map(Number), d = new Date(base); d.setHours(hh,mm,0,0); return d.getTime(); };
        const ta = on(a, e.t), tb = on(b, e.end);
        if(tb <= ta || tb > Date.now() + 60000){ sh.querySelector('#bIn').classList.add('bad'); return; }
        close();
        if(ta === e.t && tb === e.end) return;
        commit(`${name} · ${it.log} עודכן`, () => { const x = find(); if(x){ x.t = ta; x.end = tb; } });
        return;
      }
      if(!pt){ close(); return; }
      const v = timeVal('tIn'); if(!v) return;
      const [hh,mm] = v.split(':').map(Number), d = new Date(e.t); d.setHours(hh,mm,0,0);
      if(v === clock(e.t)) d.setTime(e.t);   // same minute = time untouched
      if(d.getTime() > Date.now() + 60000){ sh.querySelector('#tIn').classList.add('bad'); return; }   // not in the future
      close();
      if(d.getTime() === e.t && w === e.w) return;
      commit(`${name} · ${it.log} עודכן`, () => {
        const x = find(); if(!x) return;
        if(w) x.w = w; else delete x.w;
        x.t = d.getTime();
      });
    });
  let w = e.w;
  sh.querySelectorAll('[data-w]').forEach(b => b.onclick = () => {
    w = w === b.dataset.w ? undefined : b.dataset.w;
    sh.querySelectorAll('[data-w]').forEach(x => x.classList.toggle('sel', x.dataset.w === w));
  });
  const ro = sh.querySelector('#reopen');
  if(ro) ro.onclick = () => {
    close();
    commit(`${name} · ${it.live} מ־${clock(e.t)}`, () => { const x = find(); if(x) delete x.end; });   // no end = running again
  };
  sh.querySelector('#del').onclick = () => {
    close();
    commit(`${name} · ${it.log} נמחק`, () => { state.log = state.log.filter(x => x.id !== e.id); });
  };
}

function renderMe(){ document.getElementById('me').textContent = me ? USERS[me] : 'מי אני?'; }
function openUserSheet(then){
  sh.innerHTML = `<h3>מי משתמש/ת במכשיר הזה?</h3>
    <div class="chips users">${Object.entries(USERS).map(([k,n]) => `<button data-u="${k}" class="${k===me?'sel':''}">${n}</button>`).join('')}</div>
    <div class="sub">השם יופיע ליד כל רישום שנעשה מהמכשיר הזה. אפשר להחליף בלחיצה על השם למעלה.</div>`;
  sh.querySelectorAll('[data-u]').forEach(b => b.onclick = () => {
    me = b.dataset.u; try{ localStorage.setItem(LS_KEY+'-user', me); }catch(e){}
    close(); renderMe(); if(then) then();
  });
  bg.classList.add('show');
}
document.getElementById('me').onclick = () => openUserSheet();

render(); renderMe();
if(!me) openUserSheet();

// ---------- self-update ----------
// GitHub Pages lets browsers keep the page for 10 minutes and a home-screen app can hold it for days.
// So: fetch the published page (bypassing the cache) when the app comes to the front and every few
// minutes, and if its script or styles differ from the ones running here, reload. No version number
// to maintain. The reload waits until nothing is being saved and no sheet or undo toast is open.
(function selfUpdate(){
  if(!/^https?:$/.test(location.protocol)) return;
  const mine = [document.currentScript, document.querySelector('style')].map(el => el ? el.textContent.trim() : '');
  const KEY = LS_KEY+'-reloaded';
  let last = 0, pending = false;
  const busy = () => writing || dirty || bg.classList.contains('show') || document.getElementById('toast').classList.contains('show')
    || /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
  function reload(){
    if(busy()){ setTimeout(reload, 4000); return; }
    try { sessionStorage.setItem(KEY, String(Date.now())); } catch(e){}
    location.replace(location.pathname + '?v=' + Date.now());
  }
  async function check(){
    if(pending || document.hidden || Date.now() - last < 60000) return;
    last = Date.now();
    try {
      // Never reload twice within two minutes, whatever happens (avoids a reload loop).
      if(Date.now() - (+sessionStorage.getItem(KEY) || 0) < 120000) return;
      const res = await fetch(location.pathname + '?check=' + Date.now(), {cache:'no-store'});
      if(!res.ok) return;
      const html = (await res.text()).replace(/\r\n/g, '\n');
      if(html.length < 1000 || mine.every(t => html.includes(t))) return;
      pending = true; reload();
    } catch(e){}
  }
  document.addEventListener('visibilitychange', check);
  window.addEventListener('pageshow', check);
  window.addEventListener('focus', check);
  setInterval(check, 5*60000);
  setTimeout(check, 3000);
})();
</script>
