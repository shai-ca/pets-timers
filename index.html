// For things noticed late, or logged the next morning: which day the clock time below belongs to.
// `n` days to choose from: today, yesterday, the day before, then weekday names ("הוספת רישום" offers a week — a bath is often entered days later).
const dayPick = (n = 3) => `<div class="chips days">${Array.from({length:n}, (_, i) => `<button data-day="${i}" class="${i ? '' : 'sel'}">${['היום','אתמול','שלשום'][i] || 'יום '+DOW[new Date(Date.now() - i*86400000).getDay()]}</button>`).join('')}</div>`;
const ago = m => Date.now() - m*60000;
const nowStr = () => clock(Date.now());
// "How long ago" choices: quick buttons, plus a box for any number of minutes (the time is worked out from it).
const chips = (list) => `<div class="chips">${list.map(m=>`<button data-m="${m}">${m===0?'עכשיו':'לפני '+(m===60?'שעה':m===120?'שעתיים':m%60===0?(m/60)+' שעות':m+' דק׳')}</button>`).join('')}</div>
  <label class="field">או לפני <input type="number" class="kb" id="agoIn" inputmode="numeric" min="0" max="1440" placeholder="20" autocomplete="off"> דקות</label>`;

// Time entry: phones keep the native time wheel; with a mouse and keyboard it is a plain text box that
// accepts 935, 9:35, 09.35, "9 35" or just 9, and Enter saves.
const KB = !!(window.matchMedia && window.matchMedia('(pointer:fine)').matches);
function timeField(id, v){
  return KB ? `<input type="text" class="kb" id="${id}" value="${v}" dir="ltr" inputmode="numeric" maxlength="5" placeholder="9:35" autocomplete="off">`
            : `<input type="time" id="${id}" value="${v}">`;
}
function parseTime(v){
  v = String(v || '').trim();
  const m = v.match(/^(\d{1,2})\s*[:.,\s]\s*(\d{1,2})$/) || v.match(/^(\d{1,2})(\d{2})$/) || v.match(/^(\d{1,2})()$/);
  if(!m) return '';
  const h = +m[1], mi = +(m[2] || 0);
  return h < 24 && mi < 60 ? `${pad(h)}:${pad(mi)}` : '';
}
function timeVal(id){
  const el = sh.querySelector('#'+id); if(!el) return '';
  const v = parseTime(el.value);
  if(el.classList) el.classList.toggle('bad', !v);
  if(!v && el.focus){ el.focus(); if(el.select) el.select(); }
  return v;
}
document.addEventListener('keydown', e => {
  if(!bg.classList.contains('show')) return;
  if(e.key === 'Escape') close();
  else if(e.key === 'Enter' && e.target && e.target.tagName === 'INPUT'){ const ok = sh.querySelector('#ok'); if(ok){ e.preventDefault(); ok.click(); } }
});
function sheet(title, body, footL, onOk, onChip){
  sh.innerHTML = `<h3>${title}</h3>${body}<div class="foot">${footL}<button class="btn primary" id="ok">שמירה</button></div>`;
  dayBack = 0;
  sh.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { dayBack = +b.dataset.day; sh.querySelectorAll('[data-day]').forEach(x => x.classList.toggle('sel', x === b)); });
  sh.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { close(); onChip(ago(+b.dataset.m)); });
  // A number typed into "לפני … דקות" wins over the clock field: save at now minus that many minutes.
  const ag = sh.querySelector('#agoIn');
  if(ag) ag.oninput = () => ag.classList.remove('bad');
  sh.querySelector('#ok').onclick = () => {
    if(ag && ag.value.trim() !== '' && onChip){
      const m = Number(ag.value);
      if(!(m >= 0 && m <= 1440)){ ag.classList.add('bad'); ag.focus(); return; }
      close(); onChip(ago(m)); return;
    }
    onOk();
  };
  const c = sh.querySelector('#cancel'); if(c) c.onclick = close;
  bg.classList.add('show');
  if(KB){ const f = sh.querySelector('#tIn.kb, #aIn.kb') || sh.querySelector('input.kb:not(#agoIn)'); if(f){ f.focus(); f.select(); } sh.querySelectorAll('input.kb').forEach(i => i.onfocus = () => i.select()); }
}
const cancelBtn = '<button class="btn" id="cancel">ביטול</button>';

function openSheet(p, k){
  if(k === 'sleep' && V[p].sleep.assumed && V[p].sleep.start){ assumeSheet(V[p].sleep.stay, V[p].sleep.start); return; }
  const it = ITEMS[k], name = PETS[p].name, start = V[p][k] && V[p][k].start;
  const running = () => state.log.filter(e => e.p===p && e.k===k && e.end == null);
  if(!it.dur){
    sheet(`${name} · ${it.log} — מתי?`, chips([5,10,15,30,60,120,180]) + `<div class="sub" style="margin:4px 0 8px">או ביום ובשעה:</div>${dayPick()}<label class="field">בשעה ${timeField("tIn", nowStr())}</label>`,
      cancelBtn, () => { const v=timeVal('tIn'); if(!v) return; close(); logAt(p,k,timeToTs(v)); },
      ts => logAt(p,k,ts));
  } else if(start){
    // The timer is running: move its start, or cancel it.
    const setStart = ts => commit(`${name} · שעת ההתחלה עודכנה`, () => { const o = running().sort((x,y) => x.t-y.t); if(o[0]) o[0].t = Math.min(ts, Date.now()); });
    // …or record that it already ended earlier (she woke up a while ago and nobody tapped).
    const endAt = ts => commit(`${name} · ${it.stop}`, () => { const t = Math.min(ts, Date.now()); if(k === 'crate') leaveCrate(p, t); else stopDur(p, k, t); });
    sheet(`${name} · ${it.startQ}`, chips([0,5,10,15,30,60,120,180]) + `<div class="sub" style="margin:4px 0 8px">או ביום ובשעה:</div>${dayPick()}<label class="field">בשעה ${timeField("tIn", clock(start))}</label>
       <div class="sub" style="margin:14px 0 8px">כבר נגמר ולא סימנו? מתי זה נגמר:</div><label class="field">נגמר ב־ ${timeField("eIn", "")}</label>`,
      '<button class="btn danger" id="del">מחיקה</button>',
      () => {
        const endV = sh.querySelector('#eIn').value.trim();
        if(endV){   // an end time was given: finish the stay then
          const e = timeVal('eIn'); if(!e) return;
          const te = timeToTs(e);
          if(te <= start){ sh.querySelector('#eIn').classList.add('bad'); return; }
          close(); endAt(te); return;
        }
        const v=timeVal('tIn'); if(!v) return; close(); setStart(timeToTs(v));
      }, setStart);
    sh.querySelector('#del').onclick = () => { close(); commit(`${name} · נמחק`, () => { const o = running(); state.log = state.log.filter(e => !o.includes(e)); }); };
  } else {
    // Falling asleep is easiest to place relative to the crate: "about ten minutes after she went in".
    const cs = k === 'sleep' && V[p].crate.start, afterAt = m => Math.min(cs + m*60000, Date.now());
    const rel = cs ? `<div class="sub" style="margin-bottom:8px">נכנסה לכלוב ב־<bdi dir="ltr">${clock(cs)}</bdi>. כמה זמן אחרי זה נרדמה?</div>
      <div class="chips">${[0,5,10,15,20,30].filter(m => cs + m*60000 <= Date.now() + 60000).map(m => `<button data-after="${m}">${m ? 'אחרי ' + m + ' דק׳' : 'מיד'}</button>`).join('')}</div>
      <label class="field">או אחרי <input type="number" class="kb" id="afterIn" inputmode="numeric" min="0" max="600" placeholder="12" autocomplete="off"> דקות בכלוב</label>
      <div class="sub" style="margin:14px 0 8px">או לפי השעה:</div>` : '';
    sheet(`${name} · ${it.lbl.replace(' אחרונה','').replace(' אחרון','')} — הוספה`,
      rel + `<div class="sub" style="margin-bottom:8px">התחיל ועדיין נמשך:</div>` + chips([5,10,15,30,60,120]) +
      `<div class="sub" style="margin:4px 0 8px">או ביום ובשעה:</div>${dayPick()}<label class="field">התחלה ב־ ${timeField("aIn", "")}</label><label class="field">סיום&nbsp; ${timeField("bIn", "")}</label>
       <div class="sub">בלי שעת סיום = עדיין נמשך. עם שעת סיום = משהו שכבר נגמר.</div>`,
      cancelBtn, () => {
        // No end time means it is still going on: start the timer from the given time. (The end used to
        // default to "now", which silently logged "in the crate since 10:01" as a finished stay.)
        const af = sh.querySelector('#afterIn');
        if(af && af.value.trim() !== ''){
          const m = Number(af.value);
          if(!(m >= 0 && m <= 600) || cs + m*60000 > Date.now() + 60000){ af.classList.add('bad'); af.focus(); return; }
          close(); tapDur(p, k, afterAt(m)); return;
        }
        const a = timeVal('aIn'); if(!a) return;
        if(!sh.querySelector('#bIn').value.trim()){ close(); tapDur(p, k, timeToTs(a)); return; }
        const b = timeVal('bIn'); if(!b) return;
        const tb = timeToTs(b); let ta = timeToTs(a); if(ta >= tb) ta -= 86400000;
        close();
        commit(`${name} · ${it.log} נוסף`, () => { state.log.push(newStay(p, k, ta, tb)); });
      }, ts => tapDur(p, k, ts));
    sh.querySelectorAll('[data-after]').forEach(b => b.onclick = () => { close(); tapDur(p, k, afterAt(+b.dataset.after)); });
  }
}
// Logging a time that is earlier than the current "last" one: ask whether it corrects the last entry
// or is an additional, earlier event. (Silently adding it left the timer unchanged, which looked broken.)
function logAt(p, k, ts){
  const cur = V[p][k];
  if(typeof cur !== 'number' || ts >= cur){ tapPoint(p, k, ts); return; }
  const name = PETS[p].name, what = SUM_LBL[k], when = t => `${dayLabel(t)} ב־<bdi dir="ltr">${clock(t)}</bdi>`;
  sh.innerHTML = `<h3>${name} · כבר רשום ${what} מאוחר יותר</h3>
    <div class="sub" style="font-size:14px;margin-bottom:18px">ה${what} האחרון שרשום: ${when(cur)}.<br>השעה שהזנת: ${when(ts)}.</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn primary" id="repl">לתקן: ה${what} האחרון היה ב־<bdi dir="ltr">${clock(ts)}</bdi></button>
      <button class="btn" id="addb">להוסיף כרישום נוסף, מוקדם יותר</button>
      <button class="btn" id="cancel">ביטול</button></div>`;
  sh.querySelector('#repl').onclick = () => { close(); commit(`${name} · ${ITEMS[k].log} עודכן`, () => {
    state.log = state.log.filter(e => !(e.p===p && e.k===k && e.t > ts));
    impliesOut(p, k, ts);
    state.log.push({p, k, t:ts});
  }); };
  sh.querySelector('#addb').onclick = () => { close(); tapPoint(p, k, ts); };
  sh.querySelector('#cancel').onclick = close;
  bg.classList.add('show');
}
function openMedSheet(p, slot){
  const k = 'med_'+slot, given = medsOf(p)[slot];
  sheet(`${PETS[p].name} · ${ITEMS[k].log}`, chips([0,15,30,60]) + `<label class="field">או בשעה ${timeField("tIn", clock(given))}</label>`,
    '<button class="btn danger" id="del">לא ניתנה</button>',
    () => { const v=timeVal('tIn'); if(!v) return; close(); setMed(p, slot, timeToTs(v)); },
    ts => setMed(p, slot, ts));
  sh.querySelector('#del').onclick = () => { close(); setMed(p, slot, null); };
}

// An assumed sleep is not an entry, so it cannot be "edited" — but the owner can say what really happened in
// that crate stay: when she fell asleep (and woke), which becomes a real entry and replaces the assumption,
// or that she did not sleep there at all (`ns` on the stay).
function assumeSheet(stayId, t){   // one assumed piece of a crate stay: the one that starts at t (or the first)
  const c = state.log.find(e => e.id === stayId); if(!c) return;
  const all = V[c.p].spans.filter(x => x.assumed && x.stay === stayId), sp = all.find(x => x.t === t) || all[0], name = PETS[c.p].name;
  const onDay = v => { const [hh,mm] = v.split(':').map(Number), d = new Date(sp ? sp.t : c.t); d.setHours(hh,mm,0,0); if(d.getTime() < c.t - 60000) d.setDate(d.getDate()+1); return d.getTime(); };
  sheet(`${name} · שינה בכלוב (משוער)`,
    `<div class="sub" style="margin-bottom:12px">זו הערכה של האפליקציה, לפי הזמן שלוקח לה בדרך כלל להירדם בכלוב הזה. אם זה היה אחרת, אפשר לרשום מה באמת קרה.</div>
     <div class="sub" style="margin-bottom:8px">מתי באמת נרדמה?</div>${chips([0,5,10,15,20,30,60])}
     <div class="sub" style="margin:4px 0 8px">או לפי השעה:</div>
     <label class="field">נרדמה ב־ ${timeField("aIn", sp ? clock(sp.t) : '')}</label><label class="field">התעוררה ב־ ${timeField("bIn", sp && sp.end != null ? clock(sp.end) : '')}</label>
     <div class="sub">בלי שעת התעוררות = עדיין ישנה.</div>`,
    `<button class="btn danger" id="del">${all.length > 1 ? 'לא ישנה כאן' : 'לא ישנה בכלוב הזה'}</button>`,
    () => {
      const a = timeVal('aIn'); if(!a) return;
      const ta = onDay(a), bRaw = sh.querySelector('#bIn').value.trim();
      if(ta > Date.now() + 60000){ sh.querySelector('#aIn').classList.add('bad'); return; }
      let tb; if(bRaw){ const b = timeVal('bIn'); if(!b) return; tb = onDay(b); if(tb <= ta || tb > Date.now() + 60000){ sh.querySelector('#bIn').classList.add('bad'); return; } }
      close();
      commit(`${name} · ${ITEMS.sleep.log} עודכן`, () => { state.log.push(tb ? {p:c.p, k:'sleep', t:ta, end:tb} : {p:c.p, k:'sleep', t:ta}); });
    },
    // "fell asleep now / 5 minutes ago": a real entry from then (still asleep), which replaces the estimate
    ts => commit(`${name} · ${ITEMS.sleep.start}`, () => { state.log.push({p:c.p, k:'sleep', t: Math.min(ts, Date.now())}); }));
  // "She did not sleep here" is about this piece only: a time inside its stretch is kept on the crate entry.
  sh.querySelector('#del').onclick = () => { close(); if(!sp) return; commit(`${name} · לא ישנה בכלוב`, () => { const x = state.log.find(e => e.id === stayId); if(x) x.nsx = (Array.isArray(x.nsx) ? x.nsx : []).concat([sp.t]); }); };
}
// Fix or delete one entry. The tiles follow by themselves, because they are computed from the list.
function openEntrySheet(i){
  const e = state.log[i]; if(!e) return;
  if(isLive(e)){ openSheet(e.p, e.k); return; }   // a running timer is edited from its own sheet
  const it = ITEMS[e.k], name = PETS[e.p].name, med = e.k.startsWith('med_'), pt = !it.dur && !med;
  const find = () => state.log.find(x => x.id === e.id);
  // A stay that was closed by mistake can be turned back into the running timer, if it is the latest one.
  const isCrateE = e.k === 'crate' && PETS[e.p].cycle; let ck = isCrateE ? crateKind(e) : null; const ck0 = ck;
  // The stay before this one, if it ended only a few minutes earlier: the two may really be one (a change of crate).
  const prevStay = isCrateE ? state.log.filter(x => x.p===e.p && x.k==='crate' && x.id !== e.id && x.end != null && x.end <= e.t && e.t - x.end <= 15*60000).sort((x,y) => x.t-y.t).pop() : null;
  const canReopen = !!it.dur && !(V[e.p][e.k] || {}).start && !state.log.some(x => x.p===e.p && x.k===e.k && x.end > e.end);
  sheet(`${name} · ${it.log} · ${dayLabel(e.t)} <bdi dir="ltr">${clock(e.t)}</bdi>`,
    pt ? `<label class="field">תיקון השעה ${timeField("tIn", clock(e.t))}</label>` +
         (hasWhere(e.k) ? `<div class="sub" style="margin:14px 0 8px">איפה?</div><div class="chips">${whereKeys(e.p).map(w => `<button data-w="${w}" class="${e.w===w?'sel':''}">${WHERE[w]}</button>`).join('')}</div>` : '') +
         (PETS[e.p].cycle && waitOf({...e, g: 1}) != null ? `<div class="sub" style="margin:14px 0 8px">כמה זמן לקח בחצץ?${typeof e.g !== 'number' && waitOf(e) != null ? ' (נמדד: ' + words(waitOf(e)) + ')' : ''}</div><div class="chips">${GRAVEL_OPTS.map(m => `<button data-g="${m}" class="${e.g===m?'sel':''}">${m} דק׳</button>`).join('')}</div>` : '') +
         (mealKind(e) ? `<div class="sub" style="margin:14px 0 8px">ארוחה או ביס?</div><div class="chips">${Object.keys(MEAL_LBL).map(m => `<button data-m="${m}" class="${mealKind(e)===m?'sel':''}">${MEAL_LBL[m]}</button>`).join('')}</div><div class="sub hint">ארוחה מאפסת את השעון של האוכל; ביס לא.</div>` : '') +
         (e.k === 'treat' ? `<label class="field" style="margin-top:12px">מה זה היה? <input type="text" id="nmIn" maxlength="40" value="${esc(e.n)}" placeholder="לא חובה" autocomplete="off"></label>` : '') +
         (hasType(e.p, e.k) ? `<div class="sub" style="margin:14px 0 8px">${KIND_Q[e.k]}</div><div class="chips">${Object.keys(kindsOf(e.p, e.k)).map(q => `<button data-q="${q}" class="${e.q===q?'sel':''}">${kindsOf(e.p, e.k)[q]}</button>`).join('')}</div>` : '')
       : (it.dur ? `<label class="field">התחלה ${timeField("aIn", clock(e.t))}</label><label class="field">סיום&nbsp; ${timeField("bIn", clock(e.end))}</label>` : '') +
         (isCrateE ? `<div class="sub" style="margin:12px 0 8px">איזה כלוב?</div><div class="chips">${Object.keys(CRATES).map(x => `<button data-c="${x}" class="${crateKind(e)===x?'sel':''}">${CRATES[x]}</button>`).join('')}</div>` : '') +
         (prevStay ? `<div class="sub" style="margin:10px 0">היא לא באמת יצאה בין שתי השהיות (אכלה בכלוב, או רק עברה כלוב)?</div><div class="chips"><button id="join">המשך של השהייה הקודמת</button></div>` : '') +
         (canReopen ? `<div class="sub" style="margin:10px 0">נרשם בטעות כאילו נגמר?</div><div class="chips"><button id="reopen">עדיין נמשך (מ־${clock(e.t)})</button></div>` : '') +
         `<div class="sub">אפשר למחוק את הרישום הזה.</div>`,
    '<button class="btn danger" id="del">מחיקה</button>',
    () => {
      if(it.dur){   // a finished stay: its start and end can be corrected
        const a = timeVal('aIn'), b = timeVal('bIn'); if(!a || !b) return;
        const on = (v, base) => { if(v === clock(base)) return base; const [hh,mm] = v.split(':').map(Number), d = new Date(base); d.setHours(hh,mm,0,0); return d.getTime(); };
        const ta = on(a, e.t), tb = on(b, e.end);
        if(tb <= ta || tb > Date.now() + 60000){ sh.querySelector('#bIn').classList.add('bad'); return; }
        close();
        if(ta === e.t && tb === e.end && ck === ck0) return;
        commit(`${name} · ${it.log} עודכן`, () => { const x = find(); if(x){ x.t = ta; x.end = tb; if(ck !== ck0) x.c = ck; } });
        return;
      }
      if(!pt){ close(); return; }
      const v = timeVal('tIn'); if(!v) return;
      const [hh,mm] = v.split(':').map(Number), d = new Date(e.t); d.setHours(hh,mm,0,0);
      if(v === clock(e.t)) d.setTime(e.t);   // same minute = time untouched
      if(d.getTime() > Date.now() + 60000){ sh.querySelector('#tIn').classList.add('bad'); return; }   // not in the future
      close();
      const nmEl = sh.querySelector('#nmIn'), nm = nmEl ? nmEl.value.trim().slice(0, 40) : (e.n || '');
      if(d.getTime() === e.t && w === e.w && q === e.q && mk === mk0 && nm === (e.n || '') && gm === e.g) return;
      commit(`${name} · ${it.log} עודכן`, () => {
        const x = find(); if(!x) return;
        if(w === 'crate' && x.w !== 'crate') pottyInCrate(x);   // before the time moves: the stay ended at the old time
        if(w) x.w = w; else delete x.w;
        if(q) x.q = q; else delete x.q;
        if(nm) x.n = nm; else delete x.n;
        if(gm) x.g = gm; else delete x.g;
        if(mk !== mk0) x.m = mk;   // her correction; from here on it wins over the two-hour rule
        x.t = d.getTime();
      });
    });
  let w = e.w, q = e.q, gm = e.g; const mk0 = mealKind(e); let mk = mk0;
  sh.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { gm = gm === +b.dataset.g ? undefined : +b.dataset.g; sh.querySelectorAll('[data-g]').forEach(x => x.classList.toggle('sel', +x.dataset.g === gm)); });
  sh.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mk = b.dataset.m; sh.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('sel', x.dataset.m === mk)); });
  sh.querySelectorAll('[data-w]').forEach(b => b.onclick = () => {
    w = w === b.dataset.w ? undefined : b.dataset.w;
    sh.querySelectorAll('[data-w]').forEach(x => x.classList.toggle('sel', x.dataset.w === w));
  });
  sh.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
    q = q === b.dataset.q ? undefined : b.dataset.q;
    sh.querySelectorAll('[data-q]').forEach(x => x.classList.toggle('sel', x.dataset.q === q));
  });
  sh.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { ck = b.dataset.c; sh.querySelectorAll('[data-c]').forEach(x => x.classList.toggle('sel', x === b)); });
  const jn = sh.querySelector('#join');
  if(jn) jn.onclick = () => {
    close();
    commit(`${name} · השהיות אוחדו`, () => {
      const x = find(), pv = state.log.find(y => y.id === prevStay.id); if(!x || !pv) return;
      const from = crateKind(pv), to = ck;
      pv.c = from; pv.end = x.end;                                    // one stay, from the first entry to the last exit
      state.log = state.log.filter(y => y.id !== x.id);
      if(to !== from) state.log.push({p: e.p, k:'swap', t: x.t, c: to});   // where she changed crates — if she did
    });
  };
  const ro = sh.querySelector('#reopen');
  if(ro) ro.onclick = () => {
    close();
    commit(`${name} · ${it.live} מ־${clock(e.t)}`, () => { const x = find(); if(x) delete x.end; });   // no end = running again
  };
  sh.querySelector('#del').onclick = () => {
    close();
    commit(`${name} · ${it.log} נמחק`, () => { state.log = state.log.filter(x => x.id !== e.id); });
  };
}

function renderMe(){ document.getElementById('me').textContent = me ? (USERS[me] || (isGuest(me) ? me.slice(2) : '')) : 'מי אני?'; }
function openUserSheet(then){
  const g = isGuest(me) ? me.slice(2) : '';
  sh.innerHTML = `<h3>מי משתמש/ת במכשיר הזה?</h3>
    <div class="chips users">${Object.entries(USERS).map(([k,n]) => `<button data-u="${k}" class="${k===me?'sel':''}">${n}</button>`).join('')}<button data-guest="1" class="${g ? 'sel' : ''}">אורח/ת</button></div>
    <div class="guestf" ${g ? '' : 'hidden'}><label class="field">השם שלך <input type="text" id="gname" maxlength="${GUEST_MAX}" value="${esc(g)}" placeholder="למשל: דנה" autocomplete="off"></label>
      <button class="btn primary" id="gok">המשך</button></div>
    <div class="sub">השם יופיע ליד כל רישום שנעשה מהמכשיר הזה. אפשר להחליף בלחיצה על השם למעלה.</div>`;
  const pickU = u => { me = u; try{ localStorage.setItem(LS_KEY+'-user', me); }catch(e){} close(); renderMe(); render(); if(then) then(); };
  sh.querySelectorAll('[data-u]').forEach(b => b.onclick = () => pickU(b.dataset.u));
  const gf = sh.querySelector('.guestf'), gi = sh.querySelector('#gname');
  sh.querySelector('[data-guest]').onclick = () => { gf.hidden = false; sh.querySelector('[data-guest]').classList.add('sel'); gi.focus(); };
  const okG = () => { const n = gi.value.replace(/\s+/g, ' ').trim().slice(0, GUEST_MAX); if(!n || USERS[n] || Object.values(USERS).includes(n)){ gi.classList.add('bad'); return; } pickU('g:' + n); };
  sh.querySelector('#gok').onclick = okG;
  gi.onkeydown = e => { if(e.key === 'Enter') okG(); };
  bg.classList.add('show');
}
document.getElementById('me').onclick = () => openUserSheet();

render(); renderMe();
if(!me) openUserSheet();

// ---------- self-update ----------
// GitHub Pages lets browsers keep the page for 10 minutes and a home-screen app can hold it for days.
// So: fetch the published page (bypassing the cache) when the app comes to the front and every few
// minutes, and if its script or styles differ from the ones running here, reload. No version number
// to maintain. The reload waits until nothing is being saved and no sheet or undo toast is open.
(function selfUpdate(){
  if(!/^https?:$/.test(location.protocol)) return;
  const mine = [document.currentScript, document.querySelector('style')].map(el => el ? el.textContent.trim() : '');
  const KEY = LS_KEY+'-reloaded';
  let last = 0, pending = false;
  const busy = () => writing || dirty || bg.classList.contains('show') || document.getElementById('toast').classList.contains('show')
    || /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
  function reload(){
    if(busy()){ setTimeout(reload, 4000); return; }
    try { sessionStorage.setItem(KEY, String(Date.now())); } catch(e){}
    location.replace(location.pathname + (MODE === 'sandbox' ? '?sandbox&v=' : '?v=') + Date.now());
  }
  async function check(){
    if(pending || document.hidden || Date.now() - last < 60000) return;
    last = Date.now();
    try {
      // Never reload twice within two minutes, whatever happens (avoids a reload loop).
      if(Date.now() - (+sessionStorage.getItem(KEY) || 0) < 120000) return;
      const res = await fetch(location.pathname + '?check=' + Date.now(), {cache:'no-store'});
      if(!res.ok) return;
      const html = (await res.text()).replace(/\r\n/g, '\n');
      if(html.length < 1000 || mine.every(t => html.includes(t))) return;
      pending = true; reload();
    } catch(e){}
  }
  document.addEventListener('visibilitychange', check);
  window.addEventListener('pageshow', check);
  window.addEventListener('focus', check);
  setInterval(check, 5*60000);
  setTimeout(check, 3000);
})();
</script>
