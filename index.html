<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>קוצ׳יק וקישמיש</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4f1; --card:#fff; --ink:#24201d; --muted:#8c847c; --faint:#b9b2aa; --line:#ece7e1;
    --kochik:#17181b; --kochik-soft:#eceef1;      /* Maltese: snow white with black nose and eyes */
    --kishmish:#a8672d; --kishmish-soft:#f6e6d2;  /* Yorkshire puppy: tan and chestnut brown, black only as ink */
    --seg:#ebe7e1; --btn:var(--acc);
    --ok:#2f8a66; --ok-soft:#e7f4ee; --alert:#c64d68; --alert-soft:#fbeaee;
    --acc:var(--kishmish); --acc-soft:var(--kishmish-soft);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 96px)}
  /* Per-pet theme; the class is set on <html> and <body> by render(). */
  .p-kochik{--acc:var(--kochik);--acc-soft:var(--kochik-soft);
    --bg:#f7f8fa; --card:#fff; --ink:#131416; --muted:#80868e; --faint:#b6bcc3; --line:#e7e9ed; --seg:#e9ebef; --btn:#131416}
  .p-kishmish{--acc:var(--kishmish);--acc-soft:var(--kishmish-soft);
    --bg:#f5ede3; --card:#fffbf6; --ink:#1d1713; --muted:#8b7a69; --faint:#c2b3a2; --line:#eadecf; --seg:#eadfd1; --btn:#77471f}
  .wrap{max-width:520px;margin:0 auto}
  svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  svg.i.s{width:16px;height:16px}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:10px}
  .mark{width:36px;height:36px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center}
  .mark svg{width:20px;height:20px;fill:currentColor;stroke:none}
  h1{font-size:19px;margin:0;font-weight:600;letter-spacing:-.2px}
  .sync{display:flex;align-items:center;gap:6px;font:inherit;font-size:12px;color:var(--muted);border:0;background:none;padding:6px 0;cursor:pointer}
  .sync.login{background:var(--ink);color:#fff;border-radius:10px;padding:7px 13px;font-size:13px;font-weight:500}
  .sync.login i{display:none}
  .sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .sync.on i{background:var(--ok)} .sync.err i{background:var(--alert)}

  .seg{display:flex;background:var(--seg);border-radius:14px;padding:4px;margin-bottom:16px}
  .seg button{flex:1;border:0;background:none;border-radius:11px;padding:10px;font:inherit;font-size:15.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(40,30,20,.1)}
  .seg button.on[data-pet=kochik]{color:var(--kochik)} .seg button.on[data-pet=kishmish]{color:var(--kishmish)}

  main{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(40,30,20,.03)}
  .item{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center}
  .ic{width:44px;height:44px;border-radius:13px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
  .lbl{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .big{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.3px;line-height:1.25;direction:ltr;text-align:right}
  .big.txt{direction:rtl;font-size:22px}
  .big.none{color:var(--faint)}
  .sub{font-size:12.5px;color:var(--muted)}
  .acts{display:flex;flex-direction:column;align-items:stretch;gap:4px}
  .go{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:500;font-size:14.5px;color:#fff;background:var(--btn);cursor:pointer;white-space:nowrap;min-width:108px}
  .go:active{transform:scale(.97)}
  .ghost{border:0;background:none;color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;padding:4px}
  .card.live{border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:linear-gradient(0deg,var(--ok-soft),var(--ok-soft))}
  .card.live .ic{background:#fff;color:var(--ok)} .card.live .go{background:var(--ok)}
  .card.live.cry{border-color:color-mix(in srgb,var(--alert) 40%,transparent);background:var(--alert-soft)}
  .card.live.cry .ic{color:var(--alert)} .card.live.cry .go{background:var(--alert)}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
  .card.live .lbl{color:var(--ok);font-weight:500} .card.live.cry .lbl{color:var(--alert)}
  @keyframes pulse{50%{opacity:.25}}

  .meds-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .meds-h .ic{width:36px;height:36px;border-radius:11px}
  .meds-h b{font-weight:600;font-size:15px}
  .meds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .med{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;font:inherit;text-align:right;cursor:pointer;display:flex;gap:10px;align-items:center;color:var(--ink)}
  .med .ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;color:#fff}
  .med .ck svg{width:14px;height:14px;stroke-width:2.4}
  .med b{display:block;font-weight:500;font-size:14.5px}
  .med small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
  .med.done{border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:var(--ok-soft)}
  .med.done .ck{background:var(--ok);border-color:var(--ok)}
  .med.done small{color:var(--ok)}
  .med.late{border-color:color-mix(in srgb,var(--alert) 45%,transparent);background:var(--alert-soft)}
  .med.late .ck{border-color:var(--alert)} .med.late small{color:var(--alert);font-weight:500}

  h2{font-size:13px;color:var(--muted);font-weight:500;margin:18px 4px 2px;letter-spacing:.2px}
  .log{padding:4px 16px}
  .log .r{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
  .log .r:last-child{border-bottom:0}
  .log .r span{flex:1}
  .log .r time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .log .r svg{color:var(--acc)}
  .log .r[data-e]{cursor:pointer}
  h2 small{font-weight:400;color:var(--faint);margin-inline-start:6px}
  .empty{color:var(--faint);font-size:14px;padding:14px 0;text-align:center}

  .toast{position:fixed;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;bottom:calc(env(safe-area-inset-bottom) + 20px);background:var(--ink);color:#fff;border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:all .2s;white-space:nowrap;padding-right:14px}
  .toast{flex-wrap:wrap;justify-content:space-between}
  .toast .tw{flex-basis:100%;display:flex;gap:6px;padding-bottom:2px}
  .toast .tw:empty{display:none}
  .toast .tw button{flex:1;padding-left:9px;padding-right:9px}
  .toast .tw button.sel{background:#fff;color:var(--ink)}
  .lnk{border:0;background:none;padding:0;font:inherit;color:var(--acc);text-decoration:underline;cursor:pointer}
  .sub.hint{margin-top:2px;opacity:.85}
  .chips.mini{margin:2px 0 10px;gap:6px} .chips.mini button{padding:6px 10px;font-size:13px}
  .chips.where button{flex:1 1 40%;padding:14px 10px;font-size:16px;font-weight:500}
  /* charts: status colours for "where" (validated for colour-blind separation), neutral bands */
  .out{--c:#0ca30c} .pad{--c:#fab219} .acc{--c:#d03b3b} .unk{--c:#8a857d}
  .tl{padding:12px 14px}
  .tl-row{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:8px;padding:3px 0}
  .tl-d{font-size:12px;color:var(--muted);white-space:nowrap}
  .tl-t{position:relative;height:30px;background:var(--bg);border-radius:6px}
  .tl-t .g{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
  .tl-t .b{position:absolute;border-radius:4px}
  .b.crate{top:5px;bottom:5px;background:#dcc9b2}
  .b.sleep{top:11px;bottom:11px;background:#8f8aa6}
  .tl-t .f{position:absolute;top:4px;bottom:4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ink);opacity:.5}
  .tl-t .d{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;padding:0;border:2px solid var(--card);border-radius:50%;background:var(--c);cursor:pointer}
  .tl-t .d.poop{border-radius:3px}
  .tl-t .d::after{content:"";position:absolute;inset:-9px -5px}
  .tl-x{position:relative;height:14px;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  .tl-x span{position:absolute;transform:translateX(-50%)} .tl-x span:first-child{transform:none} .tl-x span:last-child{transform:translateX(-100%)}
  .lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
  .lg span{display:inline-flex;align-items:center;gap:5px}
  .lg .k{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c)}
  .lg .k.poop,.lg .k.sq{border-radius:2px}
  .lg .k.f{width:2px;height:11px;border-radius:1px;background:var(--ink);opacity:.5}
  .lg .k.b{width:16px;height:8px;border-radius:3px} .lg .k.b.crate{background:#dcc9b2} .lg .k.b.sleep{background:#8f8aa6}
  .wbc{padding:14px}
  .wb{display:flex;align-items:stretch;gap:2px;height:150px}
  .wb.few{gap:10px}
  .wb-c{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;border:0;background:none;padding:0;font:inherit;cursor:pointer}
  .wb-c i{width:100%;max-width:30px;border-radius:3px;background:var(--c)}
  .wb-c .n{font-size:11.5px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;margin-bottom:1px}
  .wb-c em{width:100%;height:20px;padding-top:4px;border-top:1px solid var(--faint);font-style:normal;font-size:11px;color:var(--muted);text-align:center;white-space:nowrap}
  .wh{font-style:normal}
  .wh.no{color:var(--muted)}
  .wh.floor,.wh.crate{color:var(--alert);font-weight:500}
  .rounds{padding:4px 16px}
  .rd{padding:12px 0;border-bottom:1px solid var(--line)} .rd:last-child{border-bottom:0}
  .rd-h{font-size:12.5px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
  .rd-h b{font-size:14px;font-weight:600;color:var(--ink)}
  .rd-l button{display:grid;grid-template-columns:46px 104px 1fr;align-items:baseline;gap:6px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:8px 6px;font:inherit;font-size:13.5px;color:var(--ink);text-align:right;cursor:pointer}
  .rd-l time{color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
  .rd-l i{font-style:normal;color:var(--muted)}
  .rd-l span{font-weight:500}
  .rd-l button.now{background:var(--acc-soft);border-radius:10px;border-top-color:transparent}
  .rd-l button.now + button{border-top-color:transparent}
  .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:9px;padding:7px 12px;font:inherit;font-weight:500;cursor:pointer}

  .bg{position:fixed;inset:0;background:rgba(30,25,20,.3);display:none;align-items:flex-end;justify-content:center;z-index:5}
  .bg.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 20px)}
  .sheet h3{margin:0 0 16px;font-size:17px;font-weight:600}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chips button,.btn{border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:9px 13px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
  .field{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin-bottom:8px}
  .field input{font:inherit;font-size:17px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;color:var(--ink);background:#fff}
  .field input.kb{width:5.5em;text-align:center;font-variant-numeric:tabular-nums}
  .field input.bad{border-color:var(--alert);background:var(--alert-soft)}
  .foot{display:flex;gap:8px;margin-top:18px;justify-content:space-between}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);padding:10px 22px}
  .btn.danger{color:var(--alert);background:#fff}

  .gate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
  .gate[hidden]{display:none}
  .gate .box{max-width:340px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
  .gate .mark{width:56px;height:56px;border-radius:17px} .gate .mark svg{width:30px;height:30px}
  .gate h2{margin:6px 0 0;font-size:20px;font-weight:600;color:var(--ink);letter-spacing:0}
  .gate p{margin:0;font-size:14.5px;line-height:1.55;color:var(--muted)}
  .gate .btn.primary{font-size:16px;padding:13px 26px;border-radius:14px;margin-top:8px}
  .gate .ghost{margin-top:2px;font-size:13.5px}
  .hr{display:flex;align-items:center;gap:10px}
  .me{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:5px 10px;font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap}
  .by{font-style:normal;color:var(--muted);font-size:12px;margin-inline-start:6px}
  .chips button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chips.users button{flex:1;padding:14px 10px;font-size:16px;font-weight:500}
  .seg.sm{margin-top:-8px} .seg.sm button{padding:7px;font-size:14px}
  .card .seg{margin:0}
  .nav{display:flex;align-items:center;gap:8px;margin-top:12px}
  .nav .arr{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
  .nav .arr:disabled{opacity:.3;cursor:default}
  .nav .when{position:relative;flex:1;text-align:center;font-weight:600;font-size:16.5px;line-height:1.3}
  .nav .when small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
  .nav .when input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .tiles.two{grid-template-columns:1fr 1fr}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
  button.tile{font:inherit;color:inherit;text-align:right;align-items:flex-start;cursor:pointer}
  .tile.on{border-color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
  .tile.dim{opacity:.5}
  .flt{font-size:12.5px;color:var(--muted);margin:0 4px -2px}
  .flt b{color:var(--ink);font-weight:600}
  .b.cry{top:5px;bottom:5px;background:#e0a0ae} .lg .k.b.cry{background:#e0a0ae}
  .tile .ic{width:34px;height:34px;border-radius:10px;margin-bottom:6px}
  .tile .ic svg{width:19px;height:19px}
  .tile b{font-size:25px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
  .tile b.t{font-size:18px;line-height:1.67}
  .tile span{font-size:13px;color:var(--muted)}
  .tile small{font-size:11.5px;color:var(--muted);opacity:.8}
  .tblc{padding:6px 14px}
  .tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  .tbl.wide{font-size:12.5px} .tbl.wide td,.tbl.wide th{padding-left:0;padding-right:0}
  .tbl th{font-weight:400;color:var(--acc);padding:9px 2px 7px}
  .tbl td{padding:10px 2px;text-align:center;border-top:1px solid var(--line)}
  .tbl td:first-child,.tbl th:first-child{text-align:right;color:var(--muted);white-space:nowrap}
  .tbl tr[data-day]{cursor:pointer}
  .tbl .z{color:var(--faint)}

  .cyc-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
  .cyc-h b{font-weight:600;font-size:15px}
  .cyc-h small{font-size:12.5px;color:var(--muted)}
  .steps{display:flex;flex-wrap:wrap;gap:6px}
  .steps button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
  .steps button i{font-style:normal;opacity:.55;margin-inline-end:5px;font-variant-numeric:tabular-nums}
  .steps button:disabled{opacity:.4;cursor:default}
  .steps button.on{background:var(--btn);border-color:var(--btn);color:#fff;font-weight:500}
  .duemsg{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--alert-soft);color:var(--alert);font-size:13.5px;font-weight:500}
  .card.cyc.due{border-color:color-mix(in srgb,var(--alert) 40%,transparent)}
  .cyc-a{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
  .cyc-a .mainact{margin-inline-start:auto;display:flex;flex-direction:column;align-items:stretch;gap:4px}
  .cyc-a .sub{flex:1;min-width:0}
  .cyc-a .go.wait{background:none;color:var(--btn);box-shadow:inset 0 0 0 1.5px var(--btn)}
  .zz{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-size:13.5px;font-weight:500}

  /* ---------- desktop: square tiles in a grid (phones keep the single-column list above) ---------- */
  @media (min-width:760px){
    body{padding-top:36px}
    .wrap{max-width:1248px}
    header{margin-bottom:22px}
    .seg{max-width:420px}
    main{display:grid;grid-template-columns:repeat(auto-fill,240px);gap:12px;align-items:start}
    main > *{grid-column:1/-1}
    main > .card.item, main > .card.medc{grid-column:auto;width:240px;height:240px;min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:18px}
    .card.item > div:nth-child(2){flex:1}
    .card.item .big{font-size:29px}
    .card.item .big.txt{font-size:23px}
    .card.item .acts{gap:4px}
    
    .card.medc .meds-h{margin-bottom:6px}
    .card.medc .meds{grid-template-columns:1fr;flex:1;align-content:end}
    main > h2{margin-top:14px}
    main > .card.log, main > .card.tblc, main > .card.rounds{max-width:720px}
    main > .card.sumnav{max-width:440px}
    main > .card.cyc{max-width:744px}
    .tiles, .tiles.two{grid-template-columns:repeat(auto-fill,minmax(170px,190px));gap:14px}
    .tiles .tile{grid-column:auto !important;aspect-ratio:1/1;padding:18px;justify-content:flex-end}
    .tiles .tile .ic{margin-bottom:auto}
    .tbl tr[data-day]:hover td{background:var(--bg)}
    .log .r[data-e]:hover{background:var(--bg);margin:0 -16px;padding-left:16px;padding-right:16px}
    .bg{align-items:center}
    .sheet{max-width:440px;border-radius:22px;padding-bottom:22px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="mark" id="mark"></div><h1>קוצ׳יק וקישמיש</h1></div>
    <div class="hr"><button class="me" id="me"></button><button class="sync" id="sync"><i></i><span>טוען…</span></button></div>
  </header>
  <div class="seg">
    <button data-pet="kochik">קוצ׳יק</button>
    <button data-pet="kishmish">קישמיש</button>
  </div>

  kishmish: {name:'קישמיש', items:['food','pee','poop','sleep','cry','crate'], cycle:true, where:['gravel','pad','floor','crate','out']}

// The trainer's potty-training routine for pets with `cycle:true`: crate → walk + potty → play → food → potty → crate.
// `k` = the timer that the step owns (started on entering, stopped on leaving); `food` logs a meal on entering;

const CYCLE = [
  {n:'כלוב', k:'crate'},
  {n:'טיול וצרכים', potty:true},
  {n:'משחק', play:true},
  {n:'אוכל', food:true},
  {n:'צרכים', potty:true}

// The choices offered per pet, best place first. Kishmish is not vaccinated yet and does not go outside: her target is the gravel on the balcony.
const whereKeys = p => PETS[p].where || Object.keys(WHERE);
const WHERE_SHORT = {out:'בחוץ', gravel:'חצץ', pad:'פד', floor:'רצפה', crate:'כלוב'};
const hasWhere = k => k==='pee' || k==='poop';
const CRATE_MAX = 2*3600000;   // a crate stay longer than this turns red (tile and strip)
const DAY_FROM = 7, DAY_TO = 22;   // the red crate flag is only shown between these hours
const BREAK = -1;   // pseudo step in `hist`: the routine is on hold (vet, a trip…); it ends the round
const stepName = i => i === BREAK ? 'הפסקה' : CYCLE[i].n;
const HIST_MAX = 1500;   // step changes kept for the rounds list (about a month)
const DUE_MAX = 60*60000;   // the "take her out" reminder gives up after an hour
const iconOf = k => (ITEMS[k] && ITEMS[k].icon) || k;
const LOG_MAX = 5000, LS_KEY = 'pets-timers-v1';

const USERS = {yonatan:'יונתן', shai:'שי', liza:'ליזה'};   // who is using this device; stamped on every log entry as `by`
let me = null;
let state = blank(), pet = 'kishmish';
let ref = null, writing = false, dirty = false, lastUndo = null, toastTimer = null;

function blank(){ return {kochik:{}, kishmish:{}, log:[]}; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function norm(s){
  const b = blank();
  if(!s || typeof s!=='object') return b;
  for(const p of Object.keys(PETS)) b[p] = (s[p] && typeof s[p]==='object') ? clone(s[p]) : {};
  b.log = Array.isArray(s.log) ? clone(s.log).filter(e => e && ITEMS[e.k] && PETS[e.p]) : [];
  return b;
}

// ---------- persistence ----------
try { const ls = localStorage.getItem(LS_KEY); if(ls) state = norm(JSON.parse(ls)); } catch(e){}
try { const p = localStorage.getItem(LS_KEY+'-tab'); if(p && PETS[p]) pet = p; } catch(e){}
try { const u = localStorage.getItem(LS_KEY+'-user'); if(USERS[u]) me = u; } catch(e){}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); localStorage.setItem(LS_KEY+'-base', JSON.stringify(base)); }catch(e){} }

// ---------- merging (so one phone never overwrites what another phone wrote) ----------
// `base` is the last state this device knows the server has. Only the difference between `base` and
// `state` — what was changed here — is ever sent, and it is applied on top of whatever the server holds
// at that moment. Pet objects are compared field by field (arrays such as `hist` as a whole); the log is
// compared entry by entry, keyed by pet + kind + time.
let base = null;
try { const b = localStorage.getItem(LS_KEY+'-base'); if(b) base = norm(JSON.parse(b)); } catch(e){}
const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
function canon(v){   // JSON with sorted keys: equal data compares equal whatever order the keys came back in
  if(Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  if(isObj(v)) return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
const logKey = e => `${e.p}|${e.k}|${e.t}`;
function diff(a, b){
  const d = {set:[], del:[], rem:[], add:[]};
  const walk = (x, y, path) => {
    for(const k of new Set(Object.keys(x || {}).concat(Object.keys(y || {})))){
      const u = x ? x[k] : undefined, v = y ? y[k] : undefined;
      if(u === undefined && v === undefined) continue;
      if(u !== undefined && v !== undefined && canon(u) === canon(v)) continue;
      const at = path.concat(k);
      if(v === undefined) d.del.push(at);
      else if(isObj(u) && isObj(v)) walk(u, v, at);
      else d.set.push([at, v]);
    }
  };
  for(const pt of Object.keys(PETS)) walk(a[pt], b[pt], [pt]);
  const A = new Map(a.log.map(e => [logKey(e), canon(e)])), B = new Map(b.log.map(e => [logKey(e), e]));
  for(const [k, c] of A) if(!B.has(k) || canon(B.get(k)) !== c) d.rem.push(k);
  for(const [k, e] of B) if(A.get(k) !== canon(e)) d.add.push(e);
  return d;
}
const noDiff = d => !d.set.length && !d.del.length && !d.rem.length && !d.add.length;
function patch(d, onto){   // returns a new state: `onto` with the changes `d` applied
  const s = norm(onto);
  for(const path of d.del){ let o = s; for(const k of path.slice(0,-1)){ o = isObj(o) ? o[k] : undefined; } if(isObj(o)) delete o[path[path.length-1]]; }
  for(const [path, v] of d.set){ let o = s; for(const k of path.slice(0,-1)){ if(!isObj(o[k])) o[k] = {}; o = o[k]; } o[path[path.length-1]] = clone(v); }
  if(d.rem.length || d.add.length){
    const gone = new Set(d.rem.concat(d.add.map(logKey)));
    s.log = s.log.filter(e => !gone.has(logKey(e))).concat(clone(d.add));
    s.log.sort((x,y) => x.t-y.t); s.log = s.log.slice(-LOG_MAX);
  }
  return s;
}
// What the server holds has arrived (live update, or a fresh read when the app comes back to the front):
// take it as the new base and keep on top of it anything changed here that has not been sent yet.
function onServer(data){
  if(writing) return;   // the save in flight reads the server itself and merges
  const server = norm(data), mine = diff(base, state);
  const local = state;
  base = server; state = noDiff(mine) ? clone(server) : patch(mine, server);
  const found = salvage(local);
  saveLocal(); render();
  if(noDiff(mine) && !found) setSync('מסונכרן','on'); else push();
}
// Once per device, on its first contact with the server: entries this person logged here in the last
// two days that the server does not have (the phone was signed out or not allowed, or an old version
// of the app overwrote them) are added back, so they are sent with the next save.
function salvage(local){
  try { if(!me || localStorage.getItem(LS_KEY+'-salvaged')) return 0; localStorage.setItem(LS_KEY+'-salvaged', '1'); } catch(e){ return 0; }
  const have = new Set(state.log.map(logKey)), since = Date.now() - 2*86400000;
  const lost = local.log.filter(e => e.by === me && e.t >= since && !have.has(logKey(e)));
  for(const e of clone(lost)){
    state.log.push(e);
    if(e.k.startsWith('med_')){
      const meds = state[e.p].meds = state[e.p].meds || {}, day = meds[dayKey(e.t)] = meds[dayKey(e.t)] || {};
      if(!day[e.k.slice(4)]) day[e.k.slice(4)] = e.t;
    }
  }
  state.log.sort((x,y) => x.t-y.t);
  for(const e of lost) if(!e.k.startsWith('med_')) recalc(e.p, e.k);
  return lost.length;
}

// One-time import of the state copied from the old claude.ai artifact on 22.11.2026 (only into an
// empty app, only for two days after that). Safe to delete.
(function seed(){
  const at = (h,m) => new Date(2026,10,22,h,m).getTime();
  try {
    if(state.log.length || Object.keys(state.kochik).length || Object.keys(state.kishmish).length) return;
    if(localStorage.getItem(LS_KEY+'-seed') || Date.now() > at(19,36) + 2*86400000) return;
    localStorage.setItem(LS_KEY+'-seed','1');
  } catch(e){ return; }
  state = norm({
    kochik:   {food:at(17,0)},
    kishmish: {food:at(18,15), pee:at(19,20), sleep:{start:at(19,16)}},
    log: [{p:'kochik',k:'food',t:at(17,0)}, {p:'kishmish',k:'food',t:at(18,15)},
          {p:'kishmish',k:'pee',t:at(19,15)}, {p:'kishmish',k:'pee',t:at(19,20)}]
  });

})();
if(!base) base = clone(state);
function setSync(t, cls=''){ const s=document.getElementById('sync'); s.className='sync '+cls; s.querySelector('span').textContent=t; }

let retryTimer = null;
async function push(){
  saveLocal();
  if(!ref) return;
  if(writing){ dirty = true; return; }
  clearTimeout(retryTimer);
  const sent = clone(state), mine = diff(base, sent);
  if(noDiff(mine)){ setSync('מסונכרן','on'); return; }
  writing = true; setSync('שומר…');
  try {
    // One transaction: read what the server has right now, put only this device's changes on top, write.
    const merged = norm(await ref.merge((server, exists) => exists ? patch(mine, server) : sent));
    const later = diff(sent, state);          // taps made while the save was on its way
    base = merged; state = noDiff(later) ? clone(merged) : patch(later, merged);
    if(!noDiff(later)) dirty = true;
    saveLocal(); render(); setSync('מסונכרן','on');
  } catch(e){
    // Nothing is lost: the changes stay on this device (state vs. base) and are sent again later.
    if(e && e.code === 'permission-denied') setSync('אין הרשאה','err');
    else { setSync('ממתין לחיבור','err'); retryTimer = setTimeout(push, 20000); }
  }
  writing = false;
  if(dirty){ dirty = false; push(); }
}

// Firebase (Firestore + Google sign-in). Paste the web-app config from the Firebase console
// (Project settings → Your apps → SDK setup and configuration). While it is null the app
// works on this device only (localStorage).
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBneMeIPhvpRJ3mzTwT6uX1UIe5iUASgUE",
  authDomain: "pets-timers.firebaseapp.com",
  projectId: "pets-timers",
  storageBucket: "pets-timers.firebasestorage.app",
  messagingSenderId: "638712299148",
  appId: "1:638712299148:web:43c5a48342dc731caf45a9"
};
// ---------- sign-in gate ----------
// The app is unusable until this device is signed in with a Google account that the Firestore rules
// allow. The allowed emails live only in the rules (Firebase console), never in this public repo; the
// app learns the answer from the server: the first document read succeeds or is refused.
// A device that was allowed before (its email is remembered in localStorage) opens straight away, so
// the app still works with no connection; a sign-out or a refusal locks it again.
const AUTH_KEY = LS_KEY+'-authok';
let authOk = null;
try { authOk = localStorage.getItem(AUTH_KEY); } catch(e){}
function setGate(mode, email){
  const g = document.getElementById('gate');
  if(mode === 'off'){ g.hidden = true; return; }
  const paw = `<div class="mark"><svg viewBox="0 0 24 24">${ICONS.paw}</svg></div><h2>קוצ׳יק וקישמיש</h2>`;
  const body = {
    loading: `<p>בודק הרשאה…</p>`,
    login:   `<p>כדי להשתמש באפליקציה צריך להתחבר עם חשבון Google מורשה.</p><button class="btn primary" id="gIn">התחברות עם Google</button>`,
    denied:  `<p>החשבון <bdi dir="ltr">${email || ''}</bdi> לא נמצא ברשימת המורשים.</p><p>אפשר להתחבר עם חשבון אחר, או לבקש שיוסיפו את המייל הזה.</p>
              <button class="btn primary" id="gOut">החלפת חשבון</button><button class="ghost" id="gRetry">הוסיפו אותי · לנסות שוב</button>`,
    offline: `<p>אין חיבור לאינטרנט, ובמכשיר הזה עוד לא התחברו. צריך חיבור כדי להתחבר בפעם הראשונה.</p><button class="btn primary" id="gRetry">לנסות שוב</button>`
  }[mode];
  g.innerHTML = `<div class="box">${paw}${body}</div>`; g.hidden = false;
  const on = (id, fn) => { const b = g.querySelector('#'+id); if(b) b.onclick = fn; };
  on('gIn', () => document.getElementById('sync').click());
  on('gOut', () => fb && fb.signOut());
  on('gRetry', () => location.reload());
}
function allow(email){ authOk = email; try { localStorage.setItem(AUTH_KEY, email); } catch(e){} setGate('off'); }
function lock(mode, email){ authOk = null; try { localStorage.removeItem(AUTH_KEY); } catch(e){} setGate(mode, email); }
if(FIREBASE_CONFIG && !authOk) setGate('loading');

const FB_CDN = 'https://www.gstatic.com/firebasejs/10.14.1/';
let fb = null;   // { auth, signIn(), signOut() } once Firebase has loaded

(async () => {
  if(!FIREBASE_CONFIG){ setSync('נשמר במכשיר'); return; }
  let A, F, app;
  try {
    const mods = await Promise.all(['app','auth','firestore'].map(m => import(`${FB_CDN}firebase-${m}.js`)));
    app = mods[0].initializeApp(FIREBASE_CONFIG); A = mods[1]; F = mods[2];
  } catch(e){ setSync('אין חיבור','err'); if(!authOk) setGate('offline'); return; }

  const auth = A.getAuth(app);
  let store;
  try { store = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})}); }
  catch(e){ store = F.getFirestore(app); }
  const docRef = F.doc(store, 'state', 'main');
  fb = {
    auth,
    signIn: () => A.signInWithPopup(auth, new A.GoogleAuthProvider()),
    signOut: () => A.signOut(auth)
  };

  let unsub = null, t = null;
  A.onAuthStateChanged(auth, user => {
    if(unsub){ unsub(); unsub = null; }
    clearTimeout(t); clearTimeout(retryTimer); ref = null; writing = dirty = false;
    if(!user){ setSync('התחברות','login'); lock('login'); return; }
    setSync('טוען…');
    if(authOk !== user.email) setGate('loading');   // a different account: wait for the server's answer
    ref = {
      merge: fn => F.runTransaction(store, async tx => {
        const snap = await tx.get(docRef);
        const merged = clone(fn(snap.exists() ? snap.data() : null, snap.exists()));
        tx.set(docRef, merged);
        return merged;
      }),
      fresh: () => F.getDocFromServer(docRef).then(snap => { if(snap.exists()) onServer(snap.data()); })
    };
    t = setTimeout(()=>setSync('אין חיבור','err'), 10000);
    unsub = F.onSnapshot(docRef, {includeMetadataChanges:true}, snap => {
      if(!snap.metadata.fromCache) clearTimeout(t);
      // Only what really came from the server counts; the offline copy is this device's own localStorage.
      if(snap.metadata.fromCache || snap.metadata.hasPendingWrites) return;
      allow(user.email);   // the server answered: this account is on the list
      if(snap.exists()) onServer(snap.data());
      else if(state.log.length){ base = blank(); push(); }   // first device ever: create the document
      else setSync('מסונכרן','on');
    }, err => {
      clearTimeout(t); ref = null;
      if(err && err.code==='permission-denied'){ setSync('אין הרשאה','err'); lock('denied', user.email); }
      else { setSync('נשמר במכשיר'); if(authOk !== user.email) setGate('offline'); }
    });
  });
})();

// Phones pause the live connection in the background. Coming back to the front: read the server now
// (do not wait for the listener to wake up) and send anything that is still waiting here.
function resync(){
  if(document.hidden || !ref || writing) return;
  ref.fresh().catch(() => {}).then(() => { if(ref && !writing && !noDiff(diff(base, state))) push(); });
}
document.addEventListener('visibilitychange', resync);
window.addEventListener('pageshow', resync);
window.addEventListener('online', resync);

document.getElementById('sync').onclick = async () => {
  if(!fb) return;
  const u = fb.auth.currentUser;
  if(u){ if(confirm(`להתנתק מ־${u.email}?`)) fb.signOut(); return; }
  try { await fb.signIn(); }
  catch(e){
    if(e && (e.code==='auth/popup-closed-by-user' || e.code==='auth/cancelled-popup-request')) return;
    setSync('ההתחברות נכשלה','err');
    setTimeout(() => { if(!fb.auth.currentUser) setSync('התחברות','login'); }, 3000);
  }
};

// ---------- actions ----------
function commit(msg, mutate){
  if(!me){ openUserSheet(() => commit(msg, mutate)); return; }
  const before = clone(state), old = new Set(state.log);
  mutate();
  for(const e of state.log) if(!old.has(e) && !e.by) e.by = me;
  state.log.sort((x,y)=>x.t-y.t);
  state.log = state.log.slice(-LOG_MAX);
  const after = clone(state);
  render(); push(); showToast(msg, {before, after});
}
function tapPoint(p, k, t){
  t = t || Date.now();
  commit(`${PETS[p].name} · ${ITEMS[k].log}`, () => {
    const cur = state[p][k];
    state[p][k] = (typeof cur==='number' && cur > t) ? cur : t;
    state.log.push({p,k,t});
  });
  if(hasWhere(k)) whereSheet(p, k, t);
}
function tapDur(p, k, at){   // `at`: start a timer that began earlier ("she went in 10 minutes ago and is still there")
  const now = Date.now(), d = state[p][k] || {};
  if(d.start && !at) commit(`${PETS[p].name} · ${ITEMS[k].stop}`, () => {
    stopDur(p, k, now);
    // Keep the routine strip in step with the crate tile: leaving the crate = awake, on to "walk + potty".
    if(PETS[p].cycle && k==='crate'){ stopDur(p, 'sleep', now); if(!(state[p].cyc && state[p].cyc.i === 1)) setStep(state[p], 1, now); }
  });
  else commit(`${PETS[p].name} · ${ITEMS[k].start}`, () => {
    const t = at || now;
    state[p][k] = Object.assign({}, state[p][k] || {}, {start:t});
    if(PETS[p].cycle && k==='crate') setStep(state[p], 0, t);
  });
}
function stopDur(p, k, t){
  const d = state[p][k] || {}; if(!d.start) return;
  const end = Math.max(t, d.start);
  state[p][k] = {lastStart:d.start, lastEnd:end};
  state.log.push({p, k, t:d.start, end});
}
// Move the routine to step i: stop the crate timer if the crate step is being left, start the new step's
// timer, and log a meal when entering the food step. One commit, so the toast undoes all of it.
function goStep(p, i, at){   // `at`: the step really began earlier (forgot to tap at the time)
  const st = CYCLE[i]; if(!st) return;
  const S0 = state[p], same = !!(S0.cyc && S0.cyc.i === i), crateOn = !!(S0.crate && S0.crate.start);
  // Tapping the step she is already in does nothing — unless the crate timer disagrees with the step
  // (crate step but no timer, or another step while the timer still runs); then the tap puts it right.
  if(same && (i === 0 ? crateOn : !crateOn)) return;
  commit(`${PETS[p].name} · ${st.n}`, () => {
    const S = state[p], h = S.hist || [];
    // Never earlier than the previous step or than the moment she went into the crate, never in the future.
    const now = Math.min(Date.now(), Math.max(at || Date.now(), h.length ? h[h.length-1].t : 0, (S.crate && S.crate.start) || 0));
    if(st.k !== 'crate'){ stopDur(p, 'crate', now); stopDur(p, 'sleep', now); }
    if(S.cyc && CYCLE[S.cyc.i] && CYCLE[S.cyc.i].play && !same) S.playEnd = now;
    if(st.k && !(S[st.k] || {}).start) S[st.k] = Object.assign({}, S[st.k] || {}, {start:now});
    if(st.food){ S.food = Math.max(S.food || 0, now); state.log.push({p, k:'food', t:now}); }
    if(!same || i === 0) setStep(S, i, now);
  });
}
// "The step began earlier": pick how long ago or a time, then move the routine there at that time.
function openStepAtSheet(p, i){
  const inCrate = !!(state[p].crate && state[p].crate.start);
  sheet(`${PETS[p].name} · ${inCrate && i === 1 ? 'יצאה מהכלוב' : CYCLE[i].n} — מתי?`,
    chips([5,10,15,30,60]) + `<label class="field">או בשעה ${timeField("tIn", nowStr())}</label>`,
    cancelBtn, () => { const v = timeVal('tIn'); if(!v) return; close(); goStep(p, i, timeToTs(v)); },
    ts => goStep(p, i, ts));
}
// Put the routine on hold (vet, a trip…). She is out of the crate and awake; the round ends here
// and the next step that is tapped starts a new round.
function goBreak(p){
  commit(`${PETS[p].name} · הפסקה בשגרה`, () => {
    const now = Date.now(), S = state[p];
    for(const k of ['crate','sleep']) stopDur(p, k, now);
    if(S.cyc && CYCLE[S.cyc.i] && CYCLE[S.cyc.i].play) S.playEnd = now;
    setStep(S, BREAK, now);
  });
}
// The current step plus a short history of step changes (`hist`), which is what the rounds list is built from.
function setStep(S, i, t){
  const h = Array.isArray(S.hist) ? S.hist : (S.cyc ? [S.cyc] : []);
  if(h.length) t = Math.max(t, h[h.length-1].t);   // a timer started "10 minutes ago" must not go back in the history
  S.cyc = {i, t};
  S.hist = h.concat([{i, t}]).slice(-HIST_MAX);
}
// Rounds of the routine, built from `hist`. A round starts when she goes into the crate (step 1 of the
// trainer's cycle); going back to an earlier step inside a round is a correction, not a new round.
// Rounds are numbered per day by the day they started on. `j` = the step's index in `hist`.
function rounds(p){
  const h = state[p].hist || [], out = [], perDay = {};
  let cur = null;
  h.forEach((s, j) => {
    if(s.i === BREAK){   // shown as the last row of the round it interrupted; whatever comes next is a new round
      if(cur){ cur.steps.push({i:BREAK, t:s.t, end: h[j+1] ? h[j+1].t : null, j}); cur.end = s.t; }
      cur = null; return;
    }
    if(!CYCLE[s.i]) return;
    if(!cur || s.i === 0){
      const day = dayKey(s.t); perDay[day] = (perDay[day] || 0) + 1;
      cur = {t:s.t, day, n:perDay[day], steps:[]}; out.push(cur);
    }
    const end = h[j+1] ? h[j+1].t : null;
    cur.steps.push({i:s.i, t:s.t, end, j});
    cur.end = end;
  });
  return out;
}
function roundName(r){ const dl = dayLabel(r.t); return `סבב ${r.n}${dl==='היום' ? '' : ' · '+dl}`; }
function roundsHTML(p, rs){
  return rs.map(r =>
    `<div class="rd"><div class="rd-h"><b>${roundName(r)}</b><span>התחיל ב־<bdi dir="ltr">${clock(r.t)}</bdi> · ${r.end ? 'נמשך '+words(r.end-r.t) : 'עכשיו'}</span></div>
      <div class="rd-l">${r.steps.map(s => `<button class="${s.end?'':'now'}" data-act="rstep" data-k="${s.j}"><time>${clock(s.t)}</time><i>${stepName(s.i)}</i><span>${stepResult(p, s)}</span></button>`).join('')}</div></div>`).join('');
}
// Move a step's start time (= the end of the step before it), and move along with it whatever the
// routine itself wrote at that same moment: the crate timer's start / end and the meal of the food step.
function editStepTime(p, j, nt){
  commit(`${PETS[p].name} · ${stepName(state[p].hist[j].i)} עודכן`, () => {
    const S = state[p], h = S.hist[j], old = h.t, st = CYCLE[h.i] || {}, prev = S.hist[j-1] && CYCLE[S.hist[j-1].i];
    h.t = nt;
    if(j === S.hist.length-1) S.cyc = {i:h.i, t:nt};
    if(st.k){
      if(S[st.k] && S[st.k].start === old) S[st.k].start = nt;
      for(const e of state.log) if(e.p===p && e.k===st.k && e.t===old) e.t = nt;
      recalc(p, st.k);
    }
    if(st.food){ for(const e of state.log) if(e.p===p && e.k==='food' && e.t===old) e.t = nt; recalc(p, 'food'); }
    if(prev && prev.k){ for(const e of state.log) if(e.p===p && e.k===prev.k && e.end===old) e.end = nt; recalc(p, prev.k); }
    if(prev && prev.play && S.playEnd === old) S.playEnd = nt;
  });
}
// Fix one step of any round: its start time, what happened in it (pee / poop / nothing, at a chosen time),
// or remove the step. Entries already logged in it are listed and open their own edit sheet.
function openStepSheet(p, j){
  const S = state[p], h = (S.hist || [])[j]; if(!h || !(CYCLE[h.i] || h.i === BREAK)) return;
  const r = rounds(p).find(x => x.steps.some(s => s.j === j)); if(!r) return;
  const s = r.steps.find(x => x.j === j);
  const lo = j > 0 ? S.hist[j-1].t : 0, hi = s.end || Date.now();
  const at = v => { const [hh,mm] = v.split(':').map(Number), d = new Date(h.t); d.setHours(hh,mm,0,0); return d.getTime(); };
  const evs = state.log.filter(e => e.p===p && !ITEMS[e.k].dur && e.t >= s.t && e.t < (s.end || Infinity));
  sheet(`${PETS[p].name} · ${roundName(r)} · ${stepName(h.i)}`,
    `<label class="field">השלב התחיל ב־ ${timeField("tIn", clock(h.t))}</label>
     <div class="sub" style="margin:14px 0 8px">להוסיף מה שקרה בשלב הזה:</div>
     <div class="chips" style="margin-bottom:8px">${['pee','poop','none'].map(k => `<button data-add="${k}">${k==='none' ? 'לא עשתה' : ITEMS[k].log}</button>`).join('')}</div>
     <label class="field">בשעה ${timeField("eIn", clock(h.t))}</label>` +
    (evs.length ? `<div class="sub" style="margin:14px 0 2px">נרשם בשלב הזה (איפה — כאן; לחיצה על השורה לתיקון שעה או מחיקה):</div><div class="log" style="padding:0">${evs.map(ev =>
      logRow(ev) + (hasWhere(ev.k) ? `<div class="chips mini" data-ev="${ev.k}|${ev.t}">${whereKeys(p).map(w => `<button data-w="${w}" class="${ev.w===w?'sel':''}">${WHERE[w]}</button>`).join('')}</div>` : '')).join('')}</div>` : ''),
    '<button class="btn danger" id="del">מחיקת השלב</button>',
    () => {
      const v = timeVal('tIn'); if(!v) return;
      const nt = at(v);
      if(v === clock(h.t)){ close(); return; }   // the field has minutes only; same minute = unchanged
      if(nt < lo || nt > hi){ sh.querySelector('#tIn').classList.add('bad'); return; }   // must stay between its neighbours
      close(); editStepTime(p, j, nt);
    });
  sh.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    const v = timeVal('eIn'); if(!v) return;
    const ts = v === clock(h.t) ? h.t : at(v);   // same minute as the step start: keep it inside the step
    close(); tapPoint(p, b.dataset.add, Math.min(ts, Date.now()));
  });
  sh.querySelectorAll('.r[data-e]').forEach(el => el.onclick = () => openEntrySheet(+el.dataset.e));
  // Where it happened can be set right here, one tap, without leaving the round.
  sh.querySelectorAll('.chips.mini').forEach(box => box.querySelectorAll('[data-w]').forEach(b => b.onclick = () => {
    const [k, t] = box.dataset.ev.split('|'), x = state.log.find(e => e.p===p && e.k===k && e.t===+t); if(!x) return;
    if(x.w === b.dataset.w) delete x.w; else x.w = b.dataset.w;
    box.querySelectorAll('[data-w]').forEach(y => y.classList.toggle('sel', y.dataset.w === x.w));
    render(); push();
  }));
  sh.querySelector('#del').onclick = () => {
    close();
    commit(`${PETS[p].name} · ${stepName(h.i)} נמחק מהסבב`, () => {
      const H = state[p].hist, st = CYCLE[h.i] || {}, S = state[p];
      H.splice(j, 1);
      if(j === H.length){ if(H.length) S.cyc = Object.assign({}, H[H.length-1]); else delete S.cyc; }
      // Take along what the routine itself wrote for this step: the crate stay or the meal that began with it.
      const k = st.k || (st.food ? 'food' : null);
      if(k){
        if(st.k && S[k] && S[k].start === h.t) delete S[k].start;
        state.log = state.log.filter(e => !(e.p===p && e.k===k && e.t===h.t));
        recalc(p, k);
      }
    });
  };
}
function stepResult(p, s){
  const st = CYCLE[s.i] || {brk:true}, to = s.end || Infinity, parts = [];
  if(st.k || st.play || st.brk) parts.push(s.end ? words(s.end - s.t) : 'עכשיו');
  if(st.food) parts.push('אכלה');
  for(const e of state.log){
    if(e.p !== p || e.t < s.t || e.t >= to) continue;
    if(hasWhere(e.k)) parts.push(ITEMS[e.k].log + (WHERE[e.w] ? ` <em class="wh ${e.w}">${WHERE_SHORT[e.w]}</em>` : ''));
    else if(e.k === 'none') parts.push('<em class="wh no">לא עשתה</em>');
  }
  if(st.potty && !parts.length) parts.push(s.end ? '<em class="wh no">לא נרשם</em>' : '…');
  return parts.join(', ');
}
// When a puppy needs to go out (trainer's list): after waking up, leaving the crate, playing or eating.
// Returns the latest such moment if nothing (pee, poop, or "went out, nothing") was logged since.
function pottyDue(p){
  const S = state[p], c = [];
  if((S.sleep && S.sleep.start) || (S.crate && S.crate.start)) return null;
  if(S.sleep && S.sleep.lastEnd) c.push([S.sleep.lastEnd, 'אחרי שינה']);
  if(S.crate && S.crate.lastEnd) c.push([S.crate.lastEnd, 'אחרי יציאה מהכלוב']);
  if(S.playEnd) c.push([S.playEnd, 'אחרי משחק']);
  if(typeof S.food === 'number') c.push([S.food, 'אחרי אוכל']);
  c.sort((a,b) => b[0]-a[0]);
  if(!c.length) return null;
  const done = Math.max(S.pee || 0, S.poop || 0, S.none || 0, S.out || 0);
  if(done >= c[0][0] || Date.now() - c[0][0] > DUE_MAX) return null;
  return {t:c[0][0], why:c[0][1]};
}
function dayKey(t){ const d=new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function medsOf(p){ return ((state[p].meds||{})[dayKey(Date.now())]) || {}; }
function setMed(p, slot, ts){
  const k = 'med_'+slot;
  commit(`${PETS[p].name} · ${ITEMS[k].log}${ts?'':' בוטלה'}`, () => {
    const day = dayKey(Date.now());
    const meds = Object.assign({}, state[p].meds || {});
    const cur = Object.assign({}, meds[day] || {});
    state.log = state.log.filter(e => !(e.p===p && e.k===k && dayKey(e.t)===day));
    if(ts){ cur[slot] = ts; state.log.push({p,k,t:ts}); } else delete cur[slot];
    meds[day] = cur;
    const keys = Object.keys(meds).sort(); while(keys.length > 60) delete meds[keys.shift()];
    state[p].meds = meds;
  });
}

// ---------- formatting ----------
function pad(n){ return String(n).padStart(2,'0'); }
function dur(ms){
  const s = Math.floor(Math.max(0,ms)/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  return h ? `${h}:${pad(m)}:${pad(s%60)}` : `${m}:${pad(s%60)}`;
}
function words(ms){
  const m = Math.round(Math.max(0,ms)/60000);
  if(m < 1) return 'פחות מדקה';
  if(m < 60) return m===1 ? 'דקה' : `${m} דקות`;
  const h = Math.floor(m/60), r = m%60;
  return (h===1?'שעה':h===2?'שעתיים':`${h} שעות`) + (r ? ` ו־${r} דק׳` : '');
}
function clock(t){ const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function dayLabel(t){
  const d = new Date(t), n = new Date(), y = new Date(); y.setDate(n.getDate()-1);
  if(d.toDateString()===n.toDateString()) return 'היום';
  if(d.toDateString()===y.toDateString()) return 'אתמול';
  return `${d.getDate()}.${d.getMonth()+1}`;
}
function todayTotal(p, k){
  const s = new Date(); s.setHours(0,0,0,0); const s0 = s.getTime();
  let tot = 0;
  for(const e of state.log) if(e.p===p && e.k===k && e.end && e.end > s0) tot += e.end - Math.max(e.t, s0);
  const live = state[p][k] && state[p][k].start;
  if(live) tot += Date.now() - Math.max(live, s0);
  return tot;
}

// ---------- render ----------
function render(){
  document.body.className = document.documentElement.className = 'p-'+pet;
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.pet===pet || b.dataset.view===view));
  if(view==='sum'){ document.getElementById('main').innerHTML = renderSummary(); return; }
  const P = PETS[pet], S = state[pet];
  let h = '';

  if(P.meds){
    const m = medsOf(pet), hr = new Date().getHours();
    const slot = (s, lbl, lateHour) => {
      const t = m[s], late = !t && hr >= lateHour;
      return `<button class="med ${t?'done':''} ${late?'late':''}" data-act="med" data-k="${s}">
        <span class="ck">${t?ico('check'):''}</span>
        <span><b>${lbl}</b><small>${t?'ניתנה ב־'+clock(t)+byOf(pet,'med_'+s,t):(late?'עוד לא ניתנה':'לא ניתנה')}</small></span></button>`;
    };
    h += `<div class="card medc"><div class="meds-h"><div class="ic">${ico('pill')}</div><b>תרופות היום</b></div>
      <div class="meds">${slot('am','בוקר',11)}${slot('pm','ערב',21)}</div></div>`;
  }

  if(P.cycle) h += cycleHTML(pet);

  for(const k of P.items){
    const it = ITEMS[k];
    if(!it.dur){
      const t = S[k];
      h += `<div class="card item">
        <div class="ic">${ico(k)}</div>
        <div><div class="lbl">${it.lbl}</div>
          <div class="big ${t?'':'none'}" ${t?`data-since="${t}"`:''}>${t ? dur(Date.now()-t) : '–'}</div>
          <div class="sub">${t ? `${dayLabel(t)} ב־${clock(t)}${whereOf(pet,k,t) || (hasWhere(k) ? ` · <button class="lnk" data-act="where" data-k="${k}">איפה?</button>` : '')}${byOf(pet,k,t)}` : 'עוד לא נרשם'}</div>
          ${P.cycle && typical(pet,k) ? `<div class="sub hint">${typical(pet,k)}</div>` : ''}</div>
        <div class="acts"><button class="go" data-act="pt" data-k="${k}">${it.btn}</button>
          <button class="ghost" data-act="edit" data-k="${k}">${ico('clock','s')}שעה אחרת</button></div></div>`;
    } else {
      const d = S[k] || {}, live = !!d.start, tt = todayTotal(pet,k);
      let lbl, big, sub;
      if(live){
        lbl = `<span class="dot"></span>${it.live} כבר`;
        big = `<div class="big" data-since="${d.start}">${dur(Date.now()-d.start)}</div>`;
        sub = `מ־${clock(d.start)}`;
      } else if(d.lastEnd){
        lbl = it.lbl;
        big = `<div class="big txt">${words(d.lastEnd-d.lastStart)}</div>`;
        sub = `לפני <span data-words="${d.lastEnd}">${words(Date.now()-d.lastEnd)}</span>`;
      } else { lbl = it.lbl; big = `<div class="big none">–</div>`; sub = 'עוד לא נרשם'; }
      const cur = live ? Date.now()-d.start : (d.lastEnd ? d.lastEnd-d.lastStart : 0);
      if(tt > cur + 60000) sub += ` · סה״כ היום <span data-total="${k}">${words(tt)}</span>`;
      const over = k==='crate' && crateOver(pet);
      if(over) sub += ` · יותר מ${words(CRATE_MAX)}`;
      h += `<div class="card item ${live?'live':''} ${k==='cry' || over?'cry':''}">
        <div class="ic">${ico(k)}</div>
        <div><div class="lbl">${lbl}</div>${big}<div class="sub">${sub}</div></div>
        <div class="acts"><button class="go" data-act="dur" data-k="${k}">${live?it.stop:it.start}</button>
          <button class="ghost" data-act="edit" data-k="${k}">${ico(live?'clock':'plus','s')}${live?'שעת התחלה':'הוספה'}</button></div></div>`;
    }
  }

  if(P.cycle){
    const all = rounds(pet), today = dayKey(Date.now());
    let rs = all.filter(r => r.day === today || !r.end);
    if(!rs.length) rs = all.slice(-1);
    if(rs.length) h += `<h2>סבבים<small>לחיצה על שלב לתיקון · ימים קודמים בסיכום</small></h2><div class="card rounds">${roundsHTML(pet, rs.reverse())}</div>`;
  }

  const items = state.log.filter(e => e.p===pet).slice(-25).reverse();
  h += `<h2>היסטוריה<small>לחיצה על רישום לתיקון או מחיקה</small></h2><div class="card log">` + (items.length ? items.map(logRow).join('') : `<div class="empty">אין עדיין רישומים</div>`) + `</div>`;
  document.getElementById('main').innerHTML = h;
}
function cycleHTML(p){
  const S = state[p], brk = !!(S.cyc && S.cyc.i === BREAK), now = Date.now(), rn = rounds(p).pop();
  // Being in the crate is a state that only ends when someone marks that she was taken out: while the
  // crate timer runs the strip shows the crate step, the other steps are locked, and the one way on is
  // the explicit "הוצאתי אותה מהכלוב" button (or the same button on the crate tile).
  const inCrate = !!(S.crate && S.crate.start), over = crateOver(p);
  const c = inCrate ? {i:0, t:S.crate.start} : (S.cyc && CYCLE[S.cyc.i] ? S.cyc : null), ci = c ? c.i : -1;
  // While she sleeps the strip does not push on: the only suggestion is what to do when she wakes up.
  const asleep = !!(S.sleep && S.sleep.start), next = (ci+1) % CYCLE.length;
  const due = pottyDue(p), potty = !asleep && !inCrate && (due || (c && CYCLE[ci].potty));
  const head = c ? `${rn ? roundName(rn)+' · ' : ''}${CYCLE[ci].n}${inCrate ? ` מ־<bdi dir="ltr">${clock(c.t)}</bdi>` : ''} · כבר <span data-words="${c.t}">${words(now-c.t)}</span>`
    : brk ? `בהפסקה · כבר <span data-words="${S.cyc.t}">${words(now-S.cyc.t)}</span>` : 'לחיצה על שלב מתחילה את המעקב';
  const main = inCrate ? `<button class="go ${asleep?'wait':''}" data-act="out">הוצאתי אותה מהכלוב</button>`
    : asleep ? `<button class="go wait" data-act="wake">כשתתעורר: ${CYCLE[1].n}</button>`
    : `<button class="go" data-act="step" data-k="${next}">${brk ? 'חזרה לשגרה' : 'הבא'}: ${CYCLE[next].n}</button>`;
  return `<div class="card cyc ${due||over?'due':''}">
    <div class="cyc-h"><b>השגרה של ${PETS[p].name}</b><small>${head}</small></div>
    <div class="steps">${CYCLE.map((s,i) => `<button class="${i===ci?'on':''}" data-act="step" data-k="${i}" ${inCrate && i!==0 ? 'disabled' : ''}><i>${i+1}</i>${s.n}</button>`).join('')}</div>

// A crate stay longer than CRATE_MAX is flagged red — in the daytime only, so a night in the crate is not an alarm.
function crateOver(p){
  const c = state[p].crate, hr = new Date().getHours();
  return !!(c && c.start) && Date.now() - c.start > CRATE_MAX && hr >= DAY_FROM && hr < DAY_TO;
}
// Two numbers worth knowing, from the last 7 days: how often she usually pees (gaps between pees,
// nights and long breaks left out) and how long after a meal she usually poops. Shown under the tiles
// once there is enough data to mean something.
function median(a){ const s = a.slice().sort((x,y) => x-y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1]+s[m])/2; }
function typical(p, k){
  const since = Date.now() - 7*86400000, ev = kk => state.log.filter(e => e.p===p && e.k===kk && e.t >= since).map(e => e.t), g = [];
  if(k === 'pee'){
    const t = ev('pee');
    for(let i = 1; i < t.length; i++){ const d = t[i]-t[i-1]; if(d >= 10*60000 && d <= 5*3600000) g.push(d); }
    return g.length >= 4 ? `בדרך כלל כל ${words(median(g))}` : '';
  }
  if(k === 'poop'){
    const f = ev('food'), pp = ev('poop');
    for(const m of f){ const n = pp.find(x => x > m); if(n && n-m <= 3*3600000 && !f.some(x => x > m && x < n)) g.push(n-m); }
    return g.length >= 3 ? `בדרך כלל ${words(median(g))} אחרי אוכל` : '';
  }
  return '';
}
function whereTag(w){ return WHERE[w] ? ` · <em class="wh ${w}">${WHERE[w]}</em>` : ''; }
function whereOf(p, k, t){   // " · where" of the pee / poop logged at t, if it was marked
  for(let i = state.log.length-1; i >= 0; i--){ const e = state.log[i]; if(e.p===p && e.k===k && e.t===t) return whereTag(e.w); }
  return '';
}
function byOf(p, k, t){   // " · name" of whoever logged this event, if known
  for(let i = state.log.length-1; i >= 0; i--){ const e = state.log[i]; if(e.p===p && e.k===k && e.t===t) return USERS[e.by] ? ' · '+USERS[e.by] : ''; }

}
function logRow(e){

     <time>${dayLabel(e.t)} <bdi dir="ltr">${clock(e.t)}${e.end ? '–'+clock(e.end) : ''}</bdi></time></div>`;

// ---------- summary ----------
let view = 'now', sumMode = 'day', sumAnchor = Date.now();
let sumFilter = null;   // one kind ("pee", "crate"…) the summary is narrowed to; set by tapping its tile
const DAY = 86400000;
const DOW = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const SUM_LBL = {food:'אוכל', pee:'פיפי', poop:'קקי', sleep:'שינה', cry:'בכי', crate:'כלוב'};
function sod(t){ const d = new Date(t); d.setHours(0,0,0,0); return d; }
function ddmm(t){ const d = new Date(t); return `${d.getDate()}.${d.getMonth()+1}`; }
function hm(ms){ const m = Math.round(ms/60000); return `${Math.floor(m/60)}:${pad(m%60)}`; }
function sumRange(mode, anchor){   // [from, to) — weeks start on Sunday
  const a = sod(anchor);
  if(mode==='week') a.setDate(a.getDate()-a.getDay());
  if(mode==='month') a.setDate(1);
  const b = new Date(a);
  if(mode==='day') b.setDate(b.getDate()+1); else if(mode==='week') b.setDate(b.getDate()+7); else b.setMonth(b.getMonth()+1);
  return [a.getTime(), b.getTime()];
}
function sumShift(dir){
  const d = sod(sumAnchor);
  if(sumMode==='day') d.setDate(d.getDate()+dir);
  else if(sumMode==='week') d.setDate(d.getDate()+7*dir);
  else { d.setDate(1); d.setMonth(d.getMonth()+dir); }
  sumAnchor = Math.min(d.getTime(), Date.now());
}
function stats(p, from, to){
  const r = {food:0, pee:0, poop:0, sleep:{n:0,ms:0}, cry:{n:0,ms:0}, crate:{n:0,ms:0}, meds:0, w:{pee:{}, poop:{}}};
  const add = (k, a, b) => { const ov = Math.min(b,to) - Math.max(a,from); if(ov > 0){ r[k].ms += ov; r[k].n++; } };
  for(const e of state.log){
    if(e.p !== p) continue;
    if(ITEMS[e.k].dur){ if(e.end) add(e.k, e.t, e.end); }
    else if(typeof r[e.k]==='number' && e.t >= from && e.t < to){ r[e.k]++; if(WHERE[e.w] && r.w[e.k]) r.w[e.k][e.w] = (r.w[e.k][e.w] || 0) + 1; }
  }
  for(const k of PETS[p].items) if(ITEMS[k].dur && state[p][k] && state[p][k].start) add(k, state[p][k].start, Date.now());
  const meds = state[p].meds || {};
  for(const d = new Date(from); d.getTime() < to; d.setDate(d.getDate()+1)){ const m = meds[dayKey(d)] || {}; r.meds += (m.am?1:0) + (m.pm?1:0); }
  return r;
}
function whereLine(c){   // "רצפה 1 · פד 2" under the pee / poop tiles
  const parts = ['floor','crate','pad','gravel','out'].filter(w => c && c[w]).map(w => `<em class="wh ${w}">${WHERE_SHORT[w]} ${c[w]}</em>`);
  return parts.length ? `<small>${parts.join(' · ')}</small>` : '';
}
// ---------- charts (summary view) ----------
// Colour says where a pee / poop happened and is the same in both charts: green outside, amber on the
// pad, red for an accident (floor or crate); the balcony gravel counts as outside, grey when it was not marked. Shape says what it was
// (round = pee, square = poop). Every colour is also named in the legend, never colour alone.
const whereCls = w => (w==='out' || w==='gravel') ? 'out' : w==='pad' ? 'pad' : (w==='floor' || w==='crate') ? 'acc' : 'unk';
const WHERE_LEGEND = [['out','בחוץ / על החצץ'], ['pad','על הפד'], ['acc','תאונה (רצפה / כלוב)'], ['unk','לא סומן']];
function eachDay(from, to, fn){ const now = Date.now(); for(const d = new Date(from); d.getTime() < to && d.getTime() <= now; d.setDate(d.getDate()+1)){ const b = new Date(d); b.setDate(b.getDate()+1); fn(d, d.getTime(), b.getTime()); } }
// One bar per day, midnight to midnight (left to right): crate and sleep as bands, meals as ticks,
// every pee / poop as a dot. Tapping a dot opens that entry for fixing.
function timelineHTML(p, from, to, F){   // F: only this kind (optional)
  const now = Date.now(), rows = [], bands = (F ? [F] : ['crate','sleep']).filter(k => PETS[p].items.includes(k) && ITEMS[k].dur);
  const dots = !F || hasWhere(F), meals = !F || F === 'food';
  eachDay(from, to, (d, a, b) => {
    const pct = t => (Math.max(0, Math.min(1, (t-a)/(b-a)))*100).toFixed(2);
    let m = [25,50,75].map(x => `<i class="g" style="left:${x}%"></i>`).join('');
    for(const k of bands){
      const spans = state.log.filter(e => e.p===p && e.k===k && e.end && e.end > a && e.t < b).map(e => [e.t, e.end]);
      const live = state[p][k] && state[p][k].start; if(live && live < b && now > a) spans.push([live, now]);
      for(const [x, y] of spans) m += `<i class="b ${k}" style="left:${pct(x)}%;width:${Math.max(.5, pct(y)-pct(x)).toFixed(2)}%" title="${SUM_LBL[k]} ${clock(x)}–${clock(y)}"></i>`;
    }
    state.log.forEach((e, i) => {
      if(e.p !== p || e.t < a || e.t >= b) return;
      if(e.k === 'food'){ if(meals) m += `<i class="f" style="left:${pct(e.t)}%" title="אוכל ${clock(e.t)}"></i>`; }
      else if(hasWhere(e.k) && (!F || F === e.k)){ const tip = `${ITEMS[e.k].log} ${clock(e.t)}${WHERE[e.w] ? ' · '+WHERE[e.w] : ' · לא סומן איפה'}`; m += `<button class="d ${e.k} ${whereCls(e.w)}" data-e="${i}" style="left:${pct(e.t)}%" title="${tip}" aria-label="${tip}"></button>`; }
    });
    rows.push(`<div class="tl-row"><span class="tl-d">${DOW[d.getDay()]} · <bdi dir="ltr">${ddmm(a)}</bdi></span><div class="tl-t" dir="ltr">${m}</div></div>`);
  });
  if(!rows.length) return '';
  const axis = `<div class="tl-row"><span></span><div class="tl-x" dir="ltr">${[0,6,12,18,24].map(hh => `<span style="left:${hh/24*100}%">${pad(hh)}:00</span>`).join('')}</div></div>`;
  const legend = `<div class="lg">${['pee','poop'].filter(k => !F || F === k).map(k => `<span><i class="k ${k} unk"></i>${SUM_LBL[k]}</span>`).join('')}${meals ? `<span><i class="k f"></i>אוכל</span>` : ''}${bands.map(k => `<span><i class="k b ${k}"></i>${SUM_LBL[k]}</span>`).join('')}</div>` +
    (dots ? `<div class="lg">${WHERE_LEGEND.map(([c,l]) => `<span><i class="k ${F === 'poop' ? 'poop' : 'pee'} ${c}"></i>${l}</span>`).join('')}</div>` : '');
  return `<h2>ציר זמן<small>לחיצה על נקודה לתיקון</small></h2><div class="card tl">${axis}${rows.join('')}${legend}</div>`;
}
// One stacked column per day: how many pees + poops were outside, on the pad, or accidents.
// Accidents sit on the baseline so their trend is the easiest thing to read. Tapping a day opens it.
function whereBarsHTML(p, from, to, F){
  if(F && !hasWhere(F)) return '';
  const days = []; let max = 0, any = 0;
  eachDay(from, to, (d, a, b) => {
    const c = {out:0, pad:0, acc:0, unk:0};
    for(const e of state.log) if(e.p===p && hasWhere(e.k) && (!F || e.k===F) && e.t >= a && e.t < b) c[whereCls(e.w)]++;
    const n = c.out + c.pad + c.acc + c.unk; max = Math.max(max, n); any += n;
    days.push({d:new Date(d), a, c, n});
  });

    const lbl = few ? DOW[x.d.getDay()] : (x.d.getDate() === 1 || x.d.getDate() % 5 === 0 ? x.d.getDate() : '');
    return `<button class="wb-c" data-day="${x.a}" title="${tip}" aria-label="${tip}">${few && x.n ? `<span class="n">${x.n}</span>` : ''}
      ${['unk','out','pad','acc'].filter(c => x.c[c]).map(c => `<i class="${c}" style="height:${Math.max(3, x.c[c]*unit - 2).toFixed(1)}px"></i>`).join('')}<em>${lbl}</em></button>`;
  }).join('');
  return `<h2>${F ? SUM_LBL[F] : 'פיפי וקקי'} — איפה<small>לחיצה על יום לפירוט</small></h2><div class="card wbc"><div class="wb ${few?'few':''}" dir="ltr">${cols}</div>
    <div class="lg">${WHERE_LEGEND.map(([c,l]) => `<span><i class="k sq ${c}"></i>${l}</span>`).join('')}</div></div>`;
}
function renderSummary(){
  const P = PETS[pet], now = Date.now(), [from, to] = sumRange(sumMode, sumAnchor);
  const st = stats(pet, from, to), multi = sumMode !== 'day';
  const days = Math.max(0, Math.round((Math.min(to, sod(now).getTime()+DAY) - from) / DAY));
  const d0 = new Date(from);
  let title, small;
  if(sumMode==='day'){
    const dl = dayLabel(from);
    title = (dl==='היום' || dl==='אתמול') ? dl : `יום ${DOW[d0.getDay()]}`;
    small = `${d0.getDate()} ב${MONTHS[d0.getMonth()]} ${d0.getFullYear()}`;
  } else if(sumMode==='week'){
    title = `<bdi dir="ltr">${ddmm(from)}–${ddmm(to-1)}</bdi>`;

  } else {

    <div class="nav">

      : [['am','בוקר'],['pm','ערב']].map(([s,l]) =>
        `<div class="tile"><div class="ic">${ico('pill')}</div><b class="t">${m[s] ? 'ניתנה ב־'+clock(m[s]) : 'לא ניתנה'}</b><span>תרופת ${l}${m[s] ? byOf(pet,'med_'+s,m[s]) : ''}</span></div>`).join('')) + `</div>`;

    }
  } else {
    const ev = evAll;
    for(const k of durs.filter(k => !F || k===F)){ const s = state[pet][k] && state[pet][k].start; if(s && s < to && now > from) ev.push({p:pet, k, t:s, live:true}); }
    ev.sort((x,y) => y.t - x.t);
    if(P.cycle && !F){

      if(rs.length) h += `<h2>סבבים<small>לחיצה על שלב לתיקון</small></h2><div class="card rounds">${roundsHTML(pet, rs)}</div>`;
    }
    h += `<h2>אירועי היום<small>לחיצה על רישום לתיקון או מחיקה</small></h2><div class="card log">` + (ev.length ? ev.map(logRow).join('') : `<div class="empty">אין רישומים ביום הזה</div>`) + `</div>`;
  }
  return h;
}
