<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>קוצ׳יק וקישמיש</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4f1; --card:#fff; --ink:#24201d; --muted:#8c847c; --faint:#b9b2aa; --line:#ece7e1;
    --kochik:#17181b; --kochik-soft:#eceef1;      /* Maltese: snow white with black nose and eyes */
    --kishmish:#a8672d; --kishmish-soft:#f6e6d2;  /* Yorkshire puppy: tan and chestnut brown, black only as ink */
    --seg:#ebe7e1; --btn:var(--acc);
    --ok:#2f8a66; --ok-soft:#e7f4ee; --alert:#c64d68; --alert-soft:#fbeaee; --warn:#c47a17; --warn-soft:#fdf0dc;
    --acc:var(--kishmish); --acc-soft:var(--kishmish-soft); --on-btn:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 96px)}
  /* Per-pet theme; the class is set on <html> and <body> by render(). */
  .p-kochik{--acc:var(--kochik);--acc-soft:var(--kochik-soft);
    --bg:#f7f8fa; --card:#fff; --ink:#131416; --muted:#80868e; --faint:#b6bcc3; --line:#e7e9ed; --seg:#e9ebef; --btn:#131416}
  .p-kishmish{--acc:var(--kishmish);--acc-soft:var(--kishmish-soft);
    --bg:#f5ede3; --card:#fffbf6; --ink:#1d1713; --muted:#8b7a69; --faint:#c2b3a2; --line:#eadecf; --seg:#eadfd1; --btn:#77471f}
  /* DARK (20:00 – sunrise): the same two dogs at night, every pair checked for contrast (WCAG: text 4.5:1 or more —
     most are 7+). Kishmish keeps her browns: cream ink on dark chestnut, and the filled buttons in her TAN with dark
     text (white on brown and on the green / pink buttons was hard to read). Kochik, the Maltese, inverts: snow-white
     buttons with black text on charcoal. Secondary buttons are raised (lighter than the card), never sunk.
     `--on-btn` is the text on any filled button; light mode keeps white. Must come after the per-pet themes. */
  .night{--bg:#15100c; --card:#211a14; --ink:#f5ece0; --muted:#c7b6a2; --faint:#8a7a66; --line:#3b3026; --seg:#30271f;
    --surf:#33291f; --sheet:#2a2119; --toast:#3a2f25;
    --ok:#72c9a2; --ok-soft:#17302a; --alert:#f2909f; --alert-soft:#3d1d25; --warn:#ecb867; --warn-soft:#3a2a14;
    --kishmish-soft:#3a2a1b; --kochik-soft:#2b2d32; --on-btn:#1c1209}
  .night.p-kishmish{--btn:#d49a5c; --acc:#e3ad72}
  .night.p-kochik{--bg:#111214; --card:#1c1d21; --ink:#f1f2f4; --muted:#b8bdc5; --faint:#7a8089; --line:#34363c; --seg:#2b2d32;
    --surf:#2e3036; --sheet:#25262b; --toast:#34363c; --ok-soft:#152c25; --alert-soft:#381c24; --warn-soft:#352814;
    --btn:#e4e6ea; --acc:#e4e6ea; --on-btn:#131416}
  .night .chips button,.night .btn{background:var(--surf);border-color:color-mix(in srgb,var(--faint) 45%,transparent)}
  .night .seg button.on,.night .card.live .ic,.night .card.alertc .ic{background:var(--surf);color:var(--ink);box-shadow:none}
  .night .card.live.cry .ic{color:var(--alert)} .night .card.alertc .ic{color:var(--alert)}
  .night .sheet{background:var(--sheet);color:var(--ink)}
  .night .field input{background:var(--bg);border-color:color-mix(in srgb,var(--faint) 60%,transparent);color:var(--ink)}
  .night .btn.danger{background:var(--surf);color:var(--alert)}
  .night .btn.primary,.night .mark,.night .chips button.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .night .toast{background:var(--toast);color:var(--ink)} .night .toast button{color:var(--ink)}
  .night .sub.hint{opacity:1}
  .night .bg{background:rgba(0,0,0,.55)}
  .card.item.warn{background:var(--warn-soft);border-color:var(--warn)} .card.item.warn .big,.card.item.warn .lbl{color:var(--warn)}
  .frm{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13.5px;font-weight:500}
  .lnk.fcq{display:inline-block;width:17px;height:17px;line-height:15px;text-align:center;border:1px solid var(--faint);border-radius:50%;font-size:11px;text-decoration:none;color:var(--muted);margin-inline-start:4px}
  .card.slim.gravel{flex-wrap:wrap;gap:8px 12px} .card.slim.gravel .rt-a{flex-wrap:wrap}
  .card.slim.gravel.on{border-color:var(--ok);background:var(--ok-soft)} .card.slim.gravel small b{font-weight:600;color:var(--ink)}
  .card.slim.sleepq{border-color:color-mix(in srgb,var(--btn) 45%,transparent);flex-wrap:wrap;gap:8px 12px}
  .card.slim.sleepq.wait{border-color:var(--line)} .card.slim.sleepq small b{font-weight:600;color:var(--ink)}
  .card.slim.cryrow.on{border-color:var(--alert);background:var(--alert-soft)}
  .wrap{max-width:520px;margin:0 auto}
  svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  svg.i.s{width:16px;height:16px}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:10px}
  .mark{width:36px;height:36px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center}
  .mark svg{width:20px;height:20px;fill:currentColor;stroke:none}
  h1{font-size:19px;margin:0;font-weight:600;letter-spacing:-.2px}
  .sync{display:flex;align-items:center;gap:6px;font:inherit;font-size:12px;color:var(--muted);border:0;background:none;padding:6px 0;cursor:pointer}
  .sync.login{background:var(--ink);color:#fff;border-radius:10px;padding:7px 13px;font-size:13px;font-weight:500}
  .sync.login i{display:none}
  .sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .sync.on i{background:var(--ok)} .sync.err i{background:var(--alert)}

  .seg{display:flex;background:var(--seg);border-radius:14px;padding:4px;margin-bottom:16px}
  .seg button small.age{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:1px;line-height:1.2}
  .seg button{flex:1;border:0;background:none;border-radius:11px;padding:10px;font:inherit;font-size:15.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(40,30,20,.1)}
  .seg button.on[data-pet=kochik]{color:var(--kochik)} .seg button.on[data-pet=kishmish]{color:var(--kishmish)}

  main{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(40,30,20,.03)}
  .item{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center}
  .ic{width:44px;height:44px;border-radius:13px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
  .lbl{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .big{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.3px;line-height:1.25;direction:ltr;text-align:right}
  .big.txt{direction:rtl;font-size:22px}
  .big.none{color:var(--faint)}
  .sub{font-size:12.5px;color:var(--muted)}
  .acts{display:flex;flex-direction:column;align-items:stretch;gap:4px}
  .go{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:500;font-size:14.5px;color:var(--on-btn);background:var(--btn);cursor:pointer;white-space:nowrap;min-width:108px}
  .go:active{transform:scale(.97)}
  .ghost{border:0;background:none;color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;padding:4px}
  .card.live{border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:linear-gradient(0deg,var(--ok-soft),var(--ok-soft))}
  .card.live .ic{background:#fff;color:var(--ok)} .card.live .go{background:var(--ok)}
  .card.live.cry{border-color:color-mix(in srgb,var(--alert) 40%,transparent);background:var(--alert-soft)}
  .card.live.cry .ic{color:var(--alert)} .card.live.cry .go{background:var(--alert)}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
  .card.live .lbl{color:var(--ok);font-weight:500} .card.live.cry .lbl{color:var(--alert)}
  @keyframes pulse{50%{opacity:.25}}

  .meds-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .meds-h .ic{width:36px;height:36px;border-radius:11px}
  .meds-h b{font-weight:600;font-size:15px}
  .card.item .incr{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:10px;margin-top:2px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  .card.item .incr .btn{padding:8px 12px;font-size:13.5px}
  .card.cmp{padding:6px 16px} .cmp-r{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px} .cmp-r:last-child{border-bottom:0} .cmp-r span{color:var(--muted);font-size:13px}
  .lnk.medoff{display:block;margin-top:10px;font-size:12.5px;color:var(--muted)} .card.medc.off .sub{margin-bottom:10px;line-height:1.5}
  .meds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .med{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;font:inherit;text-align:right;cursor:pointer;display:flex;gap:10px;align-items:center;color:var(--ink)}
  .med .ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;color:#fff}
  .med .ck svg{width:14px;height:14px;stroke-width:2.4}
  .med b{display:block;font-weight:500;font-size:14.5px}
  .med small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
  .med.done{border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:var(--ok-soft)}
  .med.done .ck{background:var(--ok);border-color:var(--ok)}
  .med.done small{color:var(--ok)}
  .med.late{border-color:color-mix(in srgb,var(--alert) 45%,transparent);background:var(--alert-soft)}
  .med.late .ck{border-color:var(--alert)} .med.late small{color:var(--alert);font-weight:500}

  h2{font-size:13px;color:var(--muted);font-weight:500;margin:18px 4px 2px;letter-spacing:.2px}
  .log{padding:4px 16px}
  .log .r{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
  .log .r:last-child{border-bottom:0}
  .log .r span{flex:1}
  .log .r small.ctx{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .chips.names{margin:-6px 0 14px} .field input[type=text]{flex:1;min-width:0;width:100%}
  .log .r time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .log .r svg{color:var(--acc)}
  .log .r[data-e]{cursor:pointer}
  h2 small{font-weight:400;color:var(--faint);margin-inline-start:6px}
  .empty{color:var(--faint);font-size:14px;padding:14px 0;text-align:center}

  .toast{position:fixed;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;bottom:calc(env(safe-area-inset-bottom) + 20px);background:var(--ink);color:#fff;border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:all .2s;white-space:nowrap;padding-right:14px}
  .toast{flex-wrap:wrap;justify-content:space-between}
  .toast .tw{flex-basis:100%;display:flex;gap:6px;padding-bottom:2px}
  .toast .tw:empty{display:none}
  .toast .tw button{flex:1;padding-left:9px;padding-right:9px}
  .toast .tw button.sel{background:#fff;color:var(--ink)}
  .lnk{border:0;background:none;padding:0;font:inherit;color:var(--acc);text-decoration:underline;cursor:pointer}
  .sub.hint{margin-top:2px;opacity:.85}
  .sub.hint.rates{margin:-4px 6px 0}   /* gravel success by situation, under the gravel card */
  .sub.fc{margin-top:3px;color:var(--ink);font-weight:500}
  .sub.fc i{display:none;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:baseline}
  .sub.fc.now i{display:inline-block;background:#fab219} .sub.fc.late i{display:inline-block;background:#d03b3b}
  .sub .mealcrate{display:block;margin-top:3px;color:var(--ink);font-weight:500}   /* POTTY_CUE: gravel before the crate after a meal */
  .chips.when [data-m="0"]{flex-basis:100%;background:var(--btn);border-color:var(--btn);color:var(--on-btn);font-size:17px;font-weight:600;padding:15px}
  .chips.when button{flex:1 1 28%;padding:11px 8px}
  .chips.days{margin-bottom:10px} .chips.days button{flex:1}
  .chips.mini{margin:2px 0 10px;gap:6px} .chips.mini button{padding:6px 10px;font-size:13px}
  .chips.where button{flex:1 1 40%;padding:14px 10px;font-size:16px;font-weight:500}
  /* charts: status colours for "where" (validated for colour-blind separation), neutral bands */
  .out{--c:#0ca30c} .pad{--c:#fab219} .acc{--c:#d03b3b} .unk{--c:#8a857d}
  .tl{padding:12px 14px}
  .tl-row{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:8px;padding:3px 0}
  .tl-d{font-size:12px;color:var(--muted);white-space:nowrap}
  .tl-t{position:relative;height:30px;background:var(--bg);border-radius:6px}
  .tl-t .g{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
  .tl-t .b{position:absolute;border-radius:4px}
  .b.crate{top:5px;bottom:5px;background:#dcc9b2}
  .b.sleep{top:11px;bottom:11px;background:#8f8aa6}
  .tl-t .f{position:absolute;top:4px;bottom:4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ink);opacity:.5}
  .tl-t .d{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;padding:0;border:2px solid var(--card);border-radius:50%;background:var(--c);cursor:pointer}
  .tl-t .d.poop{border-radius:3px}
  .tl-t .d::after{content:"";position:absolute;inset:-9px -5px}
  .tl-x{position:relative;height:14px;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  .tl-x span{position:absolute;transform:translateX(-50%)} .tl-x span:first-child{transform:none} .tl-x span:last-child{transform:translateX(-100%)}
  .lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
  .lg span{display:inline-flex;align-items:center;gap:5px}
  .lg .k{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c)}
  .lg .k.poop,.lg .k.sq{border-radius:2px}
  .lg .k.f{width:2px;height:11px;border-radius:1px;background:var(--ink);opacity:.5}
  .lg .k.b{width:16px;height:8px;border-radius:3px} .lg .k.b.crate{background:#dcc9b2} .lg .k.b.sleep{background:#8f8aa6}
  .wbc{padding:14px}
  .wb{display:flex;align-items:stretch;gap:2px;height:150px}
  .wb.few{gap:10px}
  .wb-c{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;border:0;background:none;padding:0;font:inherit;cursor:pointer}
  .wb-c i{width:100%;max-width:30px;border-radius:3px;background:var(--c)}
  .wb-c .n{font-size:11.5px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;margin-bottom:1px}
  .wb-c em{width:100%;height:20px;padding-top:4px;border-top:1px solid var(--faint);font-style:normal;font-size:11px;color:var(--muted);text-align:center;white-space:nowrap}
  .wh{font-style:normal}
  .wh.no{color:var(--muted)}
  .wh.floor,.wh.crate,.wh.home{color:var(--alert);font-weight:500}
  .rd{padding:12px 0;border-bottom:1px solid var(--line)} .rd:last-child{border-bottom:0}
  .rd-h{font-size:12.5px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
  .rd-h b{font-size:14px;font-weight:600;color:var(--ink)}
  .uni{padding:2px 16px}
  .uni .rd{padding:12px 0 2px}
  .uni .rd-h{margin-bottom:2px}
  .uni .r:last-child{border-bottom:0}
  .uni .r[data-live]{cursor:pointer;color:var(--ok);font-weight:500}
  h2 .lnk{font-size:inherit}
  .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:9px;padding:7px 12px;font:inherit;font-weight:500;cursor:pointer}

  .bg{position:fixed;inset:0;background:rgba(30,25,20,.3);display:none;align-items:flex-end;justify-content:center;z-index:5}
  .bg.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 20px)}
  .sheet h3{margin:0 0 16px;font-size:17px;font-weight:600}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chips button,.btn{border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:9px 13px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
  .field{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin-bottom:8px}
  .field input{font:inherit;font-size:17px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;color:var(--ink);background:#fff}
  .field input.kb{width:5.5em;text-align:center;font-variant-numeric:tabular-nums}
  .field input.bad{border-color:var(--alert);background:var(--alert-soft)}
  .foot{display:flex;gap:8px;margin-top:18px;justify-content:space-between}
  .sc{margin-top:10px;padding:10px 12px 12px;border:1px dashed var(--faint);border-radius:14px}
  .sc-h{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.35}
  .sc-b{display:flex;flex-wrap:wrap;gap:8px}
  .sc .btn.sel{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
  .cyc-a .btn.sel{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);padding:10px 22px}
  .btn.danger{color:var(--alert);background:#fff}

  .gate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
  .gate[hidden]{display:none}
  .gate .box{max-width:340px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
  .gate .mark{width:56px;height:56px;border-radius:17px} .gate .mark svg{width:30px;height:30px}
  .gate h2{margin:6px 0 0;font-size:20px;font-weight:600;color:var(--ink);letter-spacing:0}
  .gate p{margin:0;font-size:14.5px;line-height:1.55;color:var(--muted)}
  .gate .btn.primary{font-size:16px;padding:13px 26px;border-radius:14px;margin-top:8px}
  .gate .ghost{margin-top:2px;font-size:13.5px}
  .gate .gerr{color:var(--alert);background:var(--alert-soft);border-radius:12px;padding:10px 12px;font-size:13.5px;text-align:right}
  .gate .gerr[hidden]{display:none}
  .hr{display:flex;align-items:center;gap:10px}
  .guestf{display:flex;gap:8px;align-items:flex-end;margin:4px 0 12px} .guestf[hidden]{display:none} .guestf .field{flex:1;margin:0}
  .me{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:5px 10px;font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap}
  .by{font-style:normal;color:var(--muted);font-size:12px;margin-inline-start:6px}
  .chips button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chips.users button{flex:1;padding:14px 10px;font-size:16px;font-weight:500}
  .seg.sm{margin-top:-8px} .seg.sm button{padding:7px;font-size:14px}
  .card .seg{margin:0}
  .nav{display:flex;align-items:center;gap:8px;margin-top:12px}

  /* the routine as a ring: five segments clockwise from the top, the current one filled */
  .steps{position:relative;height:236px;max-width:340px;margin:2px auto 0}
  .ring{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;overflow:visible}
  .sg{color:var(--seg);fill:currentColor;stroke:currentColor;stroke-width:2.5;stroke-linejoin:round;transition:color .2s;cursor:pointer}
  .sg:hover{filter:brightness(.95)}
  .sg.nxt{stroke:var(--btn);stroke-width:2;stroke-dasharray:5 4;animation:nxt 2.4s ease-in-out infinite}
  @keyframes nxt{50%{stroke-opacity:.35}}
  .si.nxt{color:var(--btn)}
  .sg.done{color:color-mix(in srgb,var(--btn) 32%,var(--card))}
  .sg.cur{color:var(--btn)} .sg.cur.over{color:var(--alert)}
  .sg.lock{cursor:default;opacity:.55}
  .si{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;color:var(--muted);pointer-events:none}
  .si.done{color:var(--btn)} .si.cur{color:var(--on-btn)} .si.lock{opacity:.55}
  .rc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:114px;text-align:center;pointer-events:none;line-height:1.3}

  .steps .rl{border:0;background:none;font:inherit;cursor:pointer;position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:5px 4px;font:inherit;font-size:12.5px;color:var(--muted);white-space:nowrap;cursor:pointer}
  .steps .rl.r{transform:translate(0,-50%);text-align:left} .steps .rl.l{transform:translate(-100%,-50%);text-align:right}
  .steps .rl.r,.steps .rl.l{max-width:66px;white-space:normal;line-height:1.2}
  .steps .rl i{font-style:normal;opacity:.6;margin-inline-end:4px;font-variant-numeric:tabular-nums}
  .steps .rl:disabled{opacity:.45;cursor:default}
  .steps .rl.on{color:var(--ink);font-weight:600}
  .steps .rl.nxt{color:var(--btn);font-weight:500}

  .duemsg{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--alert-soft);color:var(--alert);font-size:13.5px;font-weight:500}
  .card.cyc.due{border-color:color-mix(in srgb,var(--alert) 40%,transparent)}

  .cyc-n .nx b{display:block;font-size:15px;font-weight:600;color:var(--ink)}
  .cyc-n .ghost{flex:none}
  .cyc-n .nx b{font-weight:600}
  .cyc-n .nx > b:first-child{margin-bottom:2px}
  .cyc-n .nx b:not(:first-child){display:inline;font-size:inherit;color:var(--ink)}
  .tagk{background:var(--btn);color:var(--on-btn);font-size:11px;font-weight:500;padding:2px 8px;border-radius:8px;white-space:nowrap}
  .card.nowt{position:relative;box-shadow:0 0 0 2px var(--btn)}
  #side{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
  #side:empty{display:none}
  /* sleep + crying: two compact tiles side by side under the wheel */

  .duo .card.item{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:14px}

  h2.sec .tagk{font-weight:500}
  .card.slim{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
  .card.slim b{display:block;font-size:14px;font-weight:500}
  .card.slim small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
  .card.slim .btn{flex:none;font-weight:500;padding:9px 16px}
 .card.alertc{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--alert-soft);border-color:var(--alert);box-shadow:0 0 0 2px var(--alert)}
  .card.alertc .ic{background:#fff;color:var(--alert);flex:none}

  .card.alertc .ghost{margin-top:8px}
  .card.alertc small{display:block;font-size:13px;color:var(--ink);margin-top:2px;line-height:1.4}
  .succ-h{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  .succ-h b{font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
  .succ-h span{font-size:13px;color:var(--muted)}

  .card.slim.retry > span:first-child{display:flex;flex-direction:column;gap:1px;flex:1 1 auto}
  .card.slim.retry small{font-size:12px;color:var(--muted)}

  .rt-a{display:flex;gap:8px;align-items:center}

  .rt-t{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
  .b.sleep.guess{opacity:.45}
  .log .r.guess{cursor:pointer;color:var(--muted)}
  .log .r.guess svg{opacity:.6}
  .zz small{font-weight:400;opacity:.85} .zz .lnk{flex:none;margin-inline-start:auto;color:inherit;font-weight:600;padding:6px 0 6px 2px}
  .card.locked{opacity:.55}
  .card.locked .btn:disabled{cursor:default}
  .card.slim.free.end,.card.slim.free.over{box-shadow:0 0 0 2px #fab219}

  .cyc-h .lnk{font-size:inherit}
  .playc .meds-h small{margin-inline-start:auto;font-size:12.5px;color:var(--muted)}
  .cyc-a{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
  .cyc-a .mainact{margin-inline-start:auto;display:flex;flex-direction:column;align-items:stretch;gap:4px}
  .cyc-a .sub{flex:1;min-width:0}
  .cyc-a .go.wait{background:none;color:var(--btn);box-shadow:inset 0 0 0 1.5px var(--btn)}
  .zz{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-size:13.5px;font-weight:500}

  /* ---------- desktop: square tiles in a grid (phones keep the single-column list above) ---------- */
  @media (min-width:760px){
    body{padding-top:36px}
    .wrap{max-width:1248px}
    header{margin-bottom:22px}
    .seg{max-width:420px}
    main{display:grid;grid-template-columns:repeat(auto-fill,240px);gap:12px;align-items:start}
    main > *{grid-column:1/-1}
    main > .card.item, main > .card.medc{grid-column:auto;width:240px;height:240px;min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:18px}
    .card.item > div:nth-child(2){flex:1}
    .card.item .big{font-size:29px}
    .card.item .big.txt{font-size:23px}
    .card.item .acts{gap:4px}
    
    .card.medc .meds-h{margin-bottom:6px}
    .card.medc .meds{grid-template-columns:1fr;flex:1;align-content:end}
    main > h2{margin-top:14px}
    main > .card.log, main > .card.tblc{max-width:720px}
    main > .card.sumnav{max-width:440px}
    /* routine card: the ring on one side, status and actions beside it */
    #side > .card.cyc{display:grid;grid-template-columns:300px 1fr;column-gap:28px;align-content:center;padding:20px 24px}
    .card.cyc > *{grid-column:2}
    .card.cyc > .steps{grid-column:1;grid-row:1 / span 8;margin:0;align-self:center;width:300px}
    .card.cyc > .cyc-h{align-self:end;margin-bottom:6px}
    .card.cyc > .cyc-h b{font-size:17px}
    .card.cyc > .cyc-n{align-self:start}
    main > .card.playc, main > .card.slim{max-width:744px}
    /* Kochik's "she drank" row is one cell of the card grid, like its neighbours */
    main:not(.grps) > .card.slim.water:not(.nightw){grid-column:auto;width:240px;height:240px;min-width:0;flex-direction:column;align-items:stretch;justify-content:space-between;padding:18px}
    main:not(.grps) > .card.slim.water:not(.nightw) b{display:block;font-size:15px;margin-bottom:4px}
    main:not(.grps) > .card.slim.water:not(.nightw) .btn{padding:12px;font-weight:500}
    .card.medc .lnk.medoff{margin-top:4px;font-size:11.5px}
    #side > .card{max-width:744px}
    .tiles, .tiles.two{grid-template-columns:repeat(auto-fill,minmax(170px,190px));gap:14px}
    .tiles .tile{grid-column:auto !important;aspect-ratio:1/1;padding:18px;justify-content:flex-end}
    .tiles .tile .ic{margin-bottom:auto}
    .tbl tr[data-day]:hover td{background:var(--bg)}
    .log .r[data-e]:hover{background:var(--bg);margin:0 -16px;padding-left:16px;padding-right:16px}
    .bg{align-items:center}
    .sheet{max-width:440px;border-radius:22px;padding-bottom:22px}
  }
  /* ---------- tablets and up: each step's tiles in its own panel, panels side by side ---------- */
  @media (min-width:760px){
    main.grps{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;grid-template-areas:"crate potty" "food potty" "play play" "bath bath"}
    main.grps > .grp{grid-column:auto;background:color-mix(in srgb,var(--card) 62%,transparent);border:1px solid var(--line);border-radius:26px;padding:16px 16px 18px}
    main.grps > .grp.now{border-color:color-mix(in srgb,var(--btn) 60%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--btn) 60%,transparent), 0 10px 30px -18px color-mix(in srgb,var(--btn) 70%,transparent)}
    main.grps > .grp > h2.sec{margin:0 2px 4px;font-size:15.5px}
    main.grps > .grp .card{box-shadow:none}
    main.grps > .grp .card.nowt{box-shadow:0 0 0 2px var(--btn)}
    #sec-crate{grid-area:crate} #sec-potty{grid-area:potty} #sec-play{grid-area:play} #sec-food{grid-area:food} #sec-meds{grid-area:meds} #sec-vomit{grid-area:vomit} #sec-bath{grid-area:bath}
    main.grps.solo{grid-template-areas:"food potty" "vomit meds" "bath bath"}
    main.grps > .card.log{max-width:none}
    main.grps > h2{margin-top:6px}
    .grp.flash{animation:flash 1.4s ease-out}
  }
  /* ---------- wide screens: one top bar, the wheel column at the side staying in view, content filling the rest ---------- */
  @media (min-width:1000px){
    body{padding:28px 32px 96px}
    .wrap{max-width:1480px;display:grid;grid-template-columns:auto minmax(260px,340px) minmax(200px,260px) 1fr auto;align-items:center;column-gap:18px;row-gap:22px}

    .hr{grid-column:5;grid-row:1;justify-self:end}
    .shell{grid-column:1/-1;display:flex;align-items:flex-start;gap:28px}
    #side{flex:none;width:384px;margin:0;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto;padding:3px;scrollbar-width:thin}
    #side > .card{max-width:none}

    #side > .card.cyc > .steps{width:auto;margin:6px auto 2px;transform:scale(1.08);transform-origin:center}
    #side > .card.cyc > *{grid-column:auto}
    main{flex:1;min-width:0}
    main.grps{gap:18px}
    .grp{scroll-margin-top:20px}
  }
  @media (min-width:1860px){
    .wrap{max-width:1760px}
    main.grps{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"crate potty food" "play potty food" "bath bath bath"}

  .pl-lg .lv-uns{background:var(--pl-home);opacity:.45}
  .pl-badge.short{background:var(--pl-off);color:var(--ink)}
  .pl-away{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;padding:10px 14px} .pl-away.on{flex-direction:row;align-items:center;justify-content:space-between}
  .pl-awt{font-size:13.5px;font-variant-numeric:tabular-nums} .pl-awq{display:flex;flex-direction:column;gap:4px} .pl-awq small{color:var(--muted);font-size:12px}
  .v2 .pl-away{border-radius:16px}
  /* ================= end of PLANNING ================= */
  /* v3 UI (agent E): the crate card's secondary actions (carrier, pen, crate setup), the advice line, the night drink row */
  .cx{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}

  .cx .lnk svg{width:15px;height:15px}
  .cx .cx-set{margin-inline-start:auto}
  .cx .cx-set small{font-size:12px;color:var(--muted);margin-inline-start:4px}
  .cx .cx-set small::before{content:'· '}
  .cx-on{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--ink)}
  .cx-on > span{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .cx-on b{font-weight:600;font-variant-numeric:tabular-nums} .cx-on small{font-size:12px;color:var(--muted)}
  .cx-on .dot{color:var(--acc)} .cx-on .btn{flex:none;padding:7px 12px;font-size:13px}
  .card.slim.advice{background:none;border:0;box-shadow:none;padding:4px 4px 10px;display:block}

  .card.slim.xsum svg{color:var(--acc)}
  .cset-door,.cset-cover{margin-bottom:12px}
</style>

<script>
// ---------- icons ----------
const ICONS = {
  food:'<path d="M3.5 11h17c0 4.4-3.8 8-8.5 8s-8.5-3.6-8.5-8Z"/><circle cx="8.5" cy="7.2" r="1.2"/><circle cx="12.2" cy="5.4" r="1.2"/><circle cx="15.5" cy="7.6" r="1.2"/>',

  poop:'<path d="M6.8 19.5h10.4a2.6 2.6 0 0 0 .5-5.15A2.4 2.4 0 0 0 15.4 10h-.2a2.8 2.8 0 0 0-2.6-4.9c-.1 1.2-.9 2.1-2 2.5A2.4 2.4 0 0 0 8.6 10h-.1a2.4 2.4 0 0 0-2.2 4.35A2.6 2.6 0 0 0 6.8 19.5Z"/><path d="M8.6 14.4h6.8M10 10h4"/>',
  sleep:'<path d="M19.5 14.3A7.6 7.6 0 0 1 9.7 4.5a7.6 7.6 0 1 0 9.8 9.8Z"/><path d="M16.5 3.5v3M15 5h3"/>',
  cry:'<circle cx="12" cy="12" r="8.5"/><path d="M8.4 10.4q1-.9 2 0M13.6 10.4q1-.9 2 0M9.6 16.2q2.4-1.6 4.8 0"/><path d="M8.2 12.6c.5.8.9 1.4.9 1.9a.9.9 0 0 1-1.8 0c0-.5.4-1.1.9-1.9Z" fill="currentColor" stroke="none"/>',
  flea:'<path d="M12 3.5c2.8 3.6 6 7.2 6 10.5a6 6 0 0 1-12 0c0-3.3 3.2-6.9 6-10.5Z"/><path d="M12 10.5v6M9 13.5h6"/>',
  brush:'<path d="M5 19.5 15.5 9"/><rect x="13.2" y="3.6" width="7" height="5.2" rx="1.2" transform="rotate(45 16.7 6.2)"/><path d="M14.6 4.2l-1.2-1.2M17.8 7.4l1.2 1.2"/>',
  teeth:'<path d="M8 4c-2.5 0-4 1.8-4 4.3 0 3.2 1.5 4.6 2 7.7.4 2.4.9 4.5 2.2 4.5 1.6 0 1.4-4.8 3.8-4.8s2.2 4.8 3.8 4.8c1.3 0 1.8-2.1 2.2-4.5.5-3.1 2-4.5 2-7.7C20 5.8 18.5 4 16 4c-1.6 0-2.6.8-4 .8S9.6 4 8 4Z"/>',
  weight:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8.5 10a3.5 3.5 0 0 1 7 0"/><path d="M12 10l1.6-1.8"/>',
  note:'<path d="M6 3.5h9l3 3v14H6Z"/><path d="M9 10h6M9 13.5h6M9 17h4"/>',
  bath:'<path d="M3.5 12h17v1.5a5.5 5.5 0 0 1-5.5 5.5H9a5.5 5.5 0 0 1-5.5-5.5Z"/><path d="M6.5 12V6a2.2 2.2 0 0 1 4.2-.9"/><path d="M7.5 19l-1 1.5M16.5 19l1 1.5"/>',
  crate:'<rect x="3.5" y="6.5" width="17" height="12.5" rx="2.2"/><path d="M8 6.5V19M12 6.5V19M16 6.5V19M9.5 6.5V5a2.5 2.5 0 0 1 5 0v1.5"/>',
  water:'<path d="M6.6 5h10.8l-1.3 13.1a1.6 1.6 0 0 1-1.6 1.4H9.5a1.6 1.6 0 0 1-1.6-1.4L6.6 5Z"/><path d="M7.3 10.6c1.6-1 3.1 1 4.7 0s3.1-1 4.7 0"/>',
  none:'<circle cx="12" cy="12" r="8.5"/><path d="M6.2 17.8 17.8 6.2"/>',
  treat:'<path d="M8.2 9.3a2.4 2.4 0 1 0-3.3 3.3L11.4 19a2.4 2.4 0 1 0 3.3-3.3l.8-.8a2.4 2.4 0 1 0 3.3-3.3L12.4 5.2A2.4 2.4 0 1 0 9 8.5Z"/>',
  vomit:'<path d="M6.5 4.5h11l-1.3 7.2a4.3 4.3 0 0 1-8.4 0Z"/><path d="M9 17.2v2.3M12 16.4v3.6M15 17.2v2.3"/>',
  ball:'<circle cx="12" cy="12" r="8.3"/><path d="M5 8.3c3.7 1 6.2 4.2 6 11.8M19 8.3c-3.7 1-6.2 4.2-6 11.8"/>',
  gel:'<path d="M7 9.5a5 5 0 0 1 10 0c0 3.1-2.6 3.7-2.6 6.3a2.9 2.9 0 0 1-5.6 1.1"/><path d="M9.6 9.6a2.4 2.4 0 0 1 4.8 0c0 1.2-1.4 1.6-1.5 3"/>',
  pill:'<rect x="2.8" y="8.6" width="18.4" height="6.8" rx="3.4" transform="rotate(-45 12 12)"/><path d="M9.6 9.6l4.8 4.8"/>',
  check:'<path d="M5 12.5l4.2 4.2L19 7"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  plus:'<path d="M12 6v12M6 12h12"/>',
  chevR:'<path d="M9 6l6 6-6 6"/>',
  chevL:'<path d="M15 6l-6 6 6 6"/>',
  paw:'<path d="M12 12.3c-2.6 0-5.1 2.7-5.1 4.9 0 1.6 1.3 2.3 2.6 2.3 1 0 1.6-.5 2.5-.5s1.5.5 2.5.5c1.3 0 2.6-.7 2.6-2.3 0-2.2-2.5-4.9-5.1-4.9Z"/><ellipse cx="5.9" cy="10.2" rx="1.75" ry="2.15"/><ellipse cx="9.4" cy="6.2" rx="1.75" ry="2.25"/><ellipse cx="14.6" cy="6.2" rx="1.75" ry="2.25"/><ellipse cx="18.1" cy="10.2" rx="1.75" ry="2.15"/>'
};
const ico = (n, cls='') => `<svg class="i ${cls}" viewBox="0 0 24 24">${ICONS[n]}</svg>`;
document.getElementById('mark').innerHTML = `<svg viewBox="0 0 24 24">${ICONS.paw}</svg>`;

// ---------- model ----------
const PETS = {
  kochik:   {name:'קוצ׳יק', born:'2010-03-20', treats:true, bath:true, items:['food','pee','poop','vomit','gel'], meds:true, poopType:true, where:['out','gravel','balcony','home','pad']},   // Kochik is an adult: outside is the norm; on the balcony she goes on the gravel or just on its floor
  kishmish: {name:'קישמיש', born:'2026-09-20', poopType:true, bath:true, items:['crate','pee','poop','food','sleep','cry'], cycle:true, where:['gravel','pad','floor','crate','out']}   // "in the crate" since 25.11: she pooped there once (`pottyInCrate`)
};
const ITEMS = {
  food:{lbl:'מאז האוכל האחרון',btn:'אכלה',log:'אכלה'},
  pee:{lbl:'מאז הפיפי האחרון',btn:'פיפי',log:'פיפי'},
  poop:{lbl:'מאז הקקי האחרון',btn:'קקי',log:'קקי'},
  // Ear gel for Kochik: given as needed (when she is not eating), roughly once in three days — so the
  // tile counts in days and hours instead of a running clock (`slow`), with a note of the usual rhythm.
  // Vomiting (Kochik): rare, so counted in days and hours; what came up is asked right after (`q`: bile / food).
  vomit:{lbl:'מאז ההקאה האחרונה',btn:'הקיאה',log:'הקיאה',slow:true},
  gel:{lbl:'מאז הג׳ל לאוזן האחרון',btn:'נתתי ג׳ל',log:'ג׳ל לאוזן',slow:true,note:'לפי הצורך · בערך פעם ב־3 ימים'},
  // Bath (both dogs, 25.11): the owner bathes them at least every BATH_DAYS days; the tile says by when the next one is due.
  bath:{lbl:'מאז המקלחת האחרונה',btn:'קילחתי',log:'מקלחת',slow:true},
  // GROOMING (25.11): Frontline Spray, brushing, teeth, weight — point kinds like the bath; a vet note is kept out of the lists.
  flea:{lbl:'ספריי פרונטליין',btn:'ריססתי',log:'ריסוס פרונטליין',slow:true},
  brush:{lbl:'סירוק אחרון',btn:'סירקתי',log:'סירוק',slow:true},
  teeth:{lbl:'צחצוח שיניים אחרון',btn:'צחצחתי',log:'צחצוח שיניים',slow:true},
  weight:{lbl:'משקל',btn:'שקלתי',log:'משקל',slow:true},
  note:{log:'הערה לווטרינר',hid:true},
  sleep:{dur:true,lbl:'שינה אחרונה',live:'ישנה',start:'נרדמה',stop:'התעוררה',log:'ישנה',startQ:'מתי נרדמה?'},
  cry:{dur:true,lbl:'בכי אחרון',live:'בוכה',start:'בוכה',stop:'נרגעה',log:'בכתה',startQ:'מתי התחילה לבכות?'},
  crate:{dur:true,lbl:'כלוב אחרון',live:'בכלוב',start:'נכנסה לכלוב',stop:'יצאה מהכלוב',log:'בכלוב',startQ:'מתי נכנסה לכלוב?'},
  none:{log:'יצאה ולא עשתה'},   // went out for potty and nothing happened; logged from the slim row under the poop tile
  water:{log:'שתתה'},   // she drank — so a missing pee can be read against whether she drank at all
  brk:{icon:'none',log:'הפסקה בשגרה'},
  nofood:{icon:'food',log:'לא אכלה'},   // offered food in the routine's food step and did not eat
  play:{icon:'ball',log:'משחק'},   // what kind of play it was (`y`), logged from the routine's play step   // taken out for potty, nothing happened (logged from the routine strip)
  // A break from the medicines (Kochik): when she is unwell the vet says to stop them for a few days. A running
  // timer like the crate — while it runs the checklist steps aside and nothing is marked late.
  medoff:{dur:true,icon:'pill',lbl:'הפסקת תרופות',live:'בהפסקת תרופות',start:'הפסקת תרופות',stop:'חזרה לתרופות',log:'הפסקת תרופות',startQ:'ממתי בלי תרופות?'},
  // The dog's date of birth (`d: 'YYYY-MM-DD'`), saved as an entry so it syncs, undoes and merges like everything
  // else; the latest one wins, and without any the default in PETS is used. Not an event: never listed (`hid`).
  // A treat (dogs with `treats:true` in PETS): `q` = regular / fatty, `n` = what it was (optional free text),
  // and — the point of it — `by`, who gave it. Its own kind, so it never resets the food clock.
  treat:{lbl:'חטיף אחרון',log:'חטיף'},
  // Moved from one crate to another without coming out (`c` = the crate she is in from then on). It sits inside
  // the running crate stay: the stay, its timer and the round go on.
  swap:{icon:'crate',log:'הועברה לכלוב אחר'},
  // On the gravel, waiting for her to go: an optional timer ("יצאנו לחצץ") that the next pee / poop / "לא עשתה"
  // ends, so each of them knows how long it took. Not listed as a row of its own (`nolist`).
  gravel:{dur:true,icon:'pee',lbl:'בחצץ',live:'בחצץ',start:'יצאנו לחצץ',stop:'סיום היציאה לחצץ',log:'בחצץ',startQ:'מתי יצאתם לחצץ?',nolist:true},
  born:{icon:'paw',log:'תאריך לידה',hid:true},
  // v3 KINDS (data layer; their buttons come later). All optional: a list without them reads exactly as before.
  //  cset    — the crate's setup changed: `door` 'open'|'closed', `cover` 'covered'|'uncovered' (each optional, each
  //            independent; `crateSetup`). A row in the list, no routine effect (`aux`).
  //  carrier — "טיול במנשא": ends a running crate stay at its start, NOT a sleep; not play / potty; no round, no retry.
  //  pen     — "בגדר": out of the closed crate (ends a running stay at its start); says neither awake nor asleep.
  //  away    — "לא בבית / לא בחדר": `ctx` 'room'|'home'|'other', and on its end `res` 'calm'|'some'|'much'|'unknown'
  //            (how she was meanwhile). Affects nothing in the routine; a row in the list.
  // While a carrier / pen interval runs, or the crate door is open, no sleep is estimated (`sleepSpans`).
  cset:{icon:'crate',log:'הגדרות כלוב',aux:true},
  carrier:{dur:true,icon:'paw',lbl:'טיול במנשא',live:'במנשא',start:'יצאנו עם המנשא',stop:'חזרנו מהמנשא',log:'טיול במנשא',startQ:'מתי יצאתם עם המנשא?'},
  pen:{dur:true,icon:'crate',lbl:'בגדר',live:'בגדר',start:'נכנסה לגדר',stop:'יצאה מהגדר',log:'בגדר',startQ:'מתי נכנסה לגדר?'},
  away:{dur:true,icon:'clock',lbl:'לא בבית',live:'לא בבית',start:'יצאתי',stop:'חזרתי',log:'לא בבית',startQ:'מתי יצאת?'},
  med_am:{icon:'pill',log:'תרופת בוקר'},
  med_pm:{icon:'pill',log:'תרופת ערב'}
};
// The trainer's potty-training routine for pets with `cycle:true`: crate → walk + potty → play → food → potty → crate.
// The app works out the current step from the log (see `routine()`); these are just the five names.
const CYCLE = [{n:'כלוב'}, {n:'טיול וצרכים'}, {n:'משחק'}, {n:'אוכל'}, {n:'צרכים'}];
// Where a pee / poop happened; stored as `w` on the log entry (optional).
const WHERE = {out:'בחוץ', gravel:'על החצץ במרפסת', balcony:'על הרצפה במרפסת', pad:'על הפד', home:'בבית', floor:'על הרצפה', crate:'בכלוב'};   // floor and crate are accidents (shown in red)
// The choices offered per pet, best place first. Kishmish is not vaccinated yet and does not go outside: her target is the gravel on the balcony.
const whereKeys = p => PETS[p].where || Object.keys(WHERE);
const WHERE_SHORT = {out:'בחוץ', gravel:'חצץ', balcony:'רצפת המרפסת', pad:'פד', home:'בית', floor:'רצפה', crate:'כלוב'};
const hasWhere = k => k==='pee' || k==='poop';
// Strictly inside a crate stay (a meal that ENDED a stay under the old rule sits on its edge and does not count).
const inCrate = e => PETS[e.p].cycle && state.log.some(s => s.p===e.p && s.k==='crate' && s.t < e.t && (s.end == null || s.end > e.t));
const lblOf = e => e.k === 'play' && inCrate(e) ? 'קיבלה בכלוב' : e.k === 'food' && inCrate(e) ? 'אכלה בכלוב' : e.k === 'weight' && typeof e.kg === 'number' ? `משקל ${e.kg.toFixed(1)} ק״ג` : e.k === 'cset' ? csetLbl(e) : e.k === 'away' ? awayLbl(e) : ITEMS[e.k].log;
// v3 kinds' labels: "הגדרות כלוב: דלת פתוחה · בלי כיסוי"; "לא בחדר · רגועה".
const CSET_DOOR = {open:'דלת פתוחה', closed:'דלת סגורה'}, CSET_COVER = {covered:'עם כיסוי', uncovered:'בלי כיסוי'};
const AWAY_CTX = {room:'לא בחדר', home:'לא בבית', other:'לא לידה'}, AWAY_RES = {calm:'רגועה', some:'קצת בכי', much:'הרבה בכי', unknown:'לא ידוע איך הייתה'};
const csetLbl = e => `${ITEMS.cset.log}: ${[CSET_DOOR[e.door], CSET_COVER[e.cover]].filter(Boolean).join(' · ') || 'ללא שינוי'}`;
const awayLbl = e => (AWAY_CTX[e.ctx] || ITEMS.away.log) + (AWAY_RES[e.res] ? ' · ' + AWAY_RES[e.res] : '');
// What a poop was like, stored as `q` on the entry — for Kochik, whose diarrhoea comes and goes.
const POOP = {ok:'רגיל', soft:'רך', hard:'קשה', dia:'שלשול'};
// What came up when she vomited, also stored as `q`: digestive fluids, or food.
const VOMIT = {bile:'נוזלי עיכול', food:'אוכל'};
const TREAT = {reg:'רגיל', fat:'שומני'};
const KIND_LBL = {...POOP, ...VOMIT, ...TREAT};
const kindsOf = (p, k) => k === 'poop' && PETS[p].poopType ? POOP : k === 'vomit' ? VOMIT : k === 'treat' ? TREAT : null;   // the choices for "what kind", if this entry has any
const KIND_Q = {poop:'איך היה הקקי?', vomit:'קיא של מה?', treat:'איזה חטיף?'};
// Anything a person typed (the name of a treat) is shown as text, never as HTML.
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const hasType = (p, k) => !!kindsOf(p, k);
const typeTag = (q, plain) => KIND_LBL[q] ? ` · <em class="wh ${plain ? 'no' : q === 'dia' ? 'floor' : q === 'soft' || q === 'hard' ? 'no' : ''}">${KIND_LBL[q]}</em>` : '';   // plain: information only, no warning colour (the puppy)
const CRATE_MAX = 2*3600000;   // a crate stay longer than this turns red (tile and strip)
// NIGHTS (v3): every night / day definition in the app, one row per PURPOSE. The values are the ones the app has
// always used — they differ on purpose, so read the row for your use, never another one's. Hours are local clock
// hours (22.5 = 22:30); a night runs from `from` on one evening to `to` the next morning.
//   screen   — the cut-down night screen and the silent food alert (`isNight`)
//   learn    — gaps / naps that touch it are left out of what the app learns (`touchesNight`, PEE_RHYTHM.night)
//   plan     — the planning tab plans nothing in it (`planNight`, PLAN.night)
//   score    — "last night" in the sleep score (`scores`)
//   crateDay — a DAY, not a night: the crate-too-long flag is shown only from..to (DAY_FROM / DAY_TO)
// Not in the table, deliberately: `isDark` (colours, 20:00 – sunrise from `sunrise()`), `MEAL_NIGHT` (a 5-hour gap
// between meals counts as a night) and `peeGaps` (gaps over 5 h dropped) — those are lengths or the light, not hours.
const NIGHTS = {
  screen:   {from:23,   to:6},
  learn:    {from:23,   to:5},
  plan:     {from:22.5, to:7},
  score:    {from:22,   to:6},
  crateDay: {from:7,    to:22},
};

// "wake her" comes only from need: WAKE.sleepNoPee (4 h) since the last pee, or ALERT.food (3.5 h, the same as the food
// banner) since the last meal — whichever is first. Past the age limit (`holdHours`) from the pee there is only a calm
// note (`sleepPeeNote`). Her usual long nap (`napMedian`, 75th percentile) is described, never used to wake her.
// None at night (a sleep touching 23:00–05:00).
const WAKE = {days:3, napQ:.75, minNap:15*60000, sleepNoPee:4*3600000, askAgain:20*60000};   // askAgain: "עדיין ישנה" hides the question this long
function napMedian(p){
  const now = Date.now(), from = now - WAKE.days*86400000;
  const n = V[p].spans.filter(x => x.end != null && x.end <= now && x.t >= from && x.end - x.t >= WAKE.minNap && !touchesNight(x.t, x.end)).map(x => x.end - x.t);
  return n.length >= 3 ? quantile(n.sort((x,y) => x-y), WAKE.napQ) : 0;   // descriptive only
}
function wakeBy(p){
  const S = V[p], st = S.sleep && S.sleep.start, now = Date.now();
  if(!PETS[p].cycle || !st || touchesNight(st, now)) return null;
  const c = [];
  if(S.pee) c.push([S.pee + WAKE.sleepNoPee, `${words(WAKE.sleepNoPee)} מהפיפי האחרון`]);
  if(S.food) c.push([S.food + ALERT.food, `${words(ALERT.food)} מהארוחה האחרונה`]);
  if(!c.length) return null;
  c.sort((x, y) => x[0] - y[0]);
  return {t: c[0][0], why: c[0][1], past: now >= c[0][0]};
}
// "היא עדיין ישנה?" (owner, 25.11; v3 timing; owner 26.11: fewer prompts). A predicted waking alone never asks. It asks
// AT MOST ONCE PER SLEEP EPISODE (`stillDone`, this phone, nothing saved), by day only (not touching NIGHTS.learn or
// NIGHTS.plan), before wake-by (past it "כדאי להעיר אותה" stays — unchanged), and only when BOTH:
//  (a) the sleep is past her likely wake — longer than STILL_ASK of her marked naps (`napSurv`), or with too few of
//      them the planning tab's nap (`kishStats(now).nap`, no time shown);
//  (b) something practical depends on it (`stillNeed`): wake-by within STILL_NEED.wakeBy, her pee window open
//      (`peeGapWin`), or a meal due within STILL_NEED.meal (`mealGap`).
// Otherwise the wheel's passive line says "ישנה … · כנראה תתעורר בין …" (`cycleHTML`) and nothing asks. Backtest on the
// frozen 23–25.11 list (always answering "עדיין ישנה"): 12 / 13 / 17 prompts a day before — `napSurv` falls under one
// half about 30 min into most naps (many of her marked sleeps are short) and the 20-minute snooze asked again.
const STILL_ASK = .5, STILL_NEED = {wakeBy: 30*60000, meal: 15*60000};
let stillUntil = 0, stillDone = new Set();
function stillNeed(p, now, wb){
  const S = V[p];
  if(wb && wb.t - now <= STILL_NEED.wakeBy) return 'wakeBy';
  const g = peeGapWin(p, now); if(g && g.from <= now) return 'pee';
  const mg = mealGap(p); if(mg && S.food && S.food + mg - now <= STILL_NEED.meal) return 'meal';
  return null;
}
function stillAsleep(p){
  const S = V[p], st = S.sleep && S.sleep.start, now = Date.now();
  if(!PETS[p].cycle || !st || touchesNight(st, now) || planNight(st, now) || stillUntil > now) return null;
  const wb = wakeBy(p); if(wb && wb.past) return null;
  const w = wakeExpect(p, now);
  if(stillDone.has(p + '|' + w.since)) return null;
  const learned = w.sleepOn && w.words !== 'unknown';
  if(learned ? !(w.likely && napSurv(p, now - w.since, now) < STILL_ASK) : now < st + kishStats(now).nap) return null;
  const why = stillNeed(p, now, wb); if(!why) return null;
  return learned ? {since: w.since, likely: w.likely, src: 'learned', why} : {since: w.since, src: 'rule', why};   // rule: no wake time (`wakeExpect` has none)
}
// "עדיין ישנה": this sleep is not asked about again (and the old 20-minute hold stays, for the tests and the eye).
function stillSnooze(p){ const a = stillAsleep(p); if(a) stillDone.add(p + '|' + a.since); stillUntil = Date.now() + WAKE.askAgain; }
function stillAsleepHTML(p){
  const a = stillAsleep(p); if(!a) return '';
  const when = a.src === 'learned' ? `לפי השינות שלה, ייתכן שהיא כבר מתעוררת (בערך <bdi dir="ltr">${clock(a.likely.from)}–${clock(a.likely.to)}</bdi>)` : `עוד אין מספיק נתונים להעריך מתי תתעורר`;
  const need = {wakeBy: 'מתקרבת שעת ההערה', pee: 'חלון הפיפי פתוח', meal: 'מתקרבת ארוחה'}[a.why];
  return `<div class="card slim sleepq still"><span><b>היא עדיין ישנה?</b><small>ישנה מ־<bdi dir="ltr">${clock(a.since)}</bdi> · ${when} · ${need}</small></span>
    <span class="rt-a"><button class="go" data-act="wokeup">התעוררה</button><button class="btn" data-act="stillasleep">עדיין ישנה</button></span></div>`;
}
function sleepPeeNote(p){   // asleep by day, past the age limit from the pee but not yet WAKE.sleepNoPee: information only
  const S = V[p], h = holdHours(p) * 3600000, now = Date.now();
  if(!S.sleep || !S.sleep.start || !S.pee || !h || touchesNight(S.sleep.start, now)) return '';
  const d = now - S.pee; return d >= h && d < WAKE.sleepNoPee ? `עברו ${words(d)} מהפיפי (לפי הגיל: עד כ־${words(h)}) · לא חייבים להעיר` : '';
}
function alerts(p){
  if(!PETS[p].cycle) return [];
  const S = V[p], now = Date.now(), out = [], awake = !S.sleep.start && !S.crate.start;
  const ago = ms => ms < 24*3600000 ? words(ms) : wordsLong(ms);
  const asleep = !!(S.sleep && S.sleep.start), wb = asleep && wakeBy(p), hush = asleep && !(wb && wb.past);   // asleep: "let her sleep" wins until wake-by
  if(S.food && now - S.food >= ALERT.food && !isNight() && !hush){   // by day only: at night she sleeps and nobody should be told to feed her
    // She cannot be made to eat. Once the owner says she offered and it was refused, the warning steps back
    // for a while (ALERT.again) instead of repeating an instruction that was already followed.
    const no = state.log.filter(e => e.p===p && e.k==='nofood' && e.t > S.food && e.t <= now).reduce((m, e) => Math.max(m, e.t), 0);
    const since = `${ago(now - S.food)} מאז האוכל האחרון`, watch = 'אם היא חלשה מאוד, רועדת או לא יציבה — להתקשר לווטרינר.';
    if(no && now - no < ALERT.again) out.push({k:'food', calm:true, text:`הצעת לה אוכל ב־${clock(no)} והיא לא רצתה`, hint:`זה קורה. לנסות שוב בעוד כחצי שעה · ${since}. ${watch}`});
    else if(no) out.push({k:'food', offer:true, text:`עברו ${since}`, hint:`ניסית ב־${clock(no)} והיא לא רצתה — שווה להציע שוב. ${watch}`});
    else out.push({k:'food', offer:true, text:`עברו ${since}`, hint:'הגיע הזמן להציע לה אוכל.'});
  }
  if(S.pee && awake && now - S.pee >= ALERT.pee) out.push({k:'pee', text:`${ago(now - S.pee)} בלי פיפי`, hint:'לשקול להתקשר לווטרינר.'});
  if(S.poop && now - S.poop >= ALERT.poop) out.push({k:'poop', text:`${ago(now - S.poop)} בלי קקי`, hint:'לשקול להתקשר לווטרינר.'});
  return out;
}
function alertsHTML(p){
  return alerts(p).map(a => `<div class="card alertc${a.calm ? ' calm' : ''}"><div class="ic">${ico(a.k)}</div><span><b>${a.text}</b><small>${a.hint}</small>${a.offer ? `<button class="ghost" data-act="nofood">${ico('none','s')}הצעתי, לא אכלה</button>` : ''}</span></div>`).join('');
}

// ---------- "when?" ----------
// Every logging button first asks when it happened: "עכשיו" (one big button), a few "X minutes ago"
// buttons, any number of minutes, or a clock time. The owner is with the puppy when things happen and
// often cannot tap at that very minute. `go(ts)` gets a time, or nothing for "now".
let ASK_WHEN = true;
function askWhen(title, go, extra){   // `extra`: something to ask in the same sheet, above the times (a treat's name)
  if(!ASK_WHEN){ go(); return; }
  sheet(title, (extra || '') + chips([0,5,10,15,20,30,60,120,180]).replace('class="chips"', 'class="chips when"') + `<div class="sub" style="margin:4px 0 8px">או ביום ובשעה:</div>${dayPick()}<label class="field">בשעה ${timeField("tIn", nowStr())}</label>`,
    cancelBtn, () => { const v = timeVal('tIn'); if(!v) return; close(); const ts = timeToTs(v); go(Date.now() - ts < 60000 ? undefined : ts); },
    ts => go(Date.now() - ts < 1000 ? undefined : ts));
}
function endDurAt(p, k, ts){   // "woke up / came out 10 minutes ago"
  const t = Math.min(ts, Date.now());
  const sl = V[p].sleep;
  commit(`${PETS[p].name} · ${ITEMS[k].stop}`, () => {
    if(k === 'sleep' && sl.assumed) state.log.push({p, k, t: sl.start, end: Math.max(t, sl.start + 1), a: 1});
    else if(k === 'crate') leaveCrate(p, t); else stopDur(p, k, t);
  });
}

// ---------- no accidental doubles ----------
// Tapping the same button twice within two minutes asks first. (On 23.11 the same entries were logged
// twice at 15:54 and at 16:00.) Entries given an explicit time ("שעה אחרת") are not checked.
let DUP_MS = 2*60000;
function recentDouble(p, same){ const now = Date.now(); return state.log.filter(e => e.p===p && same(e) && Math.abs(now - e.t) < DUP_MS).pop() || null; }
function askAgain(e, label, yes){
  sh.innerHTML = `<h3>כבר נרשם</h3><div class="sub" style="font-size:14.5px;margin-bottom:18px">${label} כבר נרשם ב־<bdi dir="ltr">${clock(e.t)}</bdi>${byName(e.by) ? ' על ידי ' + byName(e.by) : ''}. לרשום שוב?</div>
    <div class="foot"><button class="btn" id="cancel">לא, זו טעות</button><button class="btn primary" id="ok">לרשום שוב</button></div>`;
  sh.querySelector('#cancel').onclick = close;
  sh.querySelector('#ok').onclick = () => { close(); yes(); };
  bg.classList.add('show');
}
// Contradicting entries (step 6): "אכלה" ↔ "לא אכלה", פיפי / קקי ↔ "לא עשתה", same dog, within DUP_MS of the time
// being logged (now, or the chosen past time) — usually the wrong button. Ask first; "no" logs nothing.
const CONTRA = {food:['nofood'], nofood:['food'], pee:['none'], poop:['none'], none:['pee','poop']};
let contraOk = false;   // set for one call when the owner confirmed
function contradiction(p, k, t){
  const o = CONTRA[k], at = t || Date.now();
  return o ? state.log.filter(e => e.p===p && o.includes(e.k) && Math.abs(at - e.t) < DUP_MS).pop() || null : null;
}
// true = it asked (the caller stops); `go` logs as usual after "yes".
function contraGuard(p, k, t, go){
  const e = !contraOk && contradiction(p, k, t); if(!e) return false;
  const ago = Math.round(Math.abs((t || Date.now()) - e.t) / 60000);
  const when = t ? `ב־<bdi dir="ltr">${clock(e.t)}</bdi>` : ago < 1 ? 'עכשיו' : ago === 1 ? 'לפני דקה' : `לפני ${ago} דקות`;
  sh.innerHTML = `<h3>רגע, זה סותר</h3><div class="sub" style="font-size:14.5px;margin-bottom:18px">נרשם ״${ITEMS[e.k].log}״ ${when}${byName(e.by) ? ' על ידי ' + byName(e.by) : ''}. לרשום ״${ITEMS[k].log}״ בכל זאת?</div>
    <div class="foot"><button class="btn" id="cancel">לא, זו טעות</button><button class="btn primary" id="ok">לרשום בכל זאת</button></div>`;
  sh.querySelector('#cancel').onclick = close;
  sh.querySelector('#ok').onclick = () => { close(); contraOk = true; try { go(); } finally { contraOk = false; } };
  bg.classList.add('show');
  return true;
}

// ---------- "ניסיון חוזר" (retry) ----------
// The trainer's rule: when she is taken out and does nothing ("לא עשתה"), she goes back into the crate for
// about 10 minutes and is taken to the gravel again — as many times as it takes. Until she pees there is no
// play and no free time; food stays available (a one-kilo Yorkie must not skip meals).
// Like everything else this is worked out from the list, nothing is stored on the side:
//   - retry mode is on when the latest of {pee, "nothing"} is a "nothing" (not dismissed: `x`), no ordinary
//     crate stay began after it, and it is recent or its retry crate stay is still open;
//   - a retry crate stay is a crate entry with `r` = the countdown in minutes (it starts a round like any other
//     crate entry — the owner expects every entry into the crate to begin a new cycle);
//   - a pee ends the mode. On the gravel (or outside) it starts free time; on the pad it counts as a miss.
// A retry stay is a short wait after a "לא עשתה". One that ran long (she fell asleep in there, say) is just a
// crate stay. Old data may carry `r` (a countdown, from when the card had one) — it is ignored.
const isRetryStay = e => e.k === 'crate' && !!V && V[e.p].retryStays.has(e.id) && ((e.end == null ? Date.now() : e.end) - e.t) <= RETRY.max;
const FREE = {min:15, max:20};      // minutes of freedom after a pee in the right place
function retry(p){
  if(!PETS[p].cycle) return null;
  const L = state.log.filter(e => e.p===p), now = Date.now(), calls = V[p].retryNones;
  let N = null, tries = 0;
  for(let i = L.length-1; i >= 0; i--){
    const e = L[i];
    if(e.k === 'pee') break;
    if(e.k === 'none'){ if(!N){ if(e.x || !calls.has(e)) return null; N = e; } if(calls.has(e)) tries++; }
  }
  if(!N) return null;
  if(L.some(e => e.k==='crate' && !isRetryStay(e) && e.t > N.t)) return null;   // an ordinary crate stay: the retry is over
  const C = L.filter(e => isRetryStay(e) && e.t >= N.t).pop() || null;           // the retry wait after this "nothing"
  if(!(C && C.end == null) && now - Math.max(N.t, C ? C.end : 0) > RETRY.life) return null;
  const until = C ? C.t + RETRY.wait : 0, sl = V[p].sleep;
  // In the crate: counting down; time is up -> "to the gravel"; she fell asleep (marked) -> wait for her to wake.
  const st = !C || C.end != null ? 'again' : sl.start && !sl.assumed ? 'asleep' : now < until ? 'wait' : 'due';
  return {none:N, crate:C, tries, until, state: st};
}
function freeTime(p){
  if(!PETS[p].cycle) return null;
  const pe = state.log.filter(e => e.p===p && e.k==='pee').pop(), now = Date.now();
  if(!pe || !(pe.w === 'gravel' || pe.w === 'out')) return null;
  if(state.log.some(e => e.p===p && e.k==='crate' && e.t > pe.t)) return null;   // back in the crate: free time is over
  const el = now - pe.t; if(el > (FREE.max + 20)*60000) return null;
  return {t:pe.t, phase: el < FREE.min*60000 ? 'run' : el < FREE.max*60000 ? 'end' : 'over'};
}
// One quiet row: what to do, and the two things that can happen. No questions.
// ONE CARD FOR THE RETRY AND THE GRAVEL (owner, 25.11): while a retry is on, its lines (try number, countdown /
// "לחצץ" / "when she wakes", ×) are the head of the gravel row, and the potty section moves to the top of the page.
// The same buttons and handlers as the separate card had; display only.
function retryHead(r){
  const txt = r.state === 'wait' ? `לנסות שוב בעוד <b class="rt-t" data-until="${r.until}">${mmss(r.until - Date.now())}</b>`
    : r.state === 'due' ? `<b class="rt-go">לחצץ</b>` : r.state === 'asleep' ? `כשהיא מתעוררת, ישר לחצץ` : `מה קרה בחצץ?`;
  return `<div class="rt-head"><span><small>ניסיון חוזר${r.tries > 1 ? ' '+r.tries : ''}</small><span class="rt-m">${txt}</span></span><button class="rt-x" data-act="rtstop" aria-label="לסיים את הניסיון החוזר" title="לסיים את הניסיון החוזר">×</button></div>`;
}
function retryAct(p, a, k, sure, t){
  const r = retry(p); if(!r) return;
  const C = r.crate, open = C && C.end == null, now = t || Date.now(), name = PETS[p].name;
  if(a === 'rtpee' || a === 'rtnone'){
    const kind = a === 'rtpee' ? 'pee' : 'none', d = !sure && !t && recentDouble(p, x => x.k === kind);
    if(d){ askAgain(d, ITEMS[kind].log, () => retryAct(p, a, k, true)); return; }
    if(contraGuard(p, kind, t, () => retryAct(p, a, k, true, t))) return;
    let e = {p, k: kind, t: now};
    commit(`${name} · ${ITEMS[e.k].log}`, () => { if(kind === 'none') endGravel(p, now); if(open) leaveCrate(p, now); if(kind === 'none') e = pushNone(p, now); else state.log.push(e); });
    stillCrying(p, now, () => { if(e.k === 'pee' && e.id) whereSheet(e.id); });
  }
  // Closing the card only hides it and unlocks play. What happened is still a retry if it turns out to be one.
  else if(a === 'rtstop') commit(`${name} · כרטיס הניסיון החוזר נסגר`, () => { const n = state.log.find(x => x.id === r.none.id); if(n) n.x = 1; });
}
// How the retries went in a period: how many there were, and how many ended with a pee in the right place
// (the next pee / poop / "nothing" after the stay, within RETRY.gap of its end).
function retryStats(p, from, to){
  const L = state.log.filter(e => e.p===p); let n = 0, good = 0;
  for(const c of L){
    if(c.k !== 'crate' || c.end == null || c.t < from || c.t >= to || !isRetryStay(c)) continue;
    n++;
    const next = L.find(e => (e.k==='pee' || e.k==='poop' || e.k==='none') && e.t >= c.end);
    if(next && next.k === 'pee' && next.t - c.end <= RETRY.gap && (next.w === 'gravel' || next.w === 'out')) good++;
  }
  return {n, good};
}
// Free time after a pee in the right place; locked while a retry is on.
function freeCardHTML(p){
  if(retry(p)) return `<div class="card slim locked"><span><b>חופש</b><small>אחרי פיפי</small></span>${ico('none','s')}</div>`;
  const f = freeTime(p); if(!f) return '';
  const a = f.t + FREE.min*60000, b = f.t + FREE.max*60000, span = `<bdi dir="ltr">${clock(a)}–${clock(b)}</bdi>`;
  const txt = f.phase === 'run' ? `עוד <span data-until="${a}">${mmss(a - Date.now())}</span> לפחות · עד ${span}`
    : f.phase === 'end' ? `זמן לסיים · עד <bdi dir="ltr">${clock(b)}</bdi>` : `זמן החופש נגמר · חזרה לשגרה`;
  return `<div class="card slim free ${f.phase}"><span><b>חופש: ${FREE.min}–${FREE.max} דקות</b><small>${txt}</small></span>${ico('paw','s')}</div>`;
}
// The tiles that move the routine on right now — they get a "עכשיו בשגרה" tag, so someone opening the
// app for the first time can see what to press without knowing how the wheel works.
function routineTap(p){
  const r = routine(p);
  if(!r || r.done) return ['crate'];
  if(r.brk || r.retry || r.free) return [];   // during a retry the card at the top says what to do; free time: nothing to press
  return r.i === 0 ? ['crate'] : r.i === 2 ? ['play','food'] : ['pee','poop','none'];
}
// Put the routine on hold (vet, a trip…): just an entry in the log. Whatever is logged next resumes it.
function goBreak(p){
  commit(`${PETS[p].name} · הפסקה בשגרה`, () => { const now = Date.now(); stopDur(p, 'sleep', now); state.log.push({p, k:'brk', t:now}); });
}
// Where she is in the trainer's routine. This is worked out from what was logged on the tiles — it is
// never stored and cannot be tapped — so the wheel and the tiles are one thing:
//   in the crate                                   → כלוב            (next: walk + potty)
//   out of the crate, nothing logged yet           → טיול וצרכים      (next: play)
//   a pee / poop / "nothing"                        → משחק            (next: food)
//   a meal, or "did not eat"                        → צרכים           (next: crate)
//   a pee / poop / "nothing" after that meal        → round done      (next: crate)
// Only entries since she last left the crate count (or since midnight when there is no stay yet today).
function routine(p){
  const S = V[p], now = Date.now(), day0 = sod(now).getTime(), rt = retry(p);
  // Going into the crate is always step 1 and always starts a round — also the short wait of a retry.
  if(S.crate.start) return {i:0, t:S.crate.start, next:1, retry:!!rt};
  const lastOut = Math.max(0, ...state.log.filter(e => e.p===p && e.k==='crate' && e.end != null).map(e => e.end));
  const out = lastOut >= day0 ? lastOut : 0, base = out || day0;
  const ev = state.log.filter(e => e.p===p && e.t >= base && !ITEMS[e.k].dur && !ITEMS[e.k].hid && !ITEMS[e.k].aux);
  const went = e => e.k==='pee' || e.k==='poop', isM = e => e.k==='nofood' || mealKind(e) === 'meal';   // a bite is not the round's meal: the wheel and the food timer agree
  const last = ev[ev.length-1];
  if(last && last.k === 'brk') return {brk:true, t:last.t, next:0};
  const meal = ev.filter(isM).pop();
  // "After the meal" is judged by position in the log, which is kept in time order.
  if(meal){ const mi = ev.indexOf(meal), after = ev.find((e, j) => went(e) && j > mi); return after ? {i:4, t:after.t, done:true, next:0} : {i:4, t:meal.t, next:0, retry:!!rt}; }
  const first = ev.find(went);

// The summary's grooming line (how many of each in the period) and the weight over time (every weighing, not only
// the period: there are few, and the trend is the point).
function groomSumHTML(p, from, to){
  const n = k => state.log.filter(e => e.p===p && e.k===k && e.t >= from && e.t < to).length;
  const parts = [['bath','מקלחות'], ['flea','ריסוסים'], ['brush','סירוקים'], ['teeth','צחצוחים']].map(([k, l]) => `${l} ${n(k)}`).join(' · ');
  const W = state.log.filter(e => e.p===p && e.k==='weight' && typeof e.kg === 'number').sort((x,y) => x.t - y.t);
  let chart = '';
  if(W.length){
    const t0 = W[0].t, t1 = Math.max(W[W.length-1].t, t0 + 86400000), lo = Math.min(...W.map(w => w.kg)), hi = Math.max(...W.map(w => w.kg)), pad = Math.max(.1, (hi - lo) * .2);
    const X = t => 20 + (t - t0) / (t1 - t0) * 260, Y = kg => 70 - (kg - (lo - pad)) / ((hi + pad) - (lo - pad)) * 56;
    const pts = W.map(w => `${X(w.t).toFixed(1)},${Y(w.kg).toFixed(1)}`).join(' ');
    chart = `<svg class="wchart" viewBox="0 0 300 92" role="img" aria-label="משקל לאורך זמן">
      ${W.length > 1 ? `<polyline points="${pts}" class="wl"/>` : ''}${W.map(w => `<circle cx="${X(w.t).toFixed(1)}" cy="${Y(w.kg).toFixed(1)}" r="3.5" class="wd"/><text x="${X(w.t).toFixed(1)}" y="${(Y(w.kg) - 8).toFixed(1)}" class="wt">${w.kg.toFixed(1)}</text>`).join('')}
      <text x="20" y="88" class="wx">${ddmm(t0)}</text>${W.length > 1 ? `<text x="280" y="88" class="wx" text-anchor="end">${ddmm(W[W.length-1].t)}</text>` : ''}</svg>`;
  }
  return `<h2>טיפוח ומשקל</h2><div class="card groomsum"><div class="sub">${parts}</div>${chart || '<div class="sub">עוד לא נרשם משקל</div>'}</div>`;
}
function toastOnly(m){   // a message with no undo (like the export's "copied")
  document.getElementById('toastMsg').textContent = m; document.getElementById('toastWhere').innerHTML = ''; lastUndo = null; document.getElementById('undo').hidden = true;
  const t = document.getElementById('toast'); t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}
async function noteCopy(p){
  const txt = notesOf(p).filter(e => !e.done).slice().reverse().map(e => { const d = new Date(e.t); return `${d.getDate()}.${d.getMonth()+1}: ${e.n}`; }).join('\n');
  const head = `הערות לווטרינר · ${PETS[p].name}\n`;
  try { await navigator.clipboard.writeText(head + txt); toastOnly('ההערות הועתקו'); }
  catch(_){ sh.innerHTML = `<h3>להעתיק את ההערות</h3><textarea class="note-ed" rows="8" readonly>${esc(head + txt)}</textarea><div class="foot"><span></span><button class="btn primary" id="cancel">סגירה</button></div>`; sh.querySelector('#cancel').onclick = close; bg.classList.add('show'); const ta = sh.querySelector('textarea'); ta.focus(); ta.select(); }

// WEIGHT: a number (kg, one decimal) and when.
function weightSheet(p){
  const name = PETS[p].name, w = weightOf(p).last;
  sheet(`${name} · משקל`, `<label class="field">משקל <input type="text" id="kgIn" inputmode="decimal" value="${w ? w.kg.toFixed(1) : ''}" placeholder="למשל 2.3" autocomplete="off" style="direction:ltr;width:6em"> ק״ג</label>
     <div class="sub" style="margin:10px 0 8px">מתי?</div>${dayPick(7)}<label class="field">בשעה ${timeField("tIn", nowStr())}</label>`,
    cancelBtn, () => {
      const el = sh.querySelector('#kgIn'), kg = Math.round(parseFloat(String(el.value).replace(',', '.')) * 10) / 10;
      if(!(kg >= 0.2 && kg <= 30)){ el.classList.add('bad'); el.focus(); return; }
      const v = timeVal('tIn'); if(!v) return;
      const t = Math.min(timeToTs(v), Date.now()); close();
      commit(`${name} · משקל ${kg.toFixed(1)} ק״ג`, () => state.log.push({p, k:'weight', t, kg}));
    });
}

// Things that are logged from the tiles, not from the wheel.
function logNoFood(p, sure, t){
  if(!sure && !t){ const d = recentDouble(p, e => e.k === 'nofood'); if(d){ askAgain(d, ITEMS.nofood.log, () => logNoFood(p, true)); return; } }
  if(contraGuard(p, 'nofood', t, () => logNoFood(p, true, t))) return;   // "לא אכלה" right after "אכלה"
  commit(`${PETS[p].name} · לא אכלה`, () => { state.log.push({p, k:'nofood', t: t || Date.now()}); });
  stillCrying(p, t || Date.now());
}
function logPlay(p, y, sure, t){
  if(!sure && !t){ const d = recentDouble(p, e => e.k === 'play' && e.y === y); if(d){ askAgain(d, 'משחק · ' + PLAY[y], () => logPlay(p, y, true)); return; } }
  commit(`${PETS[p].name} · משחק · ${PLAY[y]}`, () => {
    const now = t || Date.now();
    impliesOut(p, 'play', now);   // awake, wherever she is
    state.log.push({p, k:'play', t:now, y});
    // Play with food is a meal too — one meal per play session, however many food games are marked.
    if(PLAY_FOOD[y] && !state.log.some(e => e.p===p && e.k==='food' && e.y==='play' && now - e.t < 30*60000)){
      state.log.push({p, k:'food', t:now, y:'play'});
    }
  });
  stillCrying(p, t || Date.now());
}

function gravelRates(p, now = Date.now()){

  const wakes = V[p].spans.filter(s => s.end != null && s.end <= now).map(s => s.end);
